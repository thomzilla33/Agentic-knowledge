<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMS-OS — Voice Channel Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.35);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --muted: #64748b;
      --human: #8b5cf6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Widget Shell ── */
    .widget {
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      position: relative;
    }

    /* ── Header ── */
    .header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .brand { display: flex; align-items: center; gap: 8px; flex: 1; }
    .brand-dot {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .brand-name { font-size: 15px; font-weight: 600; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.03em;
      transition: all 0.3s;
    }
    .status-badge.idle     { background: rgba(100,116,139,0.15); color: var(--muted); border: 1px solid var(--border); }
    .status-badge.active   { background: rgba(34,197,94,0.15);  color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
    .status-badge.thinking { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
    .status-badge.human    { background: rgba(139,92,246,0.15); color: var(--human); border: 1px solid rgba(139,92,246,0.3); }
    .status-badge.ended    { background: rgba(239,68,68,0.1);   color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }

    /* ── Waveform Area ── */
    .viz-area {
      height: 140px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .viz-area canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .speaking-label {
      position: relative; z-index: 2;
      font-size: 12px; font-weight: 500;
      color: var(--muted);
      background: rgba(15,17,23,0.7);
      padding: 4px 12px; border-radius: 99px;
      border: 1px solid var(--border);
      transition: all 0.3s;
      backdrop-filter: blur(8px);
    }
    .speaking-label.user    { color: var(--success); border-color: rgba(34,197,94,0.3); }
    .speaking-label.agent   { color: #818cf8; border-color: rgba(99,102,241,0.3); }
    .speaking-label.human-agent { color: var(--human); border-color: rgba(139,92,246,0.3); }

    /* ── Transcript ── */
    .transcript {
      height: 200px;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .transcript::-webkit-scrollbar { width: 4px; }
    .transcript::-webkit-scrollbar-track { background: transparent; }
    .transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .bubble {
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: fadeSlideUp 0.25s ease;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bubble.user    { align-items: flex-end; }
    .bubble.agent   { align-items: flex-start; }
    .bubble.system  { align-items: center; }

    .bubble-label { font-size: 10px; color: var(--muted); font-weight: 500; }

    .bubble-text {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
    }
    .bubble.user  .bubble-text { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.agent .bubble-text { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .bubble.system .bubble-text {
      background: rgba(139,92,246,0.1); color: var(--human);
      border: 1px solid rgba(139,92,246,0.25); font-size: 12px;
      border-radius: 8px; text-align: center;
    }

    .interim-text {
      max-width: 85%; margin-left: auto;
      padding: 8px 12px; border-radius: 12px 12px 4px 12px;
      font-size: 13px; line-height: 1.5;
      background: rgba(99,102,241,0.12); border: 1px dashed rgba(99,102,241,0.3);
      color: #818cf8; font-style: italic;
    }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: var(--muted); text-align: center; font-size: 13px;
    }
    .empty-state .icon { font-size: 28px; opacity: 0.4; }

    /* ── Controls ── */
    .controls {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    /* Idle state: single big call button */
    .start-section {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .btn-start {
      width: 68px; height: 68px;
      border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: white; font-size: 26px;
      box-shadow: 0 0 0 0 var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-start:hover {
      transform: scale(1.07);
      box-shadow: 0 0 0 8px var(--accent-glow);
    }
    .btn-start:active { transform: scale(0.97); }
    .start-hint { font-size: 12px; color: var(--muted); }

    /* Active controls */
    .active-controls {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .btn-icon {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 18px; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .btn-icon:hover { background: var(--surface2); border-color: var(--muted); }
    .btn-icon.muted { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: var(--danger); }

    .btn-end {
      width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--danger); color: white; font-size: 22px;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .btn-end:hover { background: #dc2626; transform: scale(1.05); }
    .btn-end:active { transform: scale(0.96); }

    .btn-transfer {
      font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 8px;
      border: 1px dashed rgba(139,92,246,0.4); background: rgba(139,92,246,0.08);
      color: var(--human); cursor: pointer; transition: all 0.2s;
    }
    .btn-transfer:hover { background: rgba(139,92,246,0.15); border-style: solid; }

    /* ── Language selector ── */
    .lang-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px 0;
      font-size: 11px; color: var(--muted);
    }
    .lang-bar select {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 6px; font-size: 11px; cursor: pointer; outline: none;
    }

    /* ── Pulse ring for active state ── */
    .pulse-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: none;
      pointer-events: none;
    }
    .pulse-ring.animate {
      animation: pulseRing 1.5s ease-out infinite;
    }
    @keyframes pulseRing {
      0%   { width: 40px; height: 40px; opacity: 0.7; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .notice { font-size: 11px; color: var(--warning); padding: 8px 16px; text-align: center; background: rgba(245,158,11,0.08); border-top: 1px solid rgba(245,158,11,0.15); }
  </style>
</head>
<body>

<div class="widget">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-dot">🎙</div>
      <div>
        <div class="brand-name">AIMS-OS</div>
        <div class="brand-sub">Voice Channel</div>
      </div>
    </div>
    <div class="status-badge idle" id="statusBadge">Inactivo</div>
  </div>

  <!-- Language bar -->
  <div class="lang-bar">
    🌐 Idioma:
    <select id="langSelect">
      <option value="es-ES">Español</option>
      <option value="en-US">English</option>
      <option value="pt-BR">Português</option>
      <option value="fr-FR">Français</option>
    </select>
  </div>

  <!-- Waveform -->
  <div class="viz-area">
    <canvas id="waveCanvas"></canvas>
    <div class="pulse-ring" id="pulseRing"></div>
    <div class="speaking-label" id="speakingLabel">Silencio</div>
  </div>

  <!-- Transcript -->
  <div class="transcript" id="transcript">
    <div class="empty-state" id="emptyState">
      <div class="icon">🎙️</div>
      <div>Inicia la sesión para comenzar<br>la conversación por voz</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <!-- Idle -->
    <div class="start-section" id="startSection">
      <button class="btn-start" id="btnStart" title="Iniciar sesión de voz">📞</button>
      <div class="start-hint">Iniciar sesión de voz</div>
    </div>

    <!-- Active -->
    <div class="active-controls hidden" id="activeControls">
      <button class="btn-icon" id="btnMute" title="Silenciar">🎤</button>
      <button class="btn-transfer" id="btnTransfer">👤 Transferir a humano</button>
      <button class="btn-end" id="btnEnd" title="Terminar llamada">📵</button>
    </div>
  </div>

  <!-- Browser support notice -->
  <div class="notice hidden" id="notice"></div>
</div>

<script>
// ─────────────────────────────────────────────
//  AIMS-OS Voice Channel Prototype
//  Uses: Web Speech API (STT + TTS) + Web Audio API (waveform)
// ─────────────────────────────────────────────

const $ = id => document.getElementById(id);

// ── State Machine ──────────────────────────────
const STATES = { IDLE: 'idle', ACTIVE: 'active', THINKING: 'thinking', SPEAKING: 'speaking', HUMAN: 'human', ENDED: 'ended' };
let state = STATES.IDLE;
let isMuted = false;
let recognition = null;
let synth = window.speechSynthesis;
let audioCtx = null, analyser = null, micStream = null, animFrame = null;
let interimEl = null;

// ── Simulated AI Knowledge Base ───────────────
const LANG = () => $('langSelect').value;
const responses = {
  'es-ES': {
    greeting: ['Hola, soy el asistente de AIMS-OS. ¿En qué puedo ayudarte hoy?', 'Bienvenido al soporte de voz. ¿Cómo puedo asistirte?'],
    price: ['Nuestros planes empiezan desde $29 al mes para el plan básico, y $99 para el plan profesional. ¿Te gustaría más detalles?'],
    help: ['Puedo ayudarte con información de productos, soporte técnico, facturación o conectarte con un agente humano. ¿Qué necesitas?'],
    cancel: ['Para cancelar tu suscripción debes ir a Configuración > Facturación > Cancelar plan. También puedo transferirte con un agente para asistirte.'],
    human: ['Entendido, voy a transferirte con un agente humano. Por favor espera un momento.'],
    default: ['Entendí tu mensaje. Déjame consultar eso por ti... Dame un momento por favor.', 'Gracias por tu consulta. Estoy procesando tu solicitud.', '¿Podrías darme más detalles sobre lo que necesitas? Así puedo ayudarte mejor.'],
    transferNotice: 'Conectando con agente humano disponible...',
    humanGreeting: 'Hola, soy María del equipo de soporte. Ya revisé tu conversación. ¿En qué puedo ayudarte?',
    thinking: 'Procesando...',
  },
  'en-US': {
    greeting: ['Hello, I\'m the AIMS-OS assistant. How can I help you today?', 'Welcome to voice support. How can I assist you?'],
    price: ['Our plans start at $29/month for the basic plan, and $99 for the professional plan. Would you like more details?'],
    help: ['I can help you with product information, technical support, billing, or connect you with a human agent. What do you need?'],
    cancel: ['To cancel your subscription go to Settings > Billing > Cancel Plan. I can also transfer you to an agent for assistance.'],
    human: ['Understood, I\'ll transfer you to a human agent. Please hold on.'],
    default: ['I understood your message. Let me look into that for you... One moment please.', 'Thank you for your query. I\'m processing your request.', 'Could you give me more details about what you need? That way I can help you better.'],
    transferNotice: 'Connecting to available human agent...',
    humanGreeting: 'Hi, I\'m Sarah from the support team. I\'ve already reviewed your conversation. How can I help you?',
    thinking: 'Processing...',
  },
  'pt-BR': {
    greeting: ['Olá, sou o assistente AIMS-OS. Como posso te ajudar hoje?'],
    price: ['Nossos planos começam em R$149/mês para o plano básico. Gostaria de mais detalhes?'],
    help: ['Posso ajudar com informações de produtos, suporte técnico ou conectar você com um agente humano.'],
    cancel: ['Para cancelar sua assinatura vá em Configurações > Cobrança > Cancelar Plano.'],
    human: ['Certo, vou te transferir para um agente humano. Por favor aguarde.'],
    default: ['Entendi sua mensagem. Deixa eu verificar isso pra você...', 'Obrigado pela sua consulta. Estou processando sua solicitação.'],
    transferNotice: 'Conectando com agente humano disponível...',
    humanGreeting: 'Olá, sou a Ana da equipe de suporte. Já revisei sua conversa. Como posso ajudar?',
    thinking: 'Processando...',
  },
  'fr-FR': {
    greeting: ['Bonjour, je suis l\'assistant AIMS-OS. Comment puis-je vous aider?'],
    price: ['Nos forfaits commencent à 29€/mois pour le plan de base. Voulez-vous plus de détails?'],
    help: ['Je peux vous aider avec les produits, le support technique ou vous connecter à un agent humain.'],
    cancel: ['Pour annuler votre abonnement, allez dans Paramètres > Facturation > Annuler.'],
    human: ['Compris, je vais vous transférer à un agent humain. Veuillez patienter.'],
    default: ['J\'ai compris votre message. Laissez-moi vérifier cela pour vous...', 'Merci pour votre demande. Je traite votre requête.'],
    transferNotice: 'Connexion à un agent humain disponible...',
    humanGreeting: 'Bonjour, je suis Claire de l\'équipe support. J\'ai déjà consulté votre conversation. Comment puis-je vous aider?',
    thinking: 'Traitement en cours...',
  },
};

function t(key) {
  const lang = LANG();
  const base = responses[lang] || responses['es-ES'];
  const arr = base[key] || responses['es-ES'][key] || ['...'];
  return Array.isArray(arr) ? arr[Math.floor(Math.random() * arr.length)] : arr;
}

function matchIntent(text) {
  const lower = text.toLowerCase();
  if (/precio|costo|plan|pric|cost|plan|preço|forfait|tarif/.test(lower)) return 'price';
  if (/ayuda|help|soporte|suporte|aide/.test(lower)) return 'help';
  if (/cancel|baja|eliminar|annuler/.test(lower)) return 'cancel';
  if (/humano|person|agente|human|agent|personne/.test(lower)) return 'human';
  return 'default';
}

// ── UI Updates ─────────────────────────────────
function setState(newState) {
  state = newState;
  const badge = $('statusBadge');
  const labels = {
    [STATES.IDLE]:     ['Inactivo', 'idle'],
    [STATES.ACTIVE]:   ['En escucha', 'active'],
    [STATES.THINKING]: ['Procesando', 'thinking'],
    [STATES.SPEAKING]: ['Respondiendo', 'thinking'],
    [STATES.HUMAN]:    ['Agente Humano', 'human'],
    [STATES.ENDED]:    ['Finalizado', 'ended'],
  };
  const [text, cls] = labels[newState] || ['', 'idle'];
  badge.textContent = text;
  badge.className = `status-badge ${cls}`;
}

function setSpeakingLabel(who) {
  const el = $('speakingLabel');
  const map = {
    user:        ['🎙 Tú estás hablando', 'user'],
    agent:       ['🤖 Agente hablando', 'agent'],
    human_agent: ['👤 Agente humano', 'human-agent'],
    silence:     ['Silencio', ''],
    thinking:    ['💭 Procesando...', ''],
  };
  const [text, cls] = map[who] || ['', ''];
  el.textContent = text;
  el.className = `speaking-label ${cls}`;
}

function pulse(on) {
  $('pulseRing').className = `pulse-ring${on ? ' animate' : ''}`;
}

// ── Transcript ─────────────────────────────────
function addBubble(role, text) {
  $('emptyState')?.remove();
  const wrap = document.createElement('div');
  wrap.className = `bubble ${role}`;
  const label = { user: 'Tú', agent: '🤖 AIMS-OS', system: '⚡ Sistema', human_agent: '👤 Agente Humano' }[role] || role;
  wrap.innerHTML = `<div class="bubble-label">${label}</div><div class="bubble-text">${text}</div>`;
  $('transcript').appendChild(wrap);
  $('transcript').scrollTop = $('transcript').scrollHeight;
}

function setInterim(text) {
  if (!interimEl) {
    interimEl = document.createElement('div');
    interimEl.className = 'interim-text';
    $('transcript').appendChild(interimEl);
  }
  interimEl.textContent = text;
  $('transcript').scrollTop = $('transcript').scrollHeight;
}

function clearInterim() {
  interimEl?.remove();
  interimEl = null;
}

// ── TTS (SpeechSynthesis) ──────────────────────
function speak(text, onEnd, role = 'agent') {
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = LANG();
  utter.rate = 1.05;
  utter.pitch = role === 'human_agent' ? 1.1 : 0.95;

  // Pick a voice if available
  const voices = synth.getVoices();
  const match = voices.find(v => v.lang.startsWith(LANG().split('-')[0]));
  if (match) utter.voice = match;

  utter.onend = () => { if (onEnd) onEnd(); };
  utter.onerror = () => { if (onEnd) onEnd(); };
  synth.speak(utter);
}

// ── STT (Web Speech Recognition) ──────────────
function startRecognition() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    showNotice('⚠️ Web Speech API no disponible en este navegador. Usa Chrome o Edge para el prototipo completo.');
    return false;
  }

  recognition = new SpeechRec();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = LANG();

  recognition.onstart = () => { setState(STATES.ACTIVE); };

  recognition.onresult = (e) => {
    if (isMuted) return;
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (interim) { setInterim(interim); pulse(true); setSpeakingLabel('user'); }
    if (final)   { handleFinalTranscript(final.trim()); }
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    console.warn('STT error:', e.error);
  };

  recognition.onend = () => {
    if (state !== STATES.IDLE && state !== STATES.ENDED) {
      try { recognition.start(); } catch(_) {}
    }
  };

  recognition.start();
  return true;
}

function handleFinalTranscript(text) {
  if (!text) return;
  clearInterim();
  pulse(false);
  setSpeakingLabel('silence');
  addBubble('user', text);

  // If human agent is active — just show user's text, no AI response
  if (state === STATES.HUMAN) return;

  // Detect intent
  const intent = matchIntent(text);
  setState(STATES.THINKING);
  setSpeakingLabel('thinking');

  setTimeout(() => {
    const reply = t(intent);
    addBubble('agent', reply);
    setState(STATES.SPEAKING);
    setSpeakingLabel('agent');

    speak(reply, () => {
      if (state === STATES.SPEAKING) {
        setState(STATES.ACTIVE);
        setSpeakingLabel('silence');
      }
      // If intent was "human", trigger handoff after speaking
      if (intent === 'human' && state !== STATES.IDLE) {
        setTimeout(() => triggerHumanInLoop(), 800);
      }
    });
  }, 900 + Math.random() * 600); // simulate thinking delay
}

// ── Human in the Loop ──────────────────────────
function triggerHumanInLoop() {
  if (state === STATES.HUMAN) return;
  synth.cancel();
  setState(STATES.HUMAN);
  setSpeakingLabel('human_agent');
  addBubble('system', t('transferNotice'));

  setTimeout(() => {
    const greeting = t('humanGreeting');
    addBubble('human_agent', greeting);
    speak(greeting, null, 'human_agent');
  }, 1800);

  $('btnTransfer').textContent = '✅ Transferido';
  $('btnTransfer').disabled = true;
  $('btnTransfer').style.opacity = '0.5';
}

// ── Web Audio Waveform ─────────────────────────
function startWaveform(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const source = audioCtx.createMediaStreamSource(stream);
  source.connect(analyser);

  const canvas = $('waveCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resize();
  new ResizeObserver(resize).observe(canvas);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function draw() {
    animFrame = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);

    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const bars = 40;
    const barW = W / bars - 2;
    const isUserSpeaking = state === STATES.ACTIVE;

    for (let i = 0; i < bars; i++) {
      const val = data[Math.floor(i * data.length / bars)] / 255;
      const barH = isUserSpeaking && !isMuted
        ? Math.max(4, val * H * 0.85)
        : 4 + Math.sin(Date.now() / 400 + i) * 3; // idle ripple

      const x = i * (barW + 2) + 1;
      const y = (H - barH) / 2;

      const alpha = isUserSpeaking && !isMuted ? 0.6 + val * 0.4 : 0.25;
      const color = state === STATES.HUMAN
        ? `rgba(139,92,246,${alpha})`
        : state === STATES.SPEAKING
          ? `rgba(129,140,248,${alpha})`
          : `rgba(99,102,241,${alpha})`;

      ctx.fillStyle = color;
      const r = Math.min(barW / 2, 4);
      ctx.beginPath();
      ctx.roundRect(x, y, barW, barH, r);
      ctx.fill();
    }
  }
  draw();
}

function stopWaveform() {
  if (animFrame) cancelAnimationFrame(animFrame);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  const canvas = $('waveCanvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

// ── Session Start / End ────────────────────────
async function startSession() {
  $('startSection').classList.add('hidden');
  $('activeControls').classList.remove('hidden');
  $('emptyState')?.remove();
  $('langSelect').disabled = true;
  pulse(true);

  // Request mic
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    startWaveform(micStream);
  } catch(e) {
    showNotice('⚠️ No se pudo acceder al micrófono. El waveform estará deshabilitado.');
  }

  // Greeting
  const greeting = t('greeting');
  addBubble('agent', greeting);
  setState(STATES.SPEAKING);
  setSpeakingLabel('agent');

  speak(greeting, () => {
    setState(STATES.ACTIVE);
    setSpeakingLabel('silence');
    pulse(false);
    startRecognition();
  });
}

function endSession() {
  synth.cancel();
  recognition?.stop();
  stopWaveform();
  micStream?.getTracks().forEach(t => t.stop());
  pulse(false);
  setState(STATES.ENDED);
  setSpeakingLabel('silence');
  $('activeControls').classList.add('hidden');
  $('startSection').classList.remove('hidden');
  $('btnStart').textContent = '🔄';
  $('btnStart').title = 'Nueva sesión';
  document.querySelector('.start-hint').textContent = 'Sesión finalizada — Iniciar nueva';
  $('langSelect').disabled = false;
  $('btnTransfer').textContent = '👤 Transferir a humano';
  $('btnTransfer').disabled = false;
  $('btnTransfer').style.opacity = '1';
  addBubble('system', '— Sesión de voz finalizada —');
}

function toggleMute() {
  isMuted = !isMuted;
  const btn = $('btnMute');
  btn.textContent = isMuted ? '🔇' : '🎤';
  btn.classList.toggle('muted', isMuted);
  btn.title = isMuted ? 'Activar micrófono' : 'Silenciar';
}

function showNotice(msg) {
  const el = $('notice');
  el.textContent = msg;
  el.classList.remove('hidden');
}

// ── Wire Events ────────────────────────────────
$('btnStart').addEventListener('click', startSession);
$('btnEnd').addEventListener('click', endSession);
$('btnMute').addEventListener('click', toggleMute);
$('btnTransfer').addEventListener('click', triggerHumanInLoop);
$('langSelect').addEventListener('change', () => {
  if (recognition) { recognition.lang = LANG(); }
});

// Preload voices
synth.onvoiceschanged = () => synth.getVoices();

// Browser check
if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
  showNotice('⚠️ Usa Chrome o Edge para activar reconocimiento de voz en este prototipo.');
}
</script>
