TABLES.forEach(t=>{ t.rels = t.cols.filter(c=>c.t==='Reference').map(c=>({via:c.n, target:c.ref, kind:c.uq?'one-to-one':'many-to-one', onDelete:'restrict', onUpdate:'cascade', req:!!c.req})); });
function _refId(ref){ return (ref||'').replace(/\s*\(dictionary\)\s*/,'').trim(); }
function _refTable(ref){ return _table(_refId(ref)); }
function _invKind(k){ return k==='many-to-one'?'one-to-many':k==='one-to-one'?'one-to-one':'many-to-many'; }

function relationshipsTab(t){
  const out=t.rels||[];
  const incoming=TABLES.filter(x=>x.id!==t.id).flatMap(x=>(x.rels||[]).filter(r=>_refId(r.target)===t.id).map(r=>({from:x.id, fromAlias:x.alias, via:r.via, kind:_invKind(r.kind)})));
  return `
   <div class="dsec"><div class="dsec-h"><div class="dsec-t">Outgoing<span class="dsec-sub">this table references other tables (${out.length})</span></div>
     <button class="btn btn-primary" style="height:36px" onclick="openAddRelationship('${t.id}')"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Add relationship</button></div>
     ${out.length?`<div class="dcard">${out.map(r=>relRow(t,r)).join('')}</div>`:`<div class="placeholder" style="padding:24px">No outgoing relationships.</div>`}</div>
   <div class="dsec"><div class="dsec-h"><div class="dsec-t">Incoming<span class="dsec-sub">other tables reference this one (${incoming.length}) · read-only</span></div></div>
     ${incoming.length?`<div class="dcard">${incoming.map(r=>`<div class="drow"><span class="drow-name">${escapeHtml(r.fromAlias)}</span><span class="col-mono">.${escapeHtml(r.via)}</span>${_ARROW}<span class="drow-name">${escapeHtml(t.alias)}</span><span class="card-badge">${r.kind}</span><span class="drow-meta"><span class="drow-link" onclick="navigate('tables/${r.from}')">Open →</span></span></div>`).join('')}</div>`:`<div class="placeholder" style="padding:24px">No incoming relationships.</div>`}</div>`;
}
function relRow(t,r){
  const tgt=_refTable(r.target);
  return `<div class="drow"><span class="drow-name">${escapeHtml(t.alias)}</span><span class="col-mono">.${escapeHtml(r.via)}</span>${_ARROW}<span class="drow-name">${escapeHtml(tgt?tgt.alias:_refId(r.target))}</span>${!tgt?'<span class="mini-badge mb-secondary">external</span>':''}<span class="card-badge">${r.kind}</span><span class="drow-meta"><span class="ondel">on delete: ${r.onDelete}</span>${tgt?`<span class="drow-link" onclick="navigate('tables/${tgt.id}')">Open →</span>`:''}</span></div>`;
}
function openAddRelationship(tid){
  const t=_table(tid);
  const opts=TABLES.filter(x=>x.id!==tid).map(x=>`<option value="${x.id}">${escapeHtml(x.alias)}</option>`).join('');
  $('modalScrim').innerHTML=`<div class="modal"><div class="modal-head"><div class="modal-ic" style="background:var(--tag-purple-bg);color:var(--tag-purple-fg);border-color:var(--tag-purple-bd)"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 10a3 3 0 0 1 0-4l1-1a3 3 0 0 1 4 4M10 6a3 3 0 0 1 0 4l-1 1a3 3 0 0 1-4-4" stroke-linecap="round"/></svg></div><div class="modal-title">Add relationship</div></div>
   <div class="modal-body"><div class="mform">
     <div class="mfield"><label class="mfield-l">Type</label><select class="mselect" id="arKind"><option value="many-to-one">Many-to-one — FK on ${escapeHtml(t.alias)}</option><option value="one-to-one">One-to-one</option><option value="one-to-many">One-to-many</option><option value="many-to-many">Many-to-many — junction table</option></select></div>
     <div class="mfield"><label class="mfield-l">Related table</label><select class="mselect" id="arTarget">${opts}</select></div>
     <div class="mfield"><label class="mfield-l">Via column</label><input class="minput" id="arVia" placeholder="e.g. vehicle_id" autocomplete="off"></div>
     <div class="mrow"><div class="mfield"><label class="mfield-l">On delete</label><select class="mselect" id="arDel"><option>restrict</option><option>cascade</option><option>set null</option></select></div><div class="mfield"><label class="mfield-l">On update</label><select class="mselect" id="arUpd"><option>cascade</option><option>restrict</option></select></div></div>
   </div></div>
   <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveRelationship('${tid}')">Add relationship</button></div></div>`;
  $('modalScrim').classList.add('open');
  setTimeout(()=>{const sel=$('arTarget'),via=$('arVia'); const upd=()=>{ if(via&&!via.value) via.value=sel.value+'_id'; }; if(sel){sel.onchange=upd; upd();}},30);
}
function saveRelationship(tid){
  const t=_table(tid); const kind=$('arKind').value, target=$('arTarget').value, via=($('arVia').value||target+'_id').trim(), del=$('arDel').value, upd=$('arUpd').value;
  if(kind==='many-to-many'){ closeModal(); toast('Junction table “'+tid+'_'+target+'” created','ok'); }
  else {
    t.rels.push({via, target, kind, onDelete:del, onUpdate:upd, req:false});
    if((kind==='many-to-one'||kind==='one-to-one') && !t.cols.find(c=>c.n===via)){
      t.cols.push({n:via, d:via.replace(/_/g,' ').replace(/^\w/,ch=>ch.toUpperCase()), t:'Reference', ref:target, uq:kind==='one-to-one'||undefined, desc:'Relationship to '+target+'.'});
      t._rows=null;
    }
    if(t.status==='Published') t.status='Draft'; closeModal(); toast('Relationship added','ok');
  }
  renderTableDetail(tid);
}

let dataState = { search:'', page:1 };
function _mockId(i){ return 'a'+(1000+i).toString(16)+'e'+(2000+i); }
function _mockVal(c,i){
  if(c.t==='Enum'&&c.ev) return c.ev[(i)%c.ev.length][0];
  if(c.t==='Boolean') return i%2===0;
  if(c.t==='Integer') return 50+((i*37)%950);
  if(c.t==='Decimal') return (100+((i*137)%9000)/10).toFixed(2);
  if(c.t==='Date') return '2026-'+String(1+i%9).padStart(2,'0')+'-'+String(10+i%18).padStart(2,'0');
  if(c.t==='Timestamp') return '2026-'+String(1+i%9).padStart(2,'0')+'-'+String(10+i%18).padStart(2,'0')+' 1'+(i%9)+':30';
  if(c.t==='UUID') return _mockId(i);
  if(c.t==='Reference') return '#'+(1000+((i*7)%400));
  const nm=c.n;
  if(nm==='email') return ['maria','james','ana','carlos','emily','diego'][i%6]+'.'+(1000+i)+'@example.com';
  if(nm==='vin'||nm==='sku'||nm==='code'||nm.includes('number')) return nm.slice(0,3).toUpperCase()+'-'+(10000+i*13);
  const pools={first_name:['María','James','Ana','Carlos','Emily','Diego','Sarah','Luis'],last_name:['González','Smith','Pérez','Chen','Vargas','Kim','Park','Torres'],model:['Camry','F-150','Civic','Model 3','Silverado','CX-5'],color:['White','Black','Silver','Blue','Red'],name:['Brake pad','Oil filter','Alternator','Spark plug'],location:['Bay A','Bay B','Warehouse 1','Warehouse 2']};
  if(pools[nm]) return pools[nm][i%pools[nm].length];
  return (c.d||nm)+' '+(i+1);
}
function _mockRows(t){
  if(t._rows) return t._rows;
  if(!t.cols.length){ t._rows=[]; return t._rows; }   // brand-new table has no data yet
  const rows=[]; for(let i=0;i<18;i++){ const r={__id:_mockId(i)}; t.cols.forEach(c=>{ r[c.n]=_mockVal(c,i); }); rows.push(r); }
  t._rows=rows; return rows;
}
function _fmtVal(c,v){
  if(v==null||v==='') return '<span style="color:var(--field-placeholder)">—</span>';
  if(c.t==='Boolean') return v?'<span style="color:var(--tag-success-fg)">✓ Yes</span>':'<span style="color:var(--field-placeholder)">No</span>';
  if(c.t==='Enum'&&c.ev){ const m=c.ev.find(e=>e[0]===v); return escapeHtml(m?m[1]:v); }
  if(c.t==='Decimal'&&c.fmt&&c.fmt.indexOf('$')>-1) return '$'+escapeHtml(String(v));
  if(c.t==='Reference') return '<span style="color:var(--primary)">'+escapeHtml(String(v))+'</span>';
  return escapeHtml(String(v));
}
function dataSearchInput(tid,v){ dataState.search=v; dataState.page=1; renderTableDetail(tid); setTimeout(()=>{const el=$('dataSearch'); if(el){el.focus(); el.setSelectionRange(v.length,v.length);}},0); }
function dataSetPage(tid,p){ dataState.page=p; renderTableDetail(tid); }
function dataRefresh(tid){ toast('Data refreshed','ok'); renderTableDetail(tid); }

     <button class="btn" style="height:36px" onclick="toast('Exported ${filtered.length} rows to CSV','ok')"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg> Export</button>
     <button class="btn btn-primary" style="height:36px" onclick="openAddRecord('${t.id}')"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Add record</button></div>
   <div class="dtable"><div class="dtable-h" style="${gt}"><span>ID</span>${cols.map(c=>`<span>${escapeHtml(c.d)}</span>`).join('')}<span></span></div>
     ${vis.length?vis.map(r=>`<div class="dtable-r" style="${gt}" onclick="openRecord('${t.id}',${rows.indexOf(r)})"><span class="dcell mono">${escapeHtml(r.__id)}</span>${cols.map(c=>`<span class="dcell">${_fmtVal(c,r[c.n])}</span>`).join('')}<div class="erow-chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`).join(''):`<div class="empty" style="padding:40px">${dataState.search?`No records match “${escapeHtml(dataState.search)}”.`:(t.cols.length?'No records yet.':'Add columns to this table, then add records.')}</div>`}

   <div class="pgn"><span>Page <b>${page}</b> of <b>${pages}</b> · ${filtered.length} records${cols.length<t.cols.length?` · showing ${cols.length} of ${t.cols.length} columns`:''}</span></div>`;
}

}

function saveRecord(tid, idx){
  const t=_table(tid); const rows=_mockRows(t);
  const rec = idx>=0 ? rows[idx] : {__id:_mockId(rows.length)};

function saveRefValue(refId, code){
  const r=_ref(refId);

    const v=r.values.find(x=>x.code===code); if(!v) return;
    v.label=label; v.description=desc; v.valid_from=from; v.valid_to=to; v.active=active;

function saveNewEntity(){
  const name=($('ceName').value||'').trim(); if(!name){ toast('Enter a name'); return; }
  const id=_slug(name); if(!id){ toast('Enter a valid name'); return; }
  if(ENTITIES.find(e=>e.id===id)){ toast('An entity with that name already exists'); return; }
  const model=$('ceModel').value, domain=$('ceDomain').value, desc=($('ceDesc').value||'').trim();
  // auto-create the primary table
  TABLES.unshift({id, alias:name, entity:name, entityId:id, role:'primary', published:false, desc:desc||('Primary table for '+name+'.'), cols:[], rels:[]});
  ENTITIES.unshift({id, name, model, domain, status:'Draft', updated:'just now', owner:'sc', collab:[], external:0, records:'0', tags:[], desc,

function applyScope(){

  document.querySelectorAll('[data-version]').forEach(el=>{ const ti=SCOPE_TIERS.indexOf(el.getAttribute('data-version')); el.style.display = (ti>=0 && ti<=si)?'':'none'; });

function _agoOrder(s){ // rough recency rank: "just now" < "Nh"/"Nd ago" < explicit dates
  s=String(s); if(/just now/.test(s)) return 0; const m=s.match(/^(\d+)([hd])/); if(m) return (m[2]==='h'?1:100)*(+m[1]); if(/ago/.test(s)) return 500; const d=Date.parse(s); return isNaN(d)?9e14:(9e15-d)/1e9; }
function _mSorted(arr){ const {sortCol,sortDir}=modelsState; const s=arr.slice().sort((a,b)=>{ const va=_mSortVal(a,sortCol),vb=_mSortVal(b,sortCol); const c=va<vb?-1:va>vb?1:0; return sortDir==='asc'?c:-c; }); return s; }
function _modelsFiltered(){

const _ENT_POOL=[

  {name:'Comment', pii:false,t:3, cols:7},
  {name:'Status',  pii:true, t:3, cols:10},

function _md(m){
  if(_mdCache[m.id]) return _mdCache[m.id];
  const team=[m.owner].concat(m.collab||[]); const pick=i=>team[i%team.length];
  const real=_modelEntities(m.id);
  let ents;
  if(real.length){
    ents=real.map(e=>({ id:e.id, name:e.name, real:true,
      pii:(e.tags||[]).some(t=>['customer-360','gdpr','core','pii'].includes(t))||e.domain==='Customer-facing',
      tables:e.tables.length, cols:e.tables.reduce((n,t)=>n+t.cols,0),
      status:e.status, owner:e.owner, updated:e.updated, desc:e.desc }));
  } else {
    const pool=_ENT_POOL.slice(0, Math.max(3, Math.min(_ENT_POOL.length, m.entities)));
    ents=pool.map((p,i)=>({ id:_slug(p.name), name:p.name, real:false, pii:p.pii,
      tables:p.t, cols:p.cols, status:p.draft?'Draft':'Published', owner:pick(i), updated:_AGO[i%_AGO.length],
      desc: i===0
        ? `The ${p.name.toLowerCase()} entity is the backbone of this model. It captures the canonical record for every ${p.name.toLowerCase()} and the identity columns that everything else joins against.`
        : `The ${p.name.toLowerCase()} entity and its records.` }));
  }
  const tables=[]; const SF=[{s:'',code:'',role:'Primary'},{s:' Detail',code:'_detail',role:'Secondary'},{s:' Link',code:'_link',role:'Secondary'}];
  ents.forEach(e=>{ for(let k=0;k<e.tables;k++){ const sf=SF[Math.min(k,2)]; const isP=k===0;
    const code=_slug(e.name)+sf.code+(k>2?('_'+k):'');
    tables.push({ id:m.id+'__'+code, name:e.name+sf.s, code, entity:e.name, entityId:e.id, role:isP?'Primary':sf.role,
      pii:isP&&e.pii, cols:isP?Math.max(4,Math.round(e.cols*0.55)):Math.max(3,Math.round(e.cols*0.4)),
      rel:isP?2:1, status:e.status, owner:e.owner, updated:e.updated,
      desc:isP?`The primary table backing the ${e.name} entity. Stores the canonical record and identity columns that everything else joins against.`
              :`Holds the extended descriptive attributes for each ${e.name}, kept separate from the core record to keep the primary table lean.` }); } });
  const dg=_diagModel2(m,ents);
  const relations=dg.edges.length;
  const others=MODELS.filter(x=>x.id!==m.id);
  const crossN=Math.max(2, Math.min(5, Math.round(ents.length*0.55)));
  const crossTargets=others.slice(0,crossN).map(x=>x.name);
  const e=ents.length;
  const wN=Math.max(3,Math.min(6,Math.round(e*0.6))), qN=Math.max(2,Math.min(4,Math.round(e*0.35))), meN=Math.max(2,Math.min(5,Math.round(e*0.45))), dsN=e>=12?1:0;
  const STUD=['Exec summary','Team board','Sales studio · Overview','Ops studio · Live','Finance · Monthly'];
  const WT=['Timeline','Table','Timeline','Timeline','Table','Chart'];
  const WN=[m.name+' overview','Status breakdown','Trend by month','Top records','Recent activity','Distribution'];
  const widgets=Array.from({length:wN},(_,i)=>({name:WN[i%WN.length],type:WT[i%WT.length],studio:STUD[i%STUD.length],entity:ents[i%e].name,owner:pick(i)}));
  const queries=Array.from({length:qN},(_,i)=>({name:['Active by owner','Monthly rollup','Unresolved > 30d','Top 100 by value'][i%4],entity:ents[(i+1)%e].name,owner:pick(i+1),rows:['1.2K','340','88','5.0K'][i%4]}));
  const metrics=Array.from({length:meN},(_,i)=>({name:['Total records','Weekly growth','Avg resolution','Data freshness','Coverage %'][i%5],entity:ents[(i+2)%e].name,owner:pick(i+2),val:['48.2K','+3.4%','4.1h','98%','92%'][i%5]}));
  const datasets=Array.from({length:dsN},(_,i)=>({name:m.name+' rollup',entity:ents[0].name,owner:m.owner,rows:'12.4K'}));
  const compTotal=wN+qN+meN+dsN;
  const draftEnts=ents.filter(x=>x.status!=='Published').length;
  const activity=[
    {t:'Published 3 changes', who:m.owner, when:'1d ago', major:true},
    {t:'Added 2 columns to '+ents[0].name, who:pick(1), when:'2d ago'},
    {t:'Created entity '+ents[Math.min(e-1,8)].name, who:m.owner, when:'4d ago'},
    {t:'Renamed '+ents[Math.min(1,e-1)].name+' fields', who:m.owner, when:'May 18, 2026'},
    {t:'Model created', who:m.owner, when:'May 2, 2026', major:true},
  ];
  const md={ ents, tables, relations, crossN, crossTargets, dg, widgets, queries, metrics, datasets, compTotal, activity, draftEnts,
    counts:{entities:ents.length, tables:tables.length, components:compTotal} };
  _mdCache[m.id]=md; return md;
}
function _diagModel2(m, ents){
  const names=ents.map(e=>e.name); const n=names.length, W=640, H=320, mx=84, my=66, seed=m.id.length;
  const nodes=names.map((label,i)=>{ const t=n>1?i/(n-1):0.5; return {label,i,
    x: mx + t*(W-2*mx),
    y: H/2 + Math.sin(t*Math.PI*2 + seed)*(H/2-my)*0.72 + (((i*29+seed*7)%22)-11) }; });
  const edges=[]; for(let i=0;i<n-1;i++) edges.push([i,i+1]); for(let i=0;i+2<n;i+=3) edges.push([i,i+2]);
  return {nodes, edges, W, H};
}
function _mdDiagram(m, md){
  const d=md.dg;

    return {label, ni, x: Math.max(60,Math.min(d.W-60, nd.x + (k-1)*46)), y: up?24:d.H-24}; });
  return `<div class="diag-wrap md-diag">
    <svg id="diagSvg" class="diag-svg" viewBox="0 0 ${d.W} ${d.H}" preserveAspectRatio="xMidYMid meet">
      <g id="diagG">
        ${cross.map(c=>`<line class="diag-edge diag-cross" x1="${d.nodes[c.ni].x.toFixed(1)}" y1="${d.nodes[c.ni].y.toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`).join('')}
        ${d.edges.map(([a,b])=>`<line class="diag-edge" data-a="${a}" data-b="${b}" x1="${d.nodes[a].x.toFixed(1)}" y1="${d.nodes[a].y.toFixed(1)}" x2="${d.nodes[b].x.toFixed(1)}" y2="${d.nodes[b].y.toFixed(1)}"/>`).join('')}
        ${cross.map(c=>`<text class="diag-cross-lbl" x="${c.x.toFixed(1)}" y="${(c.y<40?c.y-8:c.y+16).toFixed(1)}">${escapeHtml(c.label)}</text>`).join('')}
        ${d.nodes.map(nd=>`<g class="diag-node" data-i="${nd.i}" transform="translate(${nd.x.toFixed(1)},${nd.y.toFixed(1)})" onmouseenter="_diagHover(${nd.i})" onmouseleave="_diagHover(-1)" onclick="event.stopPropagation();_diagClick('${escapeHtml(nd.label)}')">
          <rect class="diag-box" x="-34" y="-12" width="68" height="24" rx="5"/>
          <rect class="diag-top" x="-34" y="-12" width="68" height="3" rx="1.5"/>
          <text class="diag-label" x="0" y="1">${escapeHtml(nd.label)}</text>
        </g>`).join('')}
      </g>
    </svg>
    <div class="diag-ctrls">
      <button class="diag-btn" title="Zoom in" onclick="_diagZoom(1.2)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="diag-btn" title="Zoom out" onclick="_diagZoom(0.83)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
      <button class="diag-btn" title="Reset layout" onclick="_diagReset()"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M8 2.5v11" opacity=".55"/></svg></button>
    </div>
    <div class="diag-hint md-diag-hint"><span class="diag-hint-txt">Hover an entity to trace its relations · click to inspect · drag to pan</span></div>
    <div class="diag-legend"><span><span class="lg-line"></span>Relation</span><span><span class="lg-line lg-dash"></span>Cross-model</span></div>
  </div>`;
}

function _fltCfg(surface){
  const uniq=a=>[...new Set(a)];
  const cnt=(rows,key,val)=>rows.filter(r=>r[key]===val).length;
  const tagOpts=rows=>uniq(rows.flatMap(r=>r.tags||[])).sort().map(v=>({value:v,label:v,count:rows.filter(r=>(r.tags||[]).includes(v)).length}));
  if(surface==='entities'){ const rows=ENTITIES; return {label:'Entities', state:listState, render:renderEntities, groups:[
    {key:'model',label:'Model',options:uniq(rows.map(r=>r.model)).map(v=>({value:v,label:(_model(v)||{name:v}).name,count:cnt(rows,'model',v)}))},

function _tplThumb(seed){
  const n=7, W=190, H=104, cx=W/2, cy=H/2, pts=[];
  for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2 + seed*0.7; pts.push([cx+Math.cos(a)*(W*0.30)+(((i*17+seed*5)%18)-9), cy+Math.sin(a)*(H*0.30)+(((i*11+seed*3)%12)-6)]); }
  let edges=''; for(let i=0;i<n;i++){ const j=(i+1)%n; edges+=`<line x1="${pts[i][0].toFixed(0)}" y1="${pts[i][1].toFixed(0)}" x2="${pts[j][0].toFixed(0)}" y2="${pts[j][1].toFixed(0)}"/>`; if(i%2===0){ const k=(i+2)%n; edges+=`<line x1="${pts[i][0].toFixed(0)}" y1="${pts[i][1].toFixed(0)}" x2="${pts[k][0].toFixed(0)}" y2="${pts[k][1].toFixed(0)}"/>`; } }
  const nodes=pts.map(p=>`<g transform="translate(${p[0].toFixed(0)},${p[1].toFixed(0)})"><rect x="-16" y="-6.5" width="32" height="13" rx="3"/><rect x="-16" y="-6.5" width="32" height="2.5" rx="1.2" class="tt-top"/></g>`).join('');
  return `<svg class="tpl-thumb" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g class="tt-edges">${edges}</g><g class="tt-nodes">${nodes}</g></svg>`;
}

let fsState={ display:'', name:'', nameEdited:false, desc:'', cat:'', tags:[], owner:'sb', stewards:[] };
function _fsReset(){ fsState={ display:'', name:'', nameEdited:false, desc:'', cat:'', tags:[], owner:'sb', stewards:[] }; }
function fsSet(k,v){ fsState[k]=v; if(k==='display'&&!fsState.nameEdited){ fsState.name=_slug(v); } _fsSync(); }
function fsName(v){ fsState.name=_slug(v); fsState.nameEdited=true; _fsSync(); }
function _fsSync(){
  const nm=$('fsName'); if(nm && document.activeElement!==nm) nm.value=fsState.name;
  const ok=fsState.display.trim() && fsState.desc.trim();
  const btn=$('fsCreateBtn'); if(btn){ btn.disabled=!ok; }
  const hint=$('fsHint'); if(hint){ hint.textContent = ok?'Ready to create':'Complete the required fields to continue'; hint.className='fs-foot-hint'+(ok?' ok':''); }
  const cc=$('fsDescCount'); if(cc){ cc.textContent=fsState.desc.length+' / 60'; cc.classList.toggle('over',fsState.desc.length>60); }
}
function fsTagAdd(v){ v=(v||'').trim(); if(v && !fsState.tags.includes(v)){ fsState.tags.push(v); renderFromScratch(); } }
function fsTagDel(v){ fsState.tags=fsState.tags.filter(t=>t!==v); renderFromScratch(); }
function fsSuggestTags(){ ['sales','customer-360','pipeline'].forEach(t=>{ if(!fsState.tags.includes(t)) fsState.tags.push(t); }); renderFromScratch(); toast('Suggested tags added','ok'); }
function fsHelpDesc(){ const ta=$('fsDesc'); const txt='Models the full sales funnel from lead to closed deal, including accounts, contacts, opportunities and quotes. Excludes post-sale support.'; fsState.desc=txt; if(ta){ ta.value=txt; } _fsSync(); toast('Draft description generated','ok'); }
function fsCreate(){
  const name=fsState.display.trim(); if(!name){ toast('Enter a display name'); return; }
  if(!fsState.desc.trim()){ toast('Add a description'); return; }
  let base=fsState.name||_slug(name), u=base, k=2; while(_model(u)) u=base+'_'+(k++);
  MODELS.unshift({id:u, name, origin:'Custom', category:fsState.cat||'Custom', status:'Draft', entities:0, owner:fsState.owner, collab:[], updated:'just now', tags:fsState.tags.slice(), desc:fsState.desc.trim()});
  _mdReset&&_mdReset(u);
  toast('“'+name+'” created','ok');
  navigate('models/'+u);
}

function _cmdkRender(){

  _cmdkItems=_cmdkData().filter(it=>!q||it.label.toLowerCase().includes(q)||it.cat.toLowerCase().includes(q));
  if(_cmdkSel>=_cmdkItems.length) _cmdkSel=Math.max(0,_cmdkItems.length-1);
  const gic={grid:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>',
    plus:'<svg width="15" height="15" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 2v8M2 6h8"/></svg>',
    sun:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/></svg>'};
  $('cmdkList').innerHTML = _cmdkItems.length
    ? _cmdkItems.map((it,i)=>`<div class="cmdk-item ${i===_cmdkSel?'sel':''}" onmouseenter="_cmdkSel=${i};_cmdkPaint()" onclick="_cmdkRun(${i})">${gic[it.ic]||gic.grid}<span>${escapeHtml(it.label)}</span><span class="cmdk-cat">${escapeHtml(it.cat)}</span></div>`).join('')
    : `<div class="cmdk-empty">No results.</div>`;
}
function _cmdkPaint(){ [...document.querySelectorAll('#cmdkList .cmdk-item')].forEach((el,i)=>el.classList.toggle('sel',i===_cmdkSel)); }
function _cmdkKey(e){
  if(e.key==='ArrowDown'){ e.preventDefault(); _cmdkSel=Math.min(_cmdkItems.length-1,_cmdkSel+1); _cmdkPaint(); const el=document.querySelectorAll('#cmdkList .cmdk-item')[_cmdkSel]; if(el)el.scrollIntoView({block:'nearest'}); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _cmdkSel=Math.max(0,_cmdkSel-1); _cmdkPaint(); const el=document.querySelectorAll('#cmdkList .cmdk-item')[_cmdkSel]; if(el)el.scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); _cmdkRun(_cmdkSel); }
}
function _cmdkRun(i){ const it=_cmdkItems[i]; if(!it) return; closeSearch(); try{ (new Function(it.act))(); }catch(e){} }
document.addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); } });
window.addEventListener('hashchange', route);
/* Restore persisted preferences (view per surface, theme, sidebar collapse) */
try{
  const _vw={models:modelsState, entities:listState, tables:tablesListState, reference:refListState};

}catch(e){}
_themeIcon();
route();

const TOUR_LS_STEP = 'dsm-tour-step';
const TOUR_LS_DONE  = 'dsm-tour-seen';
let tourState = { active: false, stepIndex: 0 };
let _tourLastFocus = null;

function _tourSave(){ try{ localStorage.setItem(TOUR_LS_STEP, String(tourState.stepIndex)); }catch(e){} }
function _tourClearProgress(){ try{ localStorage.removeItem(TOUR_LS_STEP); localStorage.setItem(TOUR_LS_DONE,'1'); }catch(e){} }

function startTour(){
  let i = 0;
  try{ const s = localStorage.getItem(TOUR_LS_STEP); if (s!=null && +s>0 && +s<TOUR_STEPS.length) i = +s; }catch(e){}
  startTourAt(i);
}
function restartTour(){ startTourAt(0); }
function startTourAt(i){
  tourState = { active:true, stepIndex: Math.max(0, Math.min(i|0, TOUR_STEPS.length-1)) };
  _tourLastFocus = document.activeElement;
  const t = document.getElementById('tourTrigger'); if (t) t.classList.add('tour-active');
  paintTourStep();
}
function endTour(finished){
  tourState.active = false;
  const t = document.getElementById('tourTrigger'); if (t){ t.classList.remove('tour-active'); t.classList.add('seen'); }
  ['tourMaskT','tourMaskR','tourMaskB','tourMaskL'].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.remove('active'); });
  const sp=document.getElementById('tourSpotlight'); if(sp) sp.classList.remove('active');
  const po=document.getElementById('tourPopover'); if(po) po.classList.remove('active');
  finished ? _tourClearProgress() : _tourSave();
  _tourRefreshTriggerLabel();
  if (_tourLastFocus && _tourLastFocus.focus){ try{ _tourLastFocus.focus(); }catch(e){} }
}
function tourNext(){ if (tourState.stepIndex>=TOUR_STEPS.length-1){ endTour(true); return; } tourState.stepIndex++; _tourSave(); paintTourStep(); }
function tourPrev(){ if (tourState.stepIndex<=0) return; tourState.stepIndex--; _tourSave(); paintTourStep(); }

function paintTourStep(){
  if (!tourState.active) return;
  const step = TOUR_STEPS[tourState.stepIndex];
  const isFirst = tourState.stepIndex===0, isLast = tourState.stepIndex===TOUR_STEPS.length-1;

  if (typeof step.setup === 'function'){ try{ step.setup(); }catch(e){} }
  if (step.route && location.hash!==step.route){ location.hash=step.route; }

  setTimeout(()=>{
    const popover=document.getElementById('tourPopover'), spotlight=document.getElementById('tourSpotlight');
    popover.innerHTML = `
      <div class="tour-popover-header">
        <span class="tour-popover-step">Step ${tourState.stepIndex+1} of ${TOUR_STEPS.length}</span>
        ${!isFirst ? `<button class="tour-popover-restart" onclick="restartTour()">Restart</button>` : ''}
        <button class="tour-popover-skip" onclick="endTour(false)">Skip tour</button>
      </div>
      <div class="tour-popover-title" id="tourTitle">${step.title}</div>
      <div class="tour-popover-body">${step.body}</div>
      <div class="tour-popover-footer">
        <div class="tour-progress">${TOUR_STEPS.map((_,i)=>`<div class="tour-progress-dot ${i===tourState.stepIndex?'current':i<tourState.stepIndex?'done':''}"></div>`).join('')}</div>
        ${!isFirst ? `<button class="tour-btn tour-btn-prev" onclick="tourPrev()">← Back</button>` : ''}
        <button class="tour-btn tour-btn-next" onclick="${isLast?'endTour(true)':'tourNext()'}">${isLast?'Finish':'Next →'}</button>
      </div>`;

    const targetEl = step.target ? document.querySelector(step.target) : null;
    if (targetEl){
      if (step.scrollToTarget){
        const sc = document.querySelector('.main') || document.getElementById('content');
        const r = targetEl.getBoundingClientRect();
        if (sc){ sc.scrollBy({ top: r.top - sc.getBoundingClientRect().top - 80, behavior:'smooth' }); }
        else { targetEl.scrollIntoView({ behavior:'smooth', block:'start' }); }
      }
      const place = ()=>{ _tourPlace(targetEl.getBoundingClientRect(), popover, spotlight); };
      setTimeout(place, step.scrollToTarget ? 700 : 50);
      if (step.scrollToTarget) setTimeout(place, 1100);
    } else {
      _tourMaskFull(); spotlight.classList.remove('active'); _tourCenter(popover);
    }

    const live=document.getElementById('tourLive'); if (live) live.textContent=`Step ${tourState.stepIndex+1} of ${TOUR_STEPS.length}. ${step.title}`;
    const nextBtn=popover.querySelector('.tour-btn-next'); if (nextBtn) setTimeout(()=>nextBtn.focus(), 60);
  }, (step.route || step.setup) ? 250 : 50);
}

function _tourPlace(rect, popover, spotlight){
  const pad=6;
  spotlight.style.left=(rect.left-pad)+'px'; spotlight.style.top=(rect.top-pad)+'px';
  spotlight.style.width=(rect.width+pad*2)+'px'; spotlight.style.height=(rect.height+pad*2)+'px';
  spotlight.classList.add('active');
  _tourMask(rect, pad);
  if (window.innerWidth < 560){ popover.classList.add('is-sheet'); popover.classList.add('active'); return; }
  popover.classList.remove('is-sheet');
  const pw=360, ph=popover.offsetHeight||280, m=16, W=window.innerWidth, H=window.innerHeight;
  let top, left;
  if (rect.bottom+ph+m < H){ top=rect.bottom+16; left=Math.min(Math.max(rect.left,16), W-pw-16); }
  else if (rect.top-ph-m > 0){ top=rect.top-ph-16; left=Math.min(Math.max(rect.left,16), W-pw-16); }
  else { top=(H-ph)/2; left=(W-pw)/2; }
  popover.style.left=left+'px'; popover.style.top=top+'px'; popover.classList.add('active');
}
function _tourMask(rect, pad){
  const W=window.innerWidth, H=window.innerHeight;
  const top=Math.max(0,rect.top-pad), bot=Math.min(H,rect.bottom+pad), lft=Math.max(0,rect.left-pad), rgt=Math.min(W,rect.right+pad);
  const set=(id,l,t,w,h)=>{ const e=document.getElementById(id); e.style.left=l+'px'; e.style.top=t+'px'; e.style.width=Math.max(0,w)+'px'; e.style.height=Math.max(0,h)+'px'; e.classList.add('active'); };
  set('tourMaskT',0,0,W,top);
  set('tourMaskB',0,bot,W,H-bot);
  set('tourMaskL',0,top,lft,bot-top);
  set('tourMaskR',rgt,top,W-rgt,bot-top);
}
function _tourMaskFull(){
  const T=document.getElementById('tourMaskT'); T.style.left='0'; T.style.top='0'; T.style.width='100vw'; T.style.height='100vh'; T.classList.add('active');
  ['tourMaskR','tourMaskB','tourMaskL'].forEach(id=>{ const e=document.getElementById(id); e.classList.remove('active'); });
}
function _tourCenter(popover){
  if (window.innerWidth < 560){ popover.classList.add('is-sheet'); popover.classList.add('active'); return; }
  popover.classList.remove('is-sheet');
  popover.style.left=((window.innerWidth-360)/2)+'px'; popover.style.top=((window.innerHeight-(popover.offsetHeight||280))/2)+'px';
  popover.classList.add('active');
}

document.addEventListener('keydown',(e)=>{
  if (!tourState.active) return;
  if (e.key==='Escape'){ endTour(false); }
  else if (e.key==='ArrowRight'){ e.preventDefault(); tourNext(); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); tourPrev(); }
});
document.addEventListener('keydown',(e)=>{
  if (!tourState.active || e.key!=='Tab') return;
  const po=document.getElementById('tourPopover');
  const f=po.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  const first=f[0], last=f[f.length-1];
  if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

function _tourRefreshTriggerLabel(){
  const t=document.getElementById('tourTrigger'); if (!t) return;
  const label=t.querySelector('.tour-trigger-label');
  let saved=null; try{ saved=localStorage.getItem(TOUR_LS_STEP); }catch(e){}
  if (saved!=null && +saved>0 && +saved<TOUR_STEPS.length){ if (label) label.textContent='Continue'; t.classList.add('seen'); }
  else { if (label) label.textContent='Demo'; try{ if (localStorage.getItem(TOUR_LS_DONE)) t.classList.add('seen'); }catch(e){} }
}

(function tourInit(){
  _tourRefreshTriggerLabel();
  try{
    const q=new URLSearchParams(window.location.search).get('tour');
    if (q!=null){ const n=parseInt(q,10); if (!isNaN(n)){ startTourAt(Math.max(0,n-1)); } }
  }catch(e){}
})();
