<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sb:#10151e;--card:rgba(255,255,255,.028);
  --tp:#f1f5f9;--ts:#94a3b8;--tm:#475569;
  --t1:#f1f5f9;--t2:#94a3b8;
  --br:rgba(255,255,255,.06);--brm:rgba(255,255,255,.09);--bd:rgba(255,255,255,.07);
  --grad:linear-gradient(135deg,#7c5cfc,#3b82f6);
  --act:#a78bfa;--act-bg:rgba(124,92,252,.14);--act-br:rgba(124,92,252,.4);
  --blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--orange:#f97316;
  --purple:#7c5cfc;--teal:#06b6d4;--indigo:#6366f1;
  --pri:#2B7FFF;--ok:#05DF72;--warn:#FDC700;--err:#FF6467;
}
html.light{
  --bg:#f8fafc;--sb:#ffffff;--card:rgba(0,0,0,.028);
  --tp:#0f172a;--ts:#475569;--tm:#94a3b8;
  --br:rgba(0,0,0,.06);--brm:rgba(0,0,0,.09);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tp);min-height:100vh;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* ── LAYOUT ── */
.app{display:flex;height:calc(100vh - 52px);margin-top:52px;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page-header{height:52px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── AIMS app shell (ported from voice — topbar + studio/workspace switchers + tooltips) ── */
.topbar{display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 13px;flex-shrink:0;background:rgba(10,13,26,0.72);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-bottom:1px solid rgba(255,255,255,0.07);z-index:20;position:fixed;top:0;left:0;right:0}
.tb-left{flex:1;display:flex;align-items:center;gap:6px}
.tb-launcher{display:flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 6px;border-radius:8px;background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,0.90);transition:background .15s;flex-shrink:0;position:relative}
.tb-launcher:hover{background:rgba(255,255,255,0.06)}
.tb-launcher-logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px}
.tb-launcher-name{font-size:13px;font-weight:700;color:rgba(255,255,255,0.90);white-space:nowrap}
.tb-launcher-chevron{color:rgba(255,255,255,0.50);flex-shrink:0;transition:transform .15s}
.tb-launcher.sw-open .tb-launcher-chevron{transform:rotate(180deg)}
.studio-sw{position:absolute;top:calc(100% + 8px);left:0;width:248px;background:#131929;border:1px solid rgba(255,255,255,0.10);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,0.04);z-index:200;overflow:hidden;opacity:0;transform:translateY(-6px) scale(0.97);pointer-events:none;transition:opacity .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1)}
.studio-sw.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.studio-sw-hd{padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,0.06)}
.studio-sw-title{font-size:10px;font-weight:700;color:rgba(255,255,255,0.22);text-transform:uppercase;letter-spacing:.08em}
.studio-item{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;transition:background .1s;text-decoration:none;border:none;background:none;width:100%;text-align:left}
.studio-item:hover{background:rgba(255,255,255,0.05)}
.studio-item.s-active{background:rgba(43,127,255,0.08)}
.studio-item-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px}
.studio-item-info{flex:1;min-width:0;text-align:left}
.studio-item-name{font-size:13px;font-weight:600;color:rgba(255,255,255,0.90);white-space:nowrap}
.studio-item-desc{font-size:11px;color:rgba(255,255,255,0.50);margin-top:1px}
.studio-item-badge{width:16px;height:16px;flex-shrink:0;color:#2B7FFF}
.tb-search{width:340px;flex-shrink:0;position:relative}
.tb-search input{width:100%;height:32px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:0 12px 0 32px;color:rgba(255,255,255,0.90);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
.tb-search input:focus{border-color:rgba(43,127,255,0.30)}
.tb-search input::placeholder{color:rgba(255,255,255,0.38)}
.tb-search-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.50);pointer-events:none}
.tb-right{display:flex;align-items:center;gap:4px;flex:1;justify-content:flex-end}
.icon-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:rgba(255,255,255,0.50);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}
.icon-btn:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.80)}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;border:none;font-family:inherit}
.tt{position:fixed;z-index:700;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:500;line-height:1.35;white-space:nowrap;background:#131929;color:rgba(255,255,255,0.90);pointer-events:none;opacity:0;transform:translateY(-2px);transition:opacity .12s ease,transform .12s ease;box-shadow:0 8px 24px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,0.10);max-width:240px}
.tt.open{opacity:1;transform:translateY(0)}
.tt__title{font-weight:600;color:rgba(255,255,255,0.90)}
.tt__desc{font-size:11px;font-weight:400;color:rgba(255,255,255,0.55);margin-top:2px;white-space:normal}
.tb-divider{width:1px;height:22px;background:rgba(255,255,255,0.10);flex-shrink:0}
.tb-workspace{display:flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 6px;border-radius:8px;background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,0.90);transition:background .15s;flex-shrink:0;position:relative;font-family:inherit}
.tb-workspace:hover{background:rgba(255,255,255,0.06)}
.tb-workspace-logo{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px;overflow:hidden}
.tb-workspace-logo img{width:100%;height:100%;object-fit:cover}
.tb-workspace-name{font-size:13px;font-weight:700;color:rgba(255,255,255,0.90);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tb-workspace-chevron{color:rgba(255,255,255,0.50);flex-shrink:0;transition:transform .15s}
.tb-workspace.ws-open .tb-workspace-chevron{transform:rotate(180deg)}
.workspace-sw{position:absolute;top:calc(100% + 8px);left:0;width:280px;background:#131929;border:1px solid rgba(255,255,255,0.10);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,0.04);z-index:200;overflow:hidden;opacity:0;transform:translateY(-6px) scale(0.97);pointer-events:none;transition:opacity .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1)}
.workspace-sw.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.workspace-sw__hd{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06)}
.workspace-sw__title{font-size:10px;font-weight:700;color:rgba(255,255,255,0.22);text-transform:uppercase;letter-spacing:.08em}
.workspace-sw__search{padding:8px 12px 4px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative}
.workspace-sw__search input{width:100%;height:30px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:0 10px 0 28px;color:rgba(255,255,255,0.90);font-family:inherit;font-size:12px;outline:none}
.workspace-sw__search input:focus{border-color:rgba(43,127,255,0.30)}
.workspace-sw__search input::placeholder{color:rgba(255,255,255,0.38)}
.workspace-sw__search svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.40);pointer-events:none}
.workspace-sw__list{max-height:320px;overflow-y:auto;padding:4px 0}
.workspace-sw__group-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.22);text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 4px}
.ws-item{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;transition:background .1s;text-decoration:none;border:none;background:none;width:100%;text-align:left;color:inherit;font-family:inherit}
.ws-item:hover{background:rgba(255,255,255,0.05)}
.ws-item.s-active{background:rgba(43,127,255,0.08)}
.ws-item__ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px;overflow:hidden}
.ws-item__ico img{width:100%;height:100%;object-fit:cover}
.ws-item__info{flex:1;min-width:0;text-align:left}
.ws-item__name{font-size:13px;font-weight:600;color:rgba(255,255,255,0.90);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-item__sub{font-size:11px;color:rgba(255,255,255,0.50);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-item__check{width:16px;height:16px;flex-shrink:0;color:#2B7FFF}
.workspace-sw__empty{padding:20px 14px;font-size:12px;color:rgba(255,255,255,0.50);text-align:center}
.workspace-sw__footer{padding:6px;border-top:1px solid rgba(255,255,255,0.06)}
.workspace-sw__footer .ws-create{display:flex;align-items:center;gap:11px;padding:9px 12px;width:100%;background:transparent;border:none;border-radius:8px;cursor:pointer;color:rgba(255,255,255,0.90);font-family:inherit;font-size:13px;font-weight:600;transition:background .1s}
.workspace-sw__footer .ws-create:hover{background:rgba(255,255,255,0.05)}
.workspace-sw__footer .ws-create svg{color:rgba(255,255,255,0.50);flex-shrink:0}
.workspace-sw__footer .ws-create:hover svg{color:rgba(255,255,255,0.90)}

/* ── SIDEBAR (AIMS OS Design System) ── */
.sidebar{
  width:64px;flex-shrink:0;background:#000;display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,0.07);
  transition:width .22s cubic-bezier(.4,0,.2,1);overflow:hidden;
}
.sidebar.sb-expanded{width:250px}
.sb-brand{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.05);overflow:hidden;white-space:nowrap}
.sidebar:not(.sb-expanded) .sb-brand{justify-content:center;padding:0}
.sb-brand-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0}
.sb-brand-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.sidebar.sb-expanded .sb-brand-name{opacity:1}
.sb-nav{flex:1;display:flex;flex-direction:column;padding:6px 8px;gap:2px;overflow:hidden}
.sb-item{
  display:flex;align-items:center;height:40px;border:none;border-radius:10px;
  background:transparent;color:rgba(255,255,255,0.42);font-size:12px;font-weight:600;
  cursor:pointer;width:100%;text-align:left;transition:background .15s,color .15s;
  white-space:nowrap;overflow:hidden;flex-shrink:0;padding:0;
}
.sidebar:not(.sb-expanded) .sb-item{justify-content:center;gap:0}
.sidebar.sb-expanded .sb-item{justify-content:flex-start;padding:0 12px;gap:10px}
.sb-item:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,.80)}
.sb-item.active{background:linear-gradient(135deg,rgba(21,93,252,0.55) 0%,rgba(0,194,194,0.35) 100%);color:#fff}
.sb-item.active:hover{background:linear-gradient(135deg,rgba(21,93,252,0.65) 0%,rgba(0,194,194,0.45) 100%)}
.sidebar:not(.sb-expanded) .sb-item.active{background:transparent}
.sidebar:not(.sb-expanded) .sb-item.active .sb-item-icon{background:linear-gradient(135deg,#155DFC 0%,#00C2C2 100%);border-radius:10px;width:36px;height:36px;box-shadow:0 0 12px rgba(21,93,252,0.45)}
.sb-item-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-item-icon svg{width:18px;height:18px}
.sb-label{opacity:0;transition:opacity .12s;pointer-events:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar.sb-expanded .sb-label{opacity:1;pointer-events:auto}
.sb-chevron{margin-left:auto;width:13px;height:13px;flex-shrink:0;opacity:0;color:rgba(255,255,255,.35)}
.sidebar.sb-expanded .sb-chevron{opacity:1}
.sb-divider{height:1px;background:rgba(255,255,255,0.06);margin:4px 0;flex-shrink:0}

/* Governance sub-nav (under Admin) */
.gov-subnav{display:flex;flex-direction:column;gap:1px;padding:0 0 4px 0}
.sidebar:not(.sb-expanded) .gov-subnav{display:none}
.gov-nav-item{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 42px;
  border:none;background:transparent;color:rgba(255,255,255,0.45);font-size:11px;font-weight:600;
  cursor:pointer;width:100%;text-align:left;border-radius:8px;transition:background .1s,color .1s;
}
.gov-nav-item:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,.75)}
.gov-nav-item.active{color:rgba(255,255,255,.9)}

/* Bottom toggle */
.sb-bottom{flex-shrink:0;border-top:1px solid rgba(255,255,255,0.05);padding:4px 8px 6px}
.sb-toggle{
  display:flex;align-items:center;height:40px;border:none;border-radius:10px;
  background:transparent;color:rgba(128,175,255,0.55);font-size:12px;font-weight:600;
  cursor:pointer;width:100%;white-space:nowrap;overflow:hidden;transition:background .12s,color .12s;
}
.sidebar:not(.sb-expanded) .sb-toggle{justify-content:center;gap:0;padding:0}
.sidebar.sb-expanded .sb-toggle{justify-content:flex-start;padding:0 12px;gap:10px}
.sb-toggle:hover{background:rgba(255,255,255,0.06);color:#80AFFF}
.sb-toggle-icon{width:18px;height:18px;flex-shrink:0;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.sidebar.sb-expanded .sb-toggle-icon{transform:rotate(180deg)}
.sb-toggle-label{opacity:0;transition:opacity .12s}
.sidebar.sb-expanded .sb-toggle-label{opacity:1}

/* theme toggle (keep for dark/light mode) */
.theme-btn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;background:none;border:none;transition:all .15s;width:100%}
.theme-btn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}

/* ── TOPBAR ── */
.tb-title{font-weight:600;font-size:15px;flex:1}
.tb-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-active{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.badge-draft{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.28)}
.badge-paused{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.28)}
.tb-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;transition:all .15s}
.tb-btn-ghost{background:none;border:1px solid var(--br);color:var(--ts)}
.tb-btn-ghost:hover{background:var(--card);border-color:var(--brm);color:var(--tp)}
.tb-btn-primary{background:var(--grad);color:#fff;border:none;box-shadow:0 2px 8px rgba(124,92,252,.35)}
.tb-btn-primary:hover{opacity:.9;transform:translateY(-1px)}

/* ── CARDS & TABLES ── */
.card{background:var(--card);border:1px solid var(--br);border-radius:10px;overflow:hidden}
.card-p{padding:16px}
.stat-row{display:flex;gap:10px;margin-bottom:20px}
.stat-card{flex:1;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat-value{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tp);letter-spacing:-.5px;line-height:1.1}
.stat-label{font-size:11px;color:var(--ts);margin-top:4px;font-weight:500;letter-spacing:.02em}
.stat-delta{font-size:11px;margin-top:3px}
.delta-up{color:#10b981}
.delta-down{color:#ef4444}

table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--tm);text-align:left;padding:10px 16px;border-bottom:1px solid var(--br);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--br);font-size:13px;color:var(--ts);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.018)}
.td-name{color:var(--tp);font-weight:600;font-size:13px}
.td-link{color:var(--tp);cursor:pointer;font-weight:600;font-size:13px;transition:color .12s}
.td-link:hover{color:var(--act)}
.td-sub{font-size:11px;color:var(--tm);margin-top:2px;font-weight:400}
.row-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s;justify-content:flex-end}
tr:hover .row-actions{opacity:1}
.icon-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:none;border:1px solid transparent;color:var(--tm);cursor:pointer;transition:all .12s;flex-shrink:0}
.icon-btn:hover{background:var(--act-bg);border-color:var(--act-br);color:var(--act)}
.icon-btn.danger:hover{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25);color:#f87171}
.row-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── FILTER BAR ── */
.list-filter{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--sb);border:1px solid var(--br);border-radius:8px;padding:7px 12px;flex:1;min-width:0}
.search-box input{background:none;border:none;color:var(--tp);font-size:13px;width:100%}
.search-box input::placeholder{color:var(--tm)}
.filter-btn{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--br);background:none;color:var(--ts);white-space:nowrap}
.filter-btn:hover:not(.active){background:var(--card);color:var(--tp)}
.filter-btn.active{background:var(--act-bg);border-color:var(--act-br);color:var(--act)}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--br);margin-bottom:20px}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--ts);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--tp)}
.tab.active{color:var(--act);border-bottom-color:var(--act)}

/* ── PILLS / CHIPS ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.pill-purple{background:rgba(124,92,252,.14);color:#a78bfa;border:1px solid rgba(124,92,252,.28)}
.pill-blue{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
.pill-green{background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.pill-amber{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.pill-red{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.pill-gray{background:rgba(148,163,184,.08);color:var(--ts);border:1px solid var(--br)}

/* ── SEARCH / FILTER BAR ── */
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.search-input{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--br);border-radius:8px;padding:6px 10px;flex:1}
.search-input input{background:none;border:none;color:var(--tp);font-size:13px;width:100%}
.search-input input::placeholder{color:var(--tm)}

/* ── NETWORK BUILDER (full-screen) ── */
.builder{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:100}
.builder-topbar{height:52px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;background:var(--sb)}
.builder-body{flex:1;display:flex;overflow:hidden}
.catalog-panel{width:220px;min-width:220px;border-right:1px solid var(--br);display:flex;flex-direction:column;background:var(--sb)}
.catalog-header{padding:12px 12px 8px;border-bottom:1px solid var(--br)}
.catalog-search{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--br);border-radius:7px;padding:5px 8px}
.catalog-search input{background:none;border:none;color:var(--tp);font-size:12px;width:100%}
.catalog-search input::placeholder{color:var(--tm)}
.catalog-scroll{flex:1;overflow-y:auto;padding:8px}
.catalog-section{margin-bottom:8px}
.catalog-section-title{font-size:10px;font-weight:600;color:var(--tm);letter-spacing:.07em;text-transform:uppercase;padding:6px 6px 4px}
.catalog-node{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:grab;border:1px solid transparent;transition:all .15s;font-size:12px;color:var(--ts);font-weight:500}
.catalog-node:hover{background:var(--act-bg);border-color:var(--act-br);color:var(--tp)}
.catalog-node-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#080c14}
.canvas-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px}
.canvas-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.canvas-nodes{position:absolute;inset:0}
.canvas-toolbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--sb);border:1px solid var(--br);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ctool-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;background:none;border:1px solid transparent;color:var(--ts);cursor:pointer;transition:all .12s}
.ctool-btn:hover{background:var(--card);border-color:var(--brm);color:var(--tp)}
.ctool-sep{width:1px;background:var(--br);margin:2px 2px}

/* ── CANVAS NODES ── */
.cnode{position:absolute;width:168px;border-radius:10px;border:1.5px solid;cursor:default;user-select:none;transition:box-shadow .15s}
.cnode:hover,.cnode.selected{box-shadow:0 0 0 2.5px var(--act);border-color:var(--act)!important}
.cnode-header{display:flex;align-items:center;gap:7px;padding:9px 10px 7px;border-bottom:1px solid rgba(255,255,255,.07)}
.cnode-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnode-label{font-size:11px;font-weight:600;color:var(--tp);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnode-body{padding:7px 10px 9px}
.cnode-type{font-size:10px;color:var(--ts);margin-bottom:4px}
.cnode-port-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cnode-port{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ts)}
.port-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid;flex-shrink:0}
.port-in .port-dot{margin-right:0}
.port-out .port-dot{margin-left:0}

/* node type themes */
.cnode-contract{background:rgba(124,92,252,.1);border-color:rgba(124,92,252,.4)}.cnode-contract .cnode-icon{background:rgba(124,92,252,.25)}
.cnode-http{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.35)}.cnode-http .cnode-icon{background:rgba(59,130,246,.2)}
.cnode-llm{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.35)}.cnode-llm .cnode-icon{background:rgba(99,102,241,.2)}
.cnode-branch{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35)}.cnode-branch .cnode-icon{background:rgba(245,158,11,.2)}
.cnode-code{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.35)}.cnode-code .cnode-icon{background:rgba(16,185,129,.2)}
.cnode-wait{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.35)}.cnode-wait .cnode-icon{background:rgba(249,115,22,.2)}
.cnode-worker{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.35)}.cnode-worker .cnode-icon{background:rgba(6,182,212,.2)}

/* ── INSPECTOR PANEL ── */
.inspector-panel{width:280px;min-width:280px;border-left:1px solid var(--br);display:flex;flex-direction:column;background:var(--sb);overflow-y:auto}
.inspector-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;color:var(--ts)}
.inspector-empty p{font-size:12px;text-align:center;color:var(--tm);line-height:1.6}
.inspector-header{padding:14px 14px 10px;border-bottom:1px solid var(--br)}
.inspector-tabs{display:flex;gap:0;border-bottom:1px solid var(--br)}
.inspector-tab{flex:1;padding:8px;font-size:12px;font-weight:500;color:var(--ts);cursor:pointer;text-align:center;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.inspector-tab.active{color:var(--act);border-bottom-color:var(--act)}
.inspector-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:12px}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:11px;font-weight:600;color:var(--ts);letter-spacing:.04em;text-transform:uppercase}
.field-input{background:var(--bg);border:1px solid var(--br);border-radius:7px;padding:7px 10px;font-size:13px;color:var(--tp);width:100%}
.field-input:focus{border-color:var(--act-br)}
.field-select{appearance:none;background:var(--bg);border:1px solid var(--br);border-radius:7px;padding:7px 10px;font-size:13px;color:var(--tp);width:100%;cursor:pointer}
.field-textarea{background:var(--bg);border:1px solid var(--br);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--tp);width:100%;resize:vertical;font-family:'JetBrains Mono',monospace;min-height:80px}
.var-map-row{display:flex;align-items:center;gap:6px;padding:7px;background:var(--bg);border:1px solid var(--br);border-radius:7px;font-size:11px}
.var-map-source{flex:1;color:var(--ts);font-family:'JetBrains Mono',monospace}
.var-map-arrow{color:var(--tm);flex-shrink:0}
.var-map-target{flex:1;color:var(--act);font-family:'JetBrains Mono',monospace}
.inspector-footer{padding:12px 14px;border-top:1px solid var(--br);display:flex;gap:8px}
.btn-full{flex:1;padding:8px;border-radius:7px;font-size:13px;font-weight:500;text-align:center}
.btn-primary{background:var(--grad);color:#fff;border:none}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25)}

/* ── MISC ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:600;color:var(--tp)}
.section-sub{font-size:13px;color:var(--ts);margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.detail-item{background:var(--card);border:1px solid var(--br);border-radius:8px;padding:12px 14px}
.detail-item-label{font-size:11px;color:var(--ts);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.detail-item-value{font-size:14px;font-weight:600;color:var(--tp)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:12px;text-align:center}
.empty-state p{font-size:13px;color:var(--tm);max-width:280px;line-height:1.6}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-green{background:#10b981}
.dot-amber{background:#f59e0b}
.dot-red{background:#ef4444}
.dot-gray{background:#475569}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.text-sm{font-size:12px}
.text-xs{font-size:11px}
.text-ts{color:var(--ts)}
.text-tm{color:var(--tm)}
.text-act{color:var(--act)}
.flex{display:flex}
.items-center{align-items:center}
.gap-6{gap:6px}
.gap-8{gap:8px}
.gap-12{gap:12px}
.mb-8{margin-bottom:8px}
.mb-12{margin-bottom:12px}
.mb-16{margin-bottom:16px}
.mt-4{margin-top:4px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-card{background:var(--sb);border:1px solid var(--br);border-radius:14px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;max-height:90vh;overflow:hidden}
.modal-header{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:16px;font-weight:600}
.modal-sub{font-size:13px;color:var(--ts);margin-top:3px}
.modal-close{width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--br);color:var(--ts);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-2px}
.modal-close:hover{background:var(--card);color:var(--tp)}
.modal-stepper{display:flex;align-items:center;gap:0;padding:20px 24px 0;flex-shrink:0}
.modal-step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.step-dot{width:22px;height:22px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:all .2s}
.step-dot.done{background:var(--act);border-color:var(--act);color:#fff}
.step-dot.active{background:var(--act-bg);border-color:var(--act-br);color:var(--act)}
.step-dot.pending{background:transparent;border-color:var(--br);color:var(--tm)}
.step-label.done{color:var(--ts)}
.step-label.active{color:var(--act);font-weight:600}
.step-label.pending{color:var(--tm)}
.step-line{flex:1;height:1px;background:var(--br);margin:0 8px;min-width:20px}
.step-line.done{background:var(--act)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--br);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brm);border-radius:4px}

/* toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e2536;border:1px solid var(--br);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--tp);z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;animation:slideUp .2s ease;max-width:300px}
@keyframes slideUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ── PAGINATION ── */
.pagination{height:48px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;border-top:1px solid var(--br);background:var(--card);flex-shrink:0;gap:24px}
.pgn-rpp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ts);white-space:nowrap}
.pgn-rpp-wrap{position:relative}
.pgn-rpp-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tp);background:rgba(255,255,255,0.04);border:1px solid var(--br);border-radius:6px;padding:3px 8px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap}
.pgn-rpp-btn:hover{background:rgba(255,255,255,0.07);border-color:var(--brm)}
.pgn-rpp-menu{position:absolute;bottom:calc(100% + 4px);left:0;background:var(--sb);border:1px solid var(--brm);border-radius:8px;padding:4px;min-width:72px;z-index:120;display:none;flex-direction:column;gap:1px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pgn-rpp-menu.open{display:flex}
.pgn-rpp-val{pointer-events:none}
.pgn-rpp-opt{padding:7px 12px;font-size:12px;color:var(--tp);border-radius:5px;cursor:pointer;background:none;border:none;text-align:left;width:100%;transition:background .1s}
.pgn-rpp-opt:hover{background:rgba(255,255,255,0.06)}
.pgn-rpp-opt.sel{color:var(--act);background:var(--act-bg)}
.pgn-range{font-size:12px;color:var(--tp);white-space:nowrap}
.pgn-nav{display:flex;align-items:center;gap:4px}
.pgn-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--br);background:rgba(255,255,255,0.04);cursor:pointer;color:var(--tp);transition:all .15s}
.pgn-btn:hover:not(:disabled){border-color:var(--brm);background:rgba(255,255,255,0.08)}
.pgn-btn:disabled{opacity:.3;cursor:not-allowed}
/* ── Knowledge / TruthPacks ── */
.input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--br);border-radius:8px;color:var(--tp);font-size:13px;font-family:inherit;padding:8px 12px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--pri)}
textarea.input{resize:vertical;line-height:1.5}
.danger-zone{border:1px solid rgba(255,100,103,0.25);border-radius:10px;overflow:hidden;margin-top:8px}
.dz-title{font-size:11px;font-weight:700;color:var(--err);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;background:rgba(255,100,103,0.06);border-bottom:1px solid rgba(255,100,103,0.15)}
.dz-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.06)}
.dz-row:last-child{border-bottom:none}
.dz-row strong{font-size:13px;font-weight:600;color:var(--t1);display:block;margin-bottom:2px}
.dz-row p{font-size:11px;color:var(--tm);margin:0}
.dz-btn{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--br);background:transparent;color:var(--tp);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.dz-btn:hover{background:rgba(255,255,255,0.06)}
.dz-btn.danger{border-color:rgba(255,100,103,0.4);color:var(--err)}
.dz-btn.danger:hover{background:rgba(255,100,103,0.1)}
/* ── Mini toggle (same as agentic-studio) ── */
.mini-tog{display:inline-flex;align-items:center;cursor:pointer}
.mini-tog input{display:none}
.mini-track{width:30px;height:17px;border-radius:20px;background:rgba(255,255,255,0.12);position:relative;transition:background .18s;--tog-on:var(--ok)}
.mini-tog input:checked+.mini-track{background:var(--tog-on)}
.mini-thumb{position:absolute;top:2.5px;left:2.5px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mini-tog input:checked+.mini-track .mini-thumb{transform:translateX(13px)}
/* ── Unified Context Menu (apps + workspace switcher) ── */
.tb-brand{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:4px}
.tb-context{display:flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 6px;border-radius:8px;background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,0.90);transition:background .15s;flex-shrink:0;position:relative;font-family:inherit}
.tb-context:hover{background:rgba(255,255,255,0.06)}
.tb-context-logo{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px;overflow:hidden}
.tb-context-logo img{width:100%;height:100%;object-fit:cover}
.tb-context-name{font-size:13px;font-weight:700;color:rgba(255,255,255,0.92);white-space:nowrap;max-width:380px;overflow:hidden;text-overflow:ellipsis}
.tb-context-chev{color:rgba(255,255,255,0.50);flex-shrink:0;transition:transform .15s}
.tb-context.cm-open .tb-context-chev{transform:rotate(180deg)}
.ctx-menu{position:absolute;top:calc(100% + 8px);left:0;width:300px;background:#131929;border:1px solid rgba(255,255,255,0.10);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,0.04);z-index:200;overflow:hidden;opacity:0;transform:translateY(-6px) scale(0.97);pointer-events:none;transition:opacity .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1);text-align:left}
.ctx-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.cm-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}
.cm-action-btn{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;background:transparent;border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.85);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .1s,border-color .1s}
.cm-action-btn:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.20)}
.cm-action-btn svg{flex-shrink:0;color:rgba(255,255,255,0.65)}
.cm-section{padding:4px 0;border-top:1px solid rgba(255,255,255,0.06)}
.cm-section-hd{display:flex;align-items:center;gap:6px;padding:10px 14px 6px;font-size:10px;font-weight:700;color:rgba(255,255,255,0.40);text-transform:uppercase;letter-spacing:.08em}
.cm-section-hd-count{font-weight:500;opacity:.7;text-transform:none;letter-spacing:0}
.cm-search{padding:0 10px 6px;position:relative}
.cm-search input{width:100%;height:30px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:0 10px 0 28px;color:rgba(255,255,255,0.90);font-family:inherit;font-size:12px;outline:none}
.cm-search input:focus{border-color:rgba(43,127,255,0.30)}
.cm-search input::placeholder{color:rgba(255,255,255,0.38)}
.cm-search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.40);pointer-events:none}
.cm-item{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;transition:background .1s;border:none;background:none;width:100%;text-align:left;color:inherit;font-family:inherit;text-decoration:none}
.cm-item:hover{background:rgba(255,255,255,0.05)}
.cm-item.is-active{background:rgba(43,127,255,0.10)}
.cm-item.is-disabled{opacity:.35;cursor:not-allowed}
.cm-item.is-disabled:hover{background:transparent}
.cm-item-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px;overflow:hidden}
.cm-item-ico img{width:100%;height:100%;object-fit:cover}
.cm-item-info{flex:1;min-width:0;text-align:left}
.cm-item-name{font-size:13px;font-weight:600;color:rgba(255,255,255,0.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.cm-item.is-active .cm-item-name{font-weight:700}
.cm-item-sub{font-size:11px;color:rgba(255,255,255,0.45);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-item-role{display:inline-flex;padding:0 6px;height:15px;align-items:center;border-radius:9999px;background:rgba(43,127,255,0.15);color:#80AFFF;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.cm-item-check{width:16px;height:16px;flex-shrink:0;color:#2B7FFF;opacity:0}
.cm-item.is-active .cm-item-check{opacity:1}
.cm-ws-list{max-height:280px;overflow-y:auto;padding-bottom:4px}
.cm-ws-list::-webkit-scrollbar{width:6px}
.cm-ws-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:3px}
.cm-empty{padding:14px;font-size:12px;color:rgba(255,255,255,0.50);text-align:center}
.cm-footer{padding:6px;border-top:1px solid rgba(255,255,255,0.06)}
.cm-create{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.15);border-radius:8px;cursor:pointer;color:rgba(255,255,255,0.85);font-family:inherit;font-size:13px;font-weight:600;transition:all .1s}
.cm-create:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.30);color:rgba(255,255,255,0.95)}
.cm-create svg{color:rgba(255,255,255,0.60);flex-shrink:0}
.cm-create:hover svg{color:rgba(255,255,255,0.95)}
@media (max-width:560px){.ctx-menu{width:calc(100vw - 16px)}}
@media (prefers-reduced-motion: reduce){.ctx-menu{transition:opacity .05s;transform:none}.ctx-menu.open{transform:none}}
/* ── AI Assistant (Phase 1 shell — bot+sparkle topbar trigger + right slideout) ── */
.icon-btn.aa-trigger.active{background:rgba(43,127,255,0.14)}
.icon-btn.aa-trigger.active svg{color:rgba(255,255,255,0.92)}
.aa-overlay{position:fixed;inset:0;background:rgba(5,8,18,0.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
.aa-overlay.open{opacity:1;pointer-events:auto}
.ai-assistant{position:fixed;top:0;right:0;width:420px;height:100vh;background:#0E1426;border-left:1px solid rgba(255,255,255,0.10);box-shadow:-12px 0 32px rgba(0,0,0,.45);z-index:90;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;font-family:inherit}
.ai-assistant.open{transform:translateX(0)}
@media (prefers-reduced-motion: reduce){.ai-assistant{transition:none}.aa-overlay{transition:opacity .05s}}
.aa-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.aa-title-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
.aa-title-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.aa-title{font-size:14px;font-weight:700;color:rgba(255,255,255,0.92);line-height:1.2}
.aa-subtitle{font-size:11px;color:rgba(255,255,255,0.50);margin-top:2px}
.aa-header-actions{display:flex;gap:4px}
.aa-header-actions .btn-icon-sm{width:28px;height:28px;border-radius:6px;background:transparent;border:none;color:rgba(255,255,255,0.55);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}
.aa-header-actions .btn-icon-sm:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.85)}
.aa-context{padding:10px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;flex-shrink:0}
.aa-context-label{font-size:12px;color:rgba(255,255,255,0.50)}
.aa-route-pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:9999px;background:rgba(43,127,255,0.10);border:1px solid rgba(43,127,255,0.25);color:rgba(150,200,255,0.95);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .1s}
.aa-route-pill:hover{background:rgba(43,127,255,0.18)}
.aa-route-pill__ico{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
.aa-route-chev{opacity:.6;transition:transform .15s}
.aa-route-pill.is-open .aa-route-chev{transform:rotate(180deg)}
.aa-route-sw{position:absolute;top:calc(100% + 6px);left:0;width:280px;background:#131929;border:1px solid rgba(255,255,255,0.10);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,0.04);z-index:100;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s;overflow:hidden}
.aa-route-sw.open{opacity:1;transform:translateY(0);pointer-events:auto}
.aa-route-sw__search{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative}
.aa-route-sw__search input{width:100%;height:30px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:0 10px 0 28px;color:rgba(255,255,255,0.90);font-family:inherit;font-size:12px;outline:none}
.aa-route-sw__search input:focus{border-color:rgba(43,127,255,0.30)}
.aa-route-sw__search input::placeholder{color:rgba(255,255,255,0.38)}
.aa-route-sw__search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.40);pointer-events:none}
.aa-route-sw__list{max-height:304px;overflow-y:auto;padding:4px 0}
.aa-route-sw__list::-webkit-scrollbar{width:6px}
.aa-route-sw__list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:3px}
.aa-route-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:background .1s;border:none;background:none;width:100%;text-align:left;color:inherit;font-family:inherit}
.aa-route-item:hover{background:rgba(255,255,255,0.05)}
.aa-route-item.is-active{background:rgba(43,127,255,0.10)}
.aa-route-item__ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-.3px}
.aa-route-item__ico.is-auto{background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%)}
.aa-route-item__name{flex:1;min-width:0;font-size:13px;font-weight:500;color:rgba(255,255,255,0.90);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aa-route-item__check{width:14px;height:14px;flex-shrink:0;color:#2B7FFF;opacity:0}
.aa-route-item.is-active .aa-route-item__check{opacity:1}
.aa-route-sw__divider{height:1px;background:rgba(255,255,255,0.06);margin:4px 0}
.aa-route-sw__empty{padding:16px 12px;font-size:12px;color:rgba(255,255,255,0.50);text-align:center}
.aa-body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.aa-body::-webkit-scrollbar{width:6px}
.aa-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:3px}
.aa-empty{padding:32px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;justify-content:center}
.aa-empty-hero{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:14px;box-shadow:0 8px 24px rgba(43,127,255,0.30)}
.aa-empty-title{font-size:18px;font-weight:700;color:rgba(255,255,255,0.95);margin:0 0 4px}
.aa-empty-desc{font-size:13px;color:rgba(255,255,255,0.60);margin:0 0 24px;line-height:1.5;max-width:300px}
.aa-suggestions-wrap{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.aa-suggestions-label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.40);text-transform:uppercase;letter-spacing:.06em;text-align:left}
.aa-sug{display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:pointer;color:rgba(255,255,255,0.85);font-family:inherit;font-size:13px;text-align:left;transition:all .15s;width:100%}
.aa-sug:hover{background:rgba(255,255,255,0.08);border-color:rgba(43,127,255,0.30)}
.aa-sug-text{flex:1;text-align:left}
.aa-sug-arrow{color:rgba(255,255,255,0.30);flex-shrink:0;transition:color .15s,transform .15s}
.aa-sug:hover .aa-sug-arrow{color:rgba(43,127,255,0.80);transform:translateX(2px)}
.aa-thread{padding:14px 20px;display:flex;flex-direction:column;gap:14px}
.aa-msg{display:flex;gap:10px;align-items:flex-start}
.aa-msg-avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.aa-msg.user .aa-msg-avatar{background:rgba(255,255,255,0.10);color:rgba(255,255,255,0.80)}
.aa-msg.assistant .aa-msg-avatar{background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%)}
.aa-msg-bubble{flex:1;min-width:0;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;color:rgba(255,255,255,0.92)}
.aa-msg.user .aa-msg-bubble{background:rgba(43,127,255,0.10);border:1px solid rgba(43,127,255,0.20)}
.aa-msg.assistant .aa-msg-bubble{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)}
.aa-typing{display:inline-flex;gap:3px;align-items:center;padding:4px 0}
.aa-typing span{width:6px;height:6px;border-radius:50%;background:rgba(43,127,255,0.60);animation:aaTypeBounce 1.2s infinite ease-in-out}
.aa-typing span:nth-child(2){animation-delay:.15s}
.aa-typing span:nth-child(3){animation-delay:.3s}
@keyframes aaTypeBounce{0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-4px);opacity:1}}

.aa-composer-row{display:flex;gap:6px;align-items:flex-end;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:6px 6px 6px 12px;transition:border-color .15s}
.aa-composer-row:focus-within{border-color:rgba(43,127,255,0.40)}
.aa-input{flex:1;background:transparent;border:none;color:rgba(255,255,255,0.92);font-family:inherit;font-size:13px;line-height:1.5;outline:none;resize:none;padding:6px 0;max-height:120px;min-height:24px}
.aa-input::placeholder{color:rgba(255,255,255,0.38)}
.aa-attach-btn,.aa-send-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:rgba(255,255,255,0.55);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.aa-attach-btn:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.85)}
.aa-send-btn{background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);color:#fff}
.aa-send-btn:hover{filter:brightness(1.1)}
.aa-send-btn:disabled{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.30);cursor:not-allowed;filter:none}
.aa-hint{font-size:11px;color:rgba(255,255,255,0.40);margin-top:6px;padding:0 4px}
.aa-hint kbd{display:inline-flex;padding:1px 5px;border:1px solid rgba(255,255,255,0.15);border-radius:4px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.05)}
@media (max-width:560px){.ai-assistant{width:100vw}}

  try{localStorage.setItem('sb_gs_expanded', S._sbExpanded?'1':'0');}catch(e){}
  const sb = document.getElementById('appSidebar');
  if(sb){

    const btn = document.getElementById('sbToggleBtn');

}

function dotColor(st){return st==='active'?'dot-green':st==='draft'?'dot-amber':'dot-red';}
function rateColor(n){return n>95?'#10b981':n>80?'#f59e0b':'#ef4444';}
function rowAvatar(icon,color){return `<div class="row-avatar" style="background:${color}18">${IC(icon,13,color)}</div>`;}
function filterBtns(options,current,key){return options.map(f=>`<button class="filter-btn${current===f?' active':''}" onclick="setState({${key}:'${f}'})">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('');}

// compute port absolute positions (node w=168, h≈72)
const NW=168, NH=72;
function portPos(nodeId, portSide, portName){
  const n=NET001_NODES.find(x=>x.id===nodeId);
  if(!n)return{x:0,y:0};
  if(portSide==='out'){
    if(portName==='true') return{x:n.x+NW,y:n.y+NH*0.35};
    if(portName==='false') return{x:n.x+NW,y:n.y+NH*0.65};
    return{x:n.x+NW,y:n.y+NH/2};
  }
  return{x:n.x,y:n.y+NH/2};
}

function makeBezier(sx,sy,tx,ty){
  const cx=Math.abs(tx-sx)*0.5;
  return `M ${sx},${sy} C ${sx+cx},${sy} ${tx-cx},${ty} ${tx},${ty}`;
}

// ─── NETWORK BUILDER (full-screen) ───
function renderNetworkBuilder(){
  const net=NETWORKS.find(n=>n.id===S.selectedNetId)||NETWORKS[0];
  const selectedNode=S.builderNodeId?NET001_NODES.find(n=>n.id===S.builderNodeId):null;

  // Build SVG edges
  const svgEdges=NET001_EDGES.map(e=>{
    const sp=portPos(e.src,e.sp==='true'||e.sp==='false'||e.sp==='out'?'out':'in',e.sp);
    const tp=portPos(e.dst,'in',e.tp);
    const d=makeBezier(sp.x,sp.y,tp.x,tp.y);
    const isActive=S.builderNodeId===e.src||S.builderNodeId===e.dst;
    return `<path d="${d}" stroke="${isActive?'#a78bfa':'rgba(99,102,241,.45)'}" stroke-width="${isActive?2:1.5}" fill="none" stroke-dasharray="${isActive?'none':'none'}">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2s" repeatCount="indefinite" begin="${e.id}.mouseenter"/>
    </path>
    <circle cx="${tp.x}" cy="${tp.y}" r="3" fill="${isActive?'#a78bfa':'rgba(99,102,241,.6)'}"/>`;
  }).join('');

  // Build canvas nodes
  const nodeThemeMap={contract:'cnode-contract',http:'cnode-http',llm:'cnode-llm',branch:'cnode-branch',code:'cnode-code',wait:'cnode-wait',worker:'cnode-worker'};
  const nodeIconMap={contract:'share2',http:'globe',llm:'cpuChip',branch:'gitBranch',code:'code',wait:'timer',worker:'robot'};
  const nodeColorMap={contract:'#7c5cfc',http:'#3b82f6',llm:'#6366f1',branch:'#f59e0b',code:'#10b981',wait:'#f97316',worker:'#06b6d4'};

  const canvasNodes=NET001_NODES.map(n=>{
    const theme=nodeThemeMap[n.type]||'cnode-contract';
    const icon=nodeIconMap[n.type]||'share2';
    const clr=nodeColorMap[n.type]||'#7c5cfc';
    const isSel=S.builderNodeId===n.id;
    const portOut=n.ports?.out?.slice(0,2).join(', ')||'';
    const portIn=n.ports?.in?.slice(0,2).join(', ')||'';
    return `
    <div class="cnode ${theme}${isSel?' selected':''}" style="left:${n.x}px;top:${n.y}px" onclick="setState({builderNodeId:'${n.id}'})">
      <div class="cnode-header">
        <div class="cnode-icon">${IC(icon,12,clr)}</div>
        <div class="cnode-label">${n.label}</div>
      </div>
      <div class="cnode-body">
        <div class="cnode-type">${n.subtype}</div>
        ${portIn?`<div class="cnode-port port-in" style="font-size:9px;color:var(--tm)">${IC('arrowRight',9)} ${portIn.length>22?portIn.slice(0,22)+'…':portIn}</div>`:''}
        ${portOut?`<div class="cnode-port port-out" style="font-size:9px;color:var(--tm);text-align:right;justify-content:flex-end">${portOut.length>22?portOut.slice(0,22)+'…':portOut} ${IC('arrowRight',9)}</div>`:''}
      </div>
    </div>`;
  }).join('');

  // Inspector content
  const inspectorContent=selectedNode?`
    <div class="inspector-header">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="cnode-icon" style="background:${nodeColorMap[selectedNode.type]+'20'}">${IC(nodeIconMap[selectedNode.type]||'share2',14,nodeColorMap[selectedNode.type]||'#7c5cfc')}</div>
        <div>
          <div style="font-size:13px;font-weight:600">${selectedNode.label}</div>
          <div class="text-xs text-ts">${selectedNode.subtype}</div>
        </div>
      </div>
    </div>
    <div class="inspector-tabs">
      <div class="inspector-tab${S.builderInspTab==='config'?' active':''}" onclick="setState({builderInspTab:'config'})">Config</div>
      <div class="inspector-tab${S.builderInspTab==='mapping'?' active':''}" onclick="setState({builderInspTab:'mapping'})">Variables</div>
    </div>
    <div class="inspector-body">
    ${S.builderInspTab==='config'?`
      <div class="field-group">
        <div class="field-label">Node ID</div>
        <input class="field-input" value="${selectedNode.id}" readonly style="color:var(--ts);font-family:'JetBrains Mono',monospace;font-size:12px">
      </div>
      ${selectedNode.type==='llm'?`
        <div class="field-group">
          <div class="field-label">Model</div>
          <select class="field-select"><option>claude-sonnet-4-6</option><option>claude-haiku-4-5</option><option>claude-opus-4-7</option></select>
        </div>
        <div class="field-group">
          <div class="field-label">System Prompt</div>
          <textarea class="field-textarea" rows="4">You are a document classification expert. Analyze the provided document content and classify it into one of the following categories: invoice, contract, report, correspondence, form. Return a JSON object with fields: classification, confidence (0–1), reasoning.</textarea>
        </div>
        <div class="field-group">
          <div class="field-label">Temperature</div>
          <input class="field-input" type="number" value="0.1" min="0" max="1" step="0.1">
        </div>
      `:''}
      ${selectedNode.type==='http'?`
        <div class="field-group">
          <div class="field-label">Method</div>
          <select class="field-select"><option>GET</option><option>POST</option><option>PUT</option></select>
        </div>
        <div class="field-group">
          <div class="field-label">URL</div>
          <input class="field-input" value="{{n-start.document_url}}" placeholder="https://…">
        </div>
        <div class="field-group">
          <div class="field-label">Auth Header</div>
          <input class="field-input" value="Bearer {{secrets.STORAGE_TOKEN}}" placeholder="Bearer …">
        </div>
      `:''}
      ${selectedNode.type==='branch'?`
        <div class="field-group">
          <div class="field-label">Condition</div>
          <textarea class="field-textarea" rows="2">{{n-llm.confidence}} >= 0.85</textarea>
        </div>
        <div class="field-group">
          <div class="field-label">True path →</div>
          <input class="field-input" value="n-code (Extract Fields)" readonly style="color:var(--ts)">
        </div>
        <div class="field-group">
          <div class="field-label">False path →</div>
          <input class="field-input" value="n-wait (Manual Review)" readonly style="color:var(--ts)">
        </div>
      `:''}

function renderCatalogSection(title, key){
  const nodes=CATALOG_NODES[key]||[];
  const q=(S.catalogSearch||'').toLowerCase();
  const filtered=q?nodes.filter(n=>n.label.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)):nodes;
  if(!filtered.length)return '';
  return `
  <div class="catalog-section">
    <div class="catalog-section-title">${title}</div>
    ${filtered.map(n=>`
    <div class="catalog-node" draggable="true" title="${n.desc}" onclick="showToast('Drag \'${n.label}\' onto the canvas to add it')">
      <div class="catalog-node-icon" style="background:${n.color}20">${IC(n.icon,12,n.color)}</div>
      <div>
        <div style="font-size:12px;color:var(--tp)">${n.label}</div>
        <div style="font-size:10px;color:var(--tm)">${n.desc.slice(0,32)}${n.desc.length>32?'…':''}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

function pgnBar(total,defaultRows=10){
  const end=Math.min(defaultRows,total);
  const opts=[10,25,50,100].map(r=>`<button class="pgn-rpp-opt${r===defaultRows?' sel':''}" onclick="pgnSetRows(this,${r})">${r}</button>`).join('');
  return `<div class="pagination" data-total="${total}" data-rows="${defaultRows}" data-page="1">
    <div class="pgn-rpp">Rows per page:
      <div class="pgn-rpp-wrap">
        <button class="pgn-rpp-btn" onclick="togglePgnMenu(this,event)"><span class="pgn-rpp-val">${defaultRows}</span><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="pgn-rpp-menu">${opts}</div>
      </div>
    </div>
    <span class="pgn-range">1–${end} of ${total.toLocaleString()} items</span>
    <div class="pgn-nav">
      <button class="pgn-btn pgn-prev" onclick="pgnGo(this,-1)" disabled><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2.5L4.5 6l3 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="pgn-btn pgn-next" onclick="pgnGo(this,1)"${total<=defaultRows?' disabled':''}><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 2.5L7.5 6l-3 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>`;
}
function pgnGo(btn,dir){const p=btn.closest('.pagination');const total=+p.dataset.total;const rows=+p.dataset.rows;let page=+p.dataset.page;const totalPages=Math.ceil(total/rows);page=Math.max(1,Math.min(page+dir,totalPages));p.dataset.page=page;pgnUpdate(p);}
function pgnSetRows(btn,rows){const p=btn.closest('.pagination');p.dataset.rows=rows;p.dataset.page=1;p.querySelectorAll('.pgn-rpp-opt').forEach(o=>o.classList.remove('sel'));btn.classList.add('sel');btn.closest('.pgn-rpp-menu').classList.remove('open');p.querySelector('.pgn-rpp-val').textContent=rows;pgnUpdate(p);}
function pgnUpdate(p){const total=+p.dataset.total;const rows=+p.dataset.rows;const page=+p.dataset.page;const totalPages=Math.ceil(total/rows);const start=(page-1)*rows+1;const end=Math.min(page*rows,total);p.querySelector('.pgn-range').textContent=start.toLocaleString()+'–'+end.toLocaleString()+' of '+total.toLocaleString()+' items';p.querySelector('.pgn-prev').disabled=page<=1;p.querySelector('.pgn-next').disabled=page>=totalPages;}
function togglePgnMenu(btn,e){e.stopPropagation();btn.nextElementSibling.classList.toggle('open');}
document.addEventListener('click',()=>{document.querySelectorAll('.pgn-rpp-menu.open').forEach(m=>m.classList.remove('open'));});

  document.addEventListener('mouseover', function(e){ const el = e.target.closest && e.target.closest('[data-tt]'); if(!el) return; if(el === currentTarget) return; clearTimeout(showTimer); if(currentTarget) hide(); showTimer = setTimeout(()=>show(el), SHOW_DELAY); });
  document.addEventListener('mouseout', function(e){ const el = e.target.closest && e.target.closest('[data-tt]'); if(!el) return; if(!e.relatedTarget || !el.contains(e.relatedTarget)){ hide(); } });
  document.addEventListener('focusin', function(e){ const el = e.target.closest && e.target.closest('[data-tt]'); if(el) show(el); });
  document.addEventListener('focusout', function(e){ const el = e.target.closest && e.target.closest('[data-tt]'); if(el) hide(); });
  document.addEventListener('click', function(){ if(currentTarget) hide(); });
  window.addEventListener('scroll', hide, true);
})();

// ── AI Assistant (Phase 1 shell with mock replies) ──────────
window.AA_SUGGESTIONS = [
  "Audit policy changes from the last 7 days",
  "Show truth-plane edits awaiting review",
  "Which agents touched SOX-marked content this month?"
];
const _AA_BOT_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="2.2" r=".8" fill="currentColor"/><path d="M8 3v1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><rect x="2.5" y="4.5" width="11" height="8.5" rx="2.5" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="8.5" r=".7" fill="currentColor"/><circle cx="10" cy="8.5" r=".7" fill="currentColor"/></svg>';
let _aaMessages = [];
function _aaCurrentWorkspaceName(){ try { return (typeof _wsActive === 'function') ? _wsActive().name : 'this workspace'; } catch(e){ return 'this workspace'; } }
function _aaUpdateWsLabels(){ const wsName = _aaCurrentWorkspaceName(); const el1 = document.getElementById('aa-ws-name'); const el2 = document.getElementById('aa-empty-ws'); if(el1) el1.textContent = wsName; if(el2) el2.textContent = wsName; }
function _aaRenderSuggestions(){ const root = document.getElementById('aa-suggestions'); if(!root) return; root.innerHTML = window.AA_SUGGESTIONS.map((s,i) => '<button type="button" class="aa-sug" onclick="aaUseSuggestion('+i+')"><span class="aa-sug-text">'+s.replace(/</g,'&lt;')+'</span><svg class="aa-sug-arrow" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 16 16"><path d="M5 3l5 5-5 5"/></svg></button>').join(''); }
function openAiAssistant(){ const panel = document.getElementById('aiAssistant'); const ov = document.getElementById('aaOverlay'); if(!panel) return; _aaUpdateWsLabels(); _aaRenderSuggestions(); panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); ov.classList.add('open'); document.querySelector('.aa-trigger')?.classList.add('active'); setTimeout(()=>{ document.getElementById('aa-input')?.focus(); }, 220); }
function closeAiAssistant(){ const panel = document.getElementById('aiAssistant'); const ov = document.getElementById('aaOverlay'); if(!panel) return; panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); ov.classList.remove('open'); document.querySelector('.aa-trigger')?.classList.remove('active'); }
function aaUseSuggestion(idx){ const text = window.AA_SUGGESTIONS[idx]; if(text==null) return; const inp = document.getElementById('aa-input'); if(!inp) return; inp.value = text; aaInputChange(inp); inp.focus(); }
function aaInputChange(el){ const sendBtn = document.getElementById('aa-send-btn'); if(sendBtn) sendBtn.disabled = !el.value.trim().length; el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function aaKeyDown(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); aaSend(); } }
function aaSend(){ const inp = document.getElementById('aa-input'); if(!inp || !inp.value.trim()) return; const text = inp.value.trim(); _aaMessages.push({ role:'user', text }); document.getElementById('aa-empty').style.display = 'none'; const thread = document.getElementById('aa-thread'); thread.style.display = 'flex'; _aaRenderThread(); inp.value = ''; aaInputChange(inp); _aaShowTyping(); setTimeout(()=>{ _aaHideTyping(); const route = document.getElementById('aa-route-name')?.textContent || 'Auto-route'; _aaMessages.push({ role:'assistant', text: _aaMockReply(text, route) }); _aaRenderThread(); }, 1100); }
function _aaShowTyping(){ const thread = document.getElementById('aa-thread'); if(thread.querySelector('.aa-typing-row')) return; const row = document.createElement('div'); row.className = 'aa-msg assistant aa-typing-row'; row.innerHTML = '<div class="aa-msg-avatar">'+_AA_BOT_ICON+'</div><div class="aa-msg-bubble"><div class="aa-typing"><span></span><span></span><span></span></div></div>'; thread.appendChild(row); thread.scrollTop = thread.scrollHeight; }
function _aaHideTyping(){ document.querySelector('.aa-typing-row')?.remove(); }
function _aaMockReply(userText, route){ return "I'd route this to <strong>" + route.replace(/</g,'&lt;') + "</strong> and pull context from your workspace.<br><br><em style=\"opacity:.65\">Phase 1 mock — real agent routing and streaming responses come in Phase 2.</em>"; }
function _aaRenderThread(){ const thread = document.getElementById('aa-thread'); thread.innerHTML = _aaMessages.map(m => { if(m.role === 'user'){ return '<div class="aa-msg user"><div class="aa-msg-avatar">TH</div><div class="aa-msg-bubble">'+m.text.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div></div>'; } return '<div class="aa-msg assistant"><div class="aa-msg-avatar">'+_AA_BOT_ICON+'</div><div class="aa-msg-bubble">'+m.text+'</div></div>'; }).join(''); thread.scrollTop = thread.scrollHeight; }
const AA_AGENTS = [
  { id:'auto',        name:'Auto-route',                 desc:'Orchestrator picks the best agent', isAuto:true },
  { id:'sammy',       name:'Sammy — Service Desk',       color:'#0EA5E9' },
  { id:'spa-obj',     name:'Spanish Objection Handling', color:'#F59E0B' },
  { id:'svc-proc',    name:'Service Procedures',         color:'#10B981' },
  { id:'roadside',    name:'Roadside Triage',            color:'#EF4444' },
  { id:'warranty',    name:'Warranty Claims',            color:'#8B5CF6' },
  { id:'inbound-sdr', name:'Inbound SDR',                color:'#EC4899' },
  { id:'faq',         name:'Customer FAQ Bot',           color:'#06B6D4' },
  { id:'promo',       name:'Promo Outbound',             color:'#F97316' },
  { id:'escalation',  name:'Escalation Handler',         color:'#D946EF' },
  { id:'sox',         name:'SOX Compliance Auditor',     color:'#6366F1' },
  { id:'vehicle',     name:'Vehicle Specs Lookup',       color:'#22C55E' }
];
let _aaRouteActiveId = 'auto';
let _aaRouteSearch = '';
function aaToggleRouter(e){
  e.stopPropagation();
  let sw = document.getElementById('aa-route-sw');
  if(!sw){ sw = _aaCreateRouterDropdown(); }
  const pill = document.getElementById('aa-route-pill');
  const isOpen = sw.classList.toggle('open');
  pill.classList.toggle('is-open', isOpen);
  pill.setAttribute('aria-expanded', isOpen);
  if(isOpen){
    _aaRouteSearch = '';
    _aaRenderRouterList();
    setTimeout(()=>{
      document.getElementById('aa-route-search')?.focus();
      document.addEventListener('click', function closer(ev){
        if(!sw.contains(ev.target) && !pill.contains(ev.target)){
          sw.classList.remove('open'); pill.classList.remove('is-open'); pill.setAttribute('aria-expanded','false');
          document.removeEventListener('click', closer);
        }
      });
    }, 0);
  }
}
function _aaCreateRouterDropdown(){
  const pill = document.getElementById('aa-route-pill');
  const sw = document.createElement('div');
  sw.id='aa-route-sw'; sw.className='aa-route-sw'; sw.setAttribute('role','menu');
  sw.innerHTML = '<div class="aa-route-sw__search"><svg width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><input id="aa-route-search" type="text" placeholder="Search agents…" aria-label="Search agents" oninput="aaSearchAgents(this.value)" onclick="event.stopPropagation()"></div><div class="aa-route-sw__list" id="aa-route-list"></div>';
  sw.addEventListener('click', function(e){ e.stopPropagation(); });
  pill.appendChild(sw);
  return sw;
}
function _aaRenderRouterList(){
  const list = document.getElementById('aa-route-list'); if(!list) return;
  const q = _aaRouteSearch.trim().toLowerCase();
  const filtered = !q ? AA_AGENTS : AA_AGENTS.filter(a => a.name.toLowerCase().includes(q));
  if(filtered.length === 0){ list.innerHTML = '<div class="aa-route-sw__empty">No agents match "'+q.replace(/</g,'&lt;')+'"</div>'; return; }
  const auto = filtered.find(a => a.isAuto);
  const rest = filtered.filter(a => !a.isAuto);
  let html = '';
  if(auto){ html += _aaRouteItemHtml(auto); if(rest.length > 0) html += '<div class="aa-route-sw__divider"></div>'; }
  html += rest.map(_aaRouteItemHtml).join('');
  list.innerHTML = html;
}
function _aaRouteItemHtml(agent){
  const isActive = agent.id === _aaRouteActiveId;
  const initials = agent.name.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase();
  const icoHtml = agent.isAuto
    ? '<div class="aa-route-item__ico is-auto"><svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M8 1l1.4 4.6L14 7l-4.6 1.4L8 13l-1.4-4.6L2 7l4.6-1.4L8 1z" fill="#fff"/></svg></div>'
    : '<div class="aa-route-item__ico" style="background:'+agent.color+'">'+initials+'</div>';
  return '<button type="button" class="aa-route-item'+(isActive?' is-active':'')+'" role="menuitem" onclick="aaPickAgent(\''+agent.id+'\')">' + icoHtml + '<span class="aa-route-item__name">'+agent.name.replace(/</g,'&lt;')+'</span><svg class="aa-route-item__check" viewBox="0 0 16 16" fill="none"><path d="M3.5 8l3.5 3.5 5.5-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
}
function aaSearchAgents(q){ _aaRouteSearch = q; _aaRenderRouterList(); const inp = document.getElementById('aa-route-search'); if(inp){ inp.focus(); inp.value = q; } }
function aaPickAgent(id){
  _aaRouteActiveId = id;
  const agent = AA_AGENTS.find(a => a.id === id); if(!agent) return;
  const nameEl = document.getElementById('aa-route-name');
  const iconEl = document.getElementById('aa-route-icon');
  if(nameEl) nameEl.textContent = agent.name;
  if(iconEl){
    if(agent.isAuto){ iconEl.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M8 1l1.4 4.6L14 7l-4.6 1.4L8 13l-1.4-4.6L2 7l4.6-1.4L8 1z" fill="currentColor"/></svg>'; }
    else { const initials = agent.name.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase(); iconEl.innerHTML = '<span style="display:inline-flex;width:13px;height:13px;border-radius:3px;background:'+agent.color+';color:#fff;align-items:center;justify-content:center;font-size:7px;font-weight:700;letter-spacing:-.3px">'+initials+'</span>'; }
  }
  document.getElementById('aa-route-sw')?.classList.remove('open');
  document.getElementById('aa-route-pill')?.classList.remove('is-open');
  document.getElementById('aa-route-pill')?.setAttribute('aria-expanded','false');
}
document.addEventListener('keydown', function(e){ if((e.metaKey || e.ctrlKey) && e.key === '/'){ e.preventDefault(); const isOpen = document.getElementById('aiAssistant')?.classList.contains('open'); if(isOpen) closeAiAssistant(); else openAiAssistant(); } if(e.key === 'Escape' && document.getElementById('aiAssistant')?.classList.contains('open')){ closeAiAssistant(); } });
</script>
