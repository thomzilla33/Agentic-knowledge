<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AIMS-OS — Select Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: linear-gradient(155.58deg, #020618 14.2%, #0f172b 50%, #020618 85.8%);
      --surface: #0b1221;
      --surface-2: #101929;
      --border: rgba(255,255,255,.07);
      --border-hover: rgba(43,127,255,.38);
      --text-1: #f1f5f9;
      --text-2: #64748b;
      --text-3: #3d5068;
      --accent: #2B7FFF;
      --accent-h: #4a93ff;
      --cyan: #06B6D4;
      --emerald: #10B981;
      --blue: #3B82F6;
      --purple: #A78BFA;
      --amber: #F59E0B;
      /* DS CardContainer tokens */
      --card-default-bg: rgba(255,255,255,0.06);
      --card-default-border: rgba(255,255,255,0.10);
      --card-default-hover-bd: rgba(255,255,255,0.18);
      --card-default-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(255,255,255,.4),0 0 14px 0 rgba(255,255,255,.15);
      --card-primary-bg: rgba(43,127,255,0.08);
      --card-primary-border: rgba(43,127,255,0.22);
      --card-primary-hover-bd: #2b7fff;
      --card-primary-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(33,115,255,.4),0 0 14px 0 rgba(33,115,255,.15);
      --card-green-bg: #0a1f1a;
      --card-green-border: rgba(0,201,80,0.30);
      --card-green-hover-bd: #34d399;
      --card-green-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(0,201,79,.4),0 0 14px 0 rgba(0,201,79,.15);
      --card-purple-bg: #120520;
      --card-purple-border: rgba(173,70,255,0.20);
      --card-purple-hover-bd: #a855f7;
      --card-purple-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(173,69,255,.4),0 0 14px 0 rgba(173,69,255,.15);
      --card-orange-bg: #1a0e00;
      --card-orange-border: rgba(237,107,3,0.25);
      --card-orange-hover-bd: #f59e0b;
      --card-orange-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(237,107,3,.4),0 0 14px 0 rgba(237,107,3,.15);
      --card-yellow-bg: #1a1200;
      --card-yellow-border: rgba(245,158,11,0.25);
      --card-yellow-hover-bd: #fbbf24;
      --card-yellow-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(252,199,0,.4),0 0 14px 0 rgba(252,199,0,.15);
      --card-limegreen-bg: #111a04;
      --card-limegreen-border: rgba(189,238,73,0.20);
      --card-limegreen-hover-bd: #84cc16;
      --card-limegreen-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(189,237,74,.4),0 0 14px 0 rgba(189,237,74,.15);
      --card-lightblue-bg: #071828;
      --card-lightblue-border: rgba(81,162,255,0.20);
      --card-lightblue-hover-bd: #38bdf8;
      --card-lightblue-hover-shadow: 8px 8px 16px 0 rgba(0,0,0,.08),0 0 4px 1px rgba(82,163,255,.4),0 0 14px 0 rgba(82,163,255,.15);
      /* DS Badge tokens */
      --badge-success: #05df72;
      --badge-in-progress: #2b7fff;
      --badge-neutral: rgba(255,255,255,0.50);
      /* DS Tag tokens */
      --tag-secondary-bg: rgba(255,255,255,0.10); --tag-secondary-bd: rgba(255,255,255,0.10); --tag-secondary-fg: rgba(255,255,255,0.60);
      --tag-informative-bg: rgba(21,93,252,0.15); --tag-informative-bd: #2b7fff;              --tag-informative-fg: rgba(255,255,255,0.80);
      --tag-success-bg: #0a1f1a;                  --tag-success-bd: #34d399;                  --tag-success-fg: #6ee7b7;
      --tag-neutral-bg: rgba(255,255,255,0.08);   --tag-neutral-bd: rgba(255,255,255,0.10);   --tag-neutral-fg: rgba(255,255,255,0.60);
      --tag-purple-bg: #120520;                   --tag-purple-bd: #a855f7;                   --tag-purple-fg: #d8b4fe;
      --tag-limegreen-bg: #111a04;                --tag-limegreen-bd: #84cc16;                --tag-limegreen-fg: #bdef49;
      --tag-lightblue-bg: #071828;                --tag-lightblue-bd: #38bdf8;                --tag-lightblue-fg: #7dd3fc;
      --tag-yellow-bg: #1a1200;                   --tag-yellow-bd: #f59e0b;                   --tag-yellow-fg: #fbbf24;
      --tag-orange-bg: #1a0e00;                   --tag-orange-bd: #f97316;                   --tag-orange-fg: #fdba74;
      /* DS Filters tokens */
      --field-bg: rgba(255,255,255,0.06);
      --field-border: rgba(255,255,255,0.10);
      --field-border-hover: rgba(255,255,255,0.20);
      --field-icon: rgba(255,255,255,0.30);
      --fi-sort-icon: rgba(255,255,255,0.40);
      --fi-sort-text: rgba(255,255,255,0.65);
      /* DS InformativeCard tokens */
      --ic-informative-bg: rgba(33,115,255,0.12);
      --ic-informative-icon: #A8C8FF;
      --ic-informative-text: #A8C8FF;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Topbar ─────────────────────────────────────────────── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(2,6,24,.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-1);
      display: flex;
      align-items: center;
    }
    .logo-aims { color: #fff; }
    .logo-os {
      background: linear-gradient(to top, #1B72FF, #09E2AB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .help-link {
      font-size: 12px;
      color: var(--text-2);
      text-decoration: none;
      cursor: pointer;
      transition: color .15s;
    }
    .help-link:hover { color: var(--text-1); }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 5px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      user-select: none;
    }
    .user-pill:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.13); }

    .user-av {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2B7FFF, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .03em;
    }

    .user-email {
      font-size: 12px;
      color: var(--text-2);
    }

    /* ─── Hero ───────────────────────────────────────────────── */
    .hero {
      max-width: 980px;
      margin: 0 auto;
      padding: 52px 28px 32px;
      position: relative;
    }

.eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow::before {
      content: '';
      display: block;
      width: 18px;
      height: 1px;
      background: var(--accent);
      opacity: .6;
    }

    /* ─── DS Badge dot (success = #05df72) ─────────────────── */
    .ds-badge {
      display: inline-flex;
      flex-shrink: 0;
      border-radius: 50%;
    }
    .ds-badge-success {
      width: 8px;
      height: 8px;
      background: var(--badge-success, #05df72);
      position: relative;
    }
    .ds-badge-success::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--badge-success, #05df72);
      opacity: .28;
      animation: pulse-ring 2.4s ease infinite;
    }
    /* Legacy alias used in eyebrow */
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--badge-success, #05df72);
      flex-shrink: 0;
      position: relative;
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--badge-success, #05df72);
      opacity: .28;
      animation: pulse-ring 2.4s ease infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: .28; }
      50%       { transform: scale(2); opacity: 0; }
    }

    .hero-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -.015em;
      margin-bottom: 6px;
    }

    .hero-sub {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .hero-sub strong { color: var(--text-1); font-weight: 600; }

    /* ─── Search ─────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-ico {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-1);
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .search-input::placeholder { color: var(--field-icon); }
    .search-input:focus {
      border-color: var(--field-border-hover);
      background: var(--field-bg);
    }

    /* ─── Search ⌘K hint ─────────────────────────────────────── */
    .search-kbd {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--text-3);
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
      pointer-events: none;
      transition: opacity .2s;
      user-select: none;
    }
    .search-wrap:focus-within .search-kbd { opacity: 0; }

    /* ─── Grid ───────────────────────────────────────────────── */
    .main {
      max-width: 980px;
      margin: 0 auto;
      padding: 4px 28px 40px;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ─── Card ───────────────────────────────────────────────── */
    .card {
      background: var(--card-default-bg);
      border: 1px solid var(--card-default-border);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      position: relative;
      overflow: visible;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      animation: cardUp .24s ease both;
    }

    @keyframes cardUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .pulse-dot::after { animation: none; }
    }

    /* ─── Show-more button ───────────────────────────────────── */
    .show-more-btn {
      width: 100%;
      padding: 11px 16px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .show-more-btn:hover {
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.12);
      color: var(--text-1);
    }

    /* hover handled per card-v-* variant */

    .tenant-av {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      flex-shrink: 0;
    }

    .card-identity {
      flex: 0 0 210px;
      min-width: 0;
    }
    .card-hero .card-identity {
      flex: 0 0 280px;
    }

    .card-divider {
      width: 1px;
      align-self: stretch;
      background: var(--border);
      flex-shrink: 0;
    }

    .card-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    /* ─── DS Tag base structure ──────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      height: 20px;
      border-radius: 8px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    /* DS Tag variants — colors from token layer */
    .ds-tag-secondary   { background: var(--tag-secondary-bg);   border-color: var(--tag-secondary-bd);   color: var(--tag-secondary-fg);   }
    .ds-tag-informative { background: var(--tag-informative-bg);  border-color: var(--tag-informative-bd);  color: var(--tag-informative-fg);  }
    .ds-tag-success     { background: var(--tag-success-bg);     border-color: var(--tag-success-bd);     color: var(--tag-success-fg);     }
    .ds-tag-neutral     { background: var(--tag-neutral-bg);     border-color: var(--tag-neutral-bd);     color: var(--tag-neutral-fg);     }
    .ds-tag-purple      { background: var(--tag-purple-bg);      border-color: var(--tag-purple-bd);      color: var(--tag-purple-fg);      }
    .ds-tag-limegreen   { background: var(--tag-limegreen-bg);   border-color: var(--tag-limegreen-bd);   color: var(--tag-limegreen-fg);   }
    .ds-tag-lightblue   { background: var(--tag-lightblue-bg);   border-color: var(--tag-lightblue-bd);   color: var(--tag-lightblue-fg);   }
    .ds-tag-yellow      { background: var(--tag-yellow-bg);      border-color: var(--tag-yellow-bd);      color: var(--tag-yellow-fg);      }
    .ds-tag-orange      { background: var(--tag-orange-bg);      border-color: var(--tag-orange-bd);      color: var(--tag-orange-fg);      }

    .recent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #60A5FA;
    }

    .recent-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 2.4s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    /* Studios — wrapper + label */
    .studios-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .studios-open-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    /* Studios — horizontal */
    .studios-list {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px 8px;
      align-items: center;
    }

    .studio-chip {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      gap: 4px;
      padding: 0 12px;
      height: 27px;
      border-radius: 8px;
      background: var(--btn-secondary-bg, rgba(255,255,255,.10));
      border: 1px solid var(--btn-secondary-border, rgba(255,255,255,.10));
      cursor: pointer;
      font-family: inherit;
      transition: all 200ms ease;
      text-decoration: none;
      white-space: nowrap;
      outline: none;
    }
    .studio-chip:hover {
      background: var(--btn-secondary-hover-bg, rgba(255,255,255,.08));
      border-color: var(--btn-secondary-hover-bd, rgba(255,255,255,.20));
    }
    .studio-chip:active { opacity: .8; }
    .studio-chip:focus-visible {
      box-shadow: 0 0 0 2px var(--canvas, #0d1117), 0 0 0 4px var(--btn-secondary-ring, rgba(255,255,255,.25));
    }
    .chip-arrow {
      opacity: .55;
      display: flex;
      align-items: center;
      transition: opacity 200ms ease, transform 200ms ease;
    }
    .studio-chip:hover .chip-arrow { opacity: 1; transform: translateX(1px) translateY(-1px); }

    #compact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .studio-ico {
      width: 13px;
      height: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .studio-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: #ffffff;
    }

    /* ─── Page footer ───────────────────────────────────────────── */
    .page-footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 28px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .footer-rule {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .footer-mark {
      width: 18px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .7;
    }

    .footer-text {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    /* Actions */
    .card-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .last-visit {
      font-size: 10.5px;
      color: var(--text-3);
      white-space: nowrap;
    }

    /* ─── Enter workspace button (ghost fallback) ────────────── */
    .btn-main {
      padding: 6px 13px;
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,.14);
      cursor: pointer;
      border-radius: 8px;
      transition: border-color .14s, color .14s, background .14s;
      white-space: nowrap;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-main:hover {
      border-color: rgba(255,255,255,.28);
      color: var(--text-1);
      background: rgba(255,255,255,.05);
    }

    /* ─── Empty state ────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
    }

    .empty-ico {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      color: var(--text-3);
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }

    .empty-hint { font-size: 12px; color: var(--text-3); }

    /* ─── Toast ──────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #131f31;
      border: 1px solid rgba(43,127,255,.25);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-1);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 9999;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), opacity .22s;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .toast-pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: blink 1.4s ease infinite;
    }

    .toast-arrow {
      color: var(--text-3);
      display: flex;
      align-items: center;
    }

    /* ─── Greeting accent ───────────────────────────────────── */
    .name-accent {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: rgba(43,127,255,.35);
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }

    /* ─── Section labels ─────────────────────────────────────── */
    .section-label-hero,
    .section-label-other {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-label-hero { margin-bottom: 10px; }
    .section-label-other { margin: 20px 0 8px; }

    /* ─── Card description (hero only) ──────────────────────────── */
    .card-desc {
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.5;
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }


    /* ─── DS Filters: sort control ──────────────────────────────── */
    .sort-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--fi-sort-text);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s;
      flex-shrink: 0;
    }
    .sort-btn:hover { background: rgba(255,255,255,.09); border-color: var(--field-border-hover); color: var(--text-1); }
    .sort-btn svg { flex-shrink: 0; color: var(--fi-sort-icon); }

    /* ─── Single-tenant redirect banner ─────────────────────────── */
    .redirect-banner {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(43,127,255,.08);
      border: 1px solid rgba(43,127,255,.22);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .redirect-banner-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .redirect-banner-text {
      flex: 1;
      font-size: 12.5px;
      color: var(--text-2);
    }
    .redirect-banner-text strong { color: var(--text-1); font-weight: 600; }
    .redirect-cancel {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .redirect-cancel:hover { border-color: rgba(255,255,255,.18); color: var(--text-1); }
    .redirect-progress {
      height: 2px;
      width: 100%;
      background: rgba(43,127,255,.18);
      border-radius: 2px;
      overflow: hidden;
    }
    .redirect-progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      animation: progress-fill 2.4s linear forwards;
    }
    @keyframes progress-fill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* ─── Hero card (size only) ──────────────────────────────── */
    .card-hero {
      padding: 18px 22px;
    }
    .card-hero .tenant-av {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      font-size: 13px;
    }

    /* ─── DS CardContainer variants ──────────────────────────── */
    .card-v-default {
      background: var(--card-default-bg);
      border-color: var(--card-default-border);
    }
    .card-v-default:hover {
      border-color: var(--card-default-hover-bd);
      box-shadow: var(--card-default-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-primary {
      background: var(--card-primary-bg);
      border-color: var(--card-primary-border);
    }
    .card-v-primary:hover {
      border-color: var(--card-primary-hover-bd);
      box-shadow: var(--card-primary-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-green {
      background: var(--card-green-bg);
      border-color: var(--card-green-border);
    }
    .card-v-green:hover {
      border-color: var(--card-green-hover-bd);
      box-shadow: var(--card-green-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-purple {
      background: var(--card-purple-bg);
      border-color: var(--card-purple-border);
    }
    .card-v-purple:hover {
      border-color: var(--card-purple-hover-bd);
      box-shadow: var(--card-purple-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-orange {
      background: var(--card-orange-bg);
      border-color: var(--card-orange-border);
    }
    .card-v-orange:hover {
      border-color: var(--card-orange-hover-bd);
      box-shadow: var(--card-orange-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-yellow {
      background: var(--card-yellow-bg);
      border-color: var(--card-yellow-border);
    }
    .card-v-yellow:hover {
      border-color: var(--card-yellow-hover-bd);
      box-shadow: var(--card-yellow-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-limegreen {
      background: var(--card-limegreen-bg);
      border-color: var(--card-limegreen-border);
    }
    .card-v-limegreen:hover {
      border-color: var(--card-limegreen-hover-bd);
      box-shadow: var(--card-limegreen-hover-shadow);
      transform: translateY(-1px);
    }
    .card-v-lightblue {
      background: var(--card-lightblue-bg);
      border-color: var(--card-lightblue-border);
    }
    .card-v-lightblue:hover {
      border-color: var(--card-lightblue-hover-bd);
      box-shadow: var(--card-lightblue-hover-shadow);
      transform: translateY(-1px);
    }

    /* ─── InformativeCard banner (informative state) ─────────── */
    .ic-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--ic-informative-bg);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .ic-banner-icon {
      flex-shrink: 0;
      color: var(--ic-informative-icon);
      display: flex;
      align-items: center;
    }
    .ic-banner-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ic-informative-text);
      flex: 1;
    }
    .ic-banner-sub {
      font-size: 11.5px;
      font-weight: 400;
      color: var(--ic-informative-icon);
      opacity: .75;
      margin-top: 1px;
    }

    /* Compact secondary cards */
    .card-compact {
      padding: 9px 20px;
    }
    .card-compact .tenant-av {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      font-size: 11px;
    }
    .card-compact .card-name {
      font-size: 13.5px;
    }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      .topbar   { padding: 0 16px; }
      .hero     { padding: 32px 16px 24px; }
      .main     { padding: 0 16px 80px; }
      .hero-title { font-size: 22px; }
      .user-email { display: none; }
      .grid     { grid-template-columns: 1fr; }
    }

    /* ─── Fix 1: Active indicator on hero card ───────────────── */
    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-2);
      margin-top: 5px;
    }
    .active-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--badge-success, #05df72);
      box-shadow: 0 0 0 0 rgba(5,223,114,.4);
      animation: activePulse 2s ease infinite;
      flex-shrink: 0;
    }
    @keyframes activePulse {
      0%   { box-shadow: 0 0 0 0 rgba(5,223,114,.4); }
      70%  { box-shadow: 0 0 0 5px rgba(5,223,114,0); }
      100% { box-shadow: 0 0 0 0 rgba(5,223,114,0); }
    }
    .hero-last-visit {
      font-size: 10.5px;
      color: var(--text-3);
      white-space: nowrap;
      margin-top: 4px;
    }

    /* ─── Fix 2: Focus rings (a11y) ─────────────────────────── */
    *:focus { outline: none; }
    *:focus-visible {
      outline: 2px solid rgba(43,127,255,.65);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .card:focus-visible {
      outline: 2px solid rgba(43,127,255,.5);
      outline-offset: 0;
      border-radius: 12px;
    }
    .btn-main:focus-visible {
      outline: 2px solid rgba(255,255,255,.5);
      outline-offset: 1px;
    }

    /* ─── Fix 4: User menu dropdown ──────────────────────────── */
    .user-pill {
      cursor: pointer;
      position: relative;
    }
    .user-pill-chevron {
      display: flex;
      align-items: center;
      color: var(--text-3);
      transition: color .15s, transform .15s;
      flex-shrink: 0;
    }
    .user-pill:hover .user-pill-chevron { color: var(--text-2); }
    .user-pill.is-open .user-pill-chevron { transform: rotate(180deg); }

    .user-menu {
      position: fixed;
      top: 52px;
      right: 20px;
      background: #0e1726;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 12px;
      padding: 5px;
      min-width: 224px;
      box-shadow: 0 20px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
      z-index: 500;
      display: none;
      animation: ddIn .13s ease;
    }
    .user-menu.is-open { display: block; }

    .user-menu-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .user-menu-av {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .user-menu-info { min-width: 0; }
    .user-menu-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-menu-email {
      font-size: 10.5px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .user-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
      transition: background .1s, color .1s;
      user-select: none;
      font-family: inherit;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
    }
    .user-menu-item:hover { background: rgba(255,255,255,.06); color: var(--text-1); }
    .user-menu-item.danger { color: #f87171; }
    .user-menu-item.danger:hover { background: rgba(248,113,113,.08); color: #fca5a5; }
    .user-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

    /* ─── Fix 5: Loading skeleton ────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton-base {
      background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.04) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 6px;
    }
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .sk-av  { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
    .sk-col { display: flex; flex-direction: column; gap: 7px; flex: 1; }
    .sk-line { height: 10px; }
    .sk-line.w-40 { width: 40%; }
    .sk-line.w-25 { width: 25%; }
    .sk-line.w-60 { width: 60%; }
    .sk-btn { width: 120px; height: 32px; border-radius: 8px; flex-shrink: 0; }

    /* ─── Fix 5: Error state ─────────────────────────────────── */
    .error-state {
      text-align: center;
      padding: 56px 20px;
    }
    .error-ico {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      color: #f87171;
    }
    .error-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .error-hint { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s, color .15s;
    }
    .retry-btn:hover { background: rgba(255,255,255,.08); color: var(--text-1); border-color: rgba(255,255,255,.13); }

    /* ─── Tour engine ────────────────────────────────────────── */
    .tour-trigger{position:fixed;bottom:18px;left:18px;z-index:80;display:inline-flex;align-items:center;gap:6px;padding:0 16px 0 12px;height:38px;border-radius:9999px;background:linear-gradient(135deg,#06B6D4 0%,#A78BFA 100%);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:0 8px 24px rgba(6,182,212,.36),0 2px 8px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s}
    .tour-trigger:hover,.tour-trigger:focus-visible{transform:translateY(-2px);box-shadow:0 14px 32px rgba(6,182,212,.50),0 4px 12px rgba(0,0,0,.36);outline:none}
    .tour-trigger svg{flex-shrink:0;margin-left:1px}
    .tour-trigger-pulse{position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(6,182,212,.6);animation:tourPulse 2s ease-out infinite;pointer-events:none}
    .tour-trigger.seen .tour-trigger-pulse{display:none}
    .tour-trigger.tour-active{display:none}
    @keyframes tourPulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.25);opacity:0}}
    .tour-mask{position:fixed;z-index:9000;background:rgba(4,8,18,.55);pointer-events:auto;display:none}
    .tour-mask.active{display:block}
    .tour-spotlight{position:fixed;z-index:9001;pointer-events:none;border-radius:14px;border:2px solid #06B6D4;box-shadow:0 0 0 4px rgba(6,182,212,.18),0 0 32px rgba(6,182,212,.55),0 0 64px rgba(6,182,212,.25);background:transparent;transition:all .28s cubic-bezier(.4,0,.2,1);opacity:0}
    .tour-spotlight.active{opacity:1;animation:tourSpotlightPulse 2s ease-in-out infinite}
    @keyframes tourSpotlightPulse{0%,100%{box-shadow:0 0 0 4px rgba(6,182,212,.18),0 0 32px rgba(6,182,212,.55),0 0 64px rgba(6,182,212,.25)}50%{box-shadow:0 0 0 6px rgba(6,182,212,.28),0 0 48px rgba(6,182,212,.70),0 0 96px rgba(6,182,212,.35)}}
    .tour-popover{position:fixed;z-index:9002;width:360px;max-width:calc(100vw - 32px);background:linear-gradient(180deg,rgba(20,28,48,.98) 0%,rgba(13,19,35,.98) 100%);border:1px solid rgba(255,255,255,.14);border-radius:12px;backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 16px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04);padding:18px 20px;opacity:0;transform:scale(.96) translateY(4px);pointer-events:none;transition:opacity .2s ease-out,transform .25s cubic-bezier(.34,1.56,.64,1)}
    .tour-popover.active{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
    .tour-popover.is-sheet{left:8px !important;right:8px;top:auto !important;bottom:8px;width:auto;max-width:none}
    .tour-popover-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .tour-popover-step{font-size:10.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:#06B6D4;padding:2px 8px;border-radius:10px;background:rgba(6,182,212,.10);border:1px solid rgba(6,182,212,.25)}
    .tour-popover-restart{background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.38);font-size:11px;padding:4px 6px;border-radius:5px;font-family:inherit}
    .tour-popover-restart:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.92)}
    .tour-popover-skip{margin-left:auto;background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.38);font-size:11px;padding:4px 8px;border-radius:5px;font-family:inherit}
    .tour-popover-skip:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.92)}
    .tour-popover-title{font-size:16px;font-weight:700;color:rgba(255,255,255,.92);line-height:1.3;margin-bottom:8px}
    .tour-popover-body{font-size:13px;line-height:1.6;color:rgba(255,255,255,.60);margin-bottom:16px}
    .tour-popover-body strong,.tour-popover-body b{color:rgba(255,255,255,.92);font-weight:600}
    .tour-popover-footer{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.10)}
    .tour-progress{display:inline-flex;gap:4px;flex:1}
    .tour-progress-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.08);transition:background .15s,transform .15s}
    .tour-progress-dot.current{background:#06B6D4;transform:scale(1.4)}
    .tour-progress-dot.done{background:rgba(6,182,212,.45)}
    .tour-btn{padding:7px 14px;font-size:12.5px;font-weight:600;border-radius:6px;cursor:pointer;border:none;font-family:inherit;transition:.14s}
    .tour-btn-prev{background:transparent;color:rgba(255,255,255,.60);border:1px solid rgba(255,255,255,.10)}
    .tour-btn-prev:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.92)}
    .tour-btn-next{background:linear-gradient(135deg,#06B6D4 0%,#155DFC 100%);color:#fff;box-shadow:0 2px 8px rgba(6,182,212,.30)}
    .tour-btn-next:hover{transform:translateY(-1px)}
    .tour-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    @media(prefers-reduced-motion:reduce){.tour-spotlight,.tour-spotlight.active{animation:none;transition:none}.tour-popover{transition:none;transform:none}.tour-trigger-pulse{display:none}}
    @media(max-width:520px){.tour-trigger{bottom:14px;left:14px}}

    /* ─── Load more ──────────────────────────────────────────── */
    .load-more-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .load-more-rule { flex: 1; height: 1px; background: var(--border); }
    .load-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s, border-color .15s, color .15s;
    }
    .load-more-btn:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); color: var(--text-2); }
    .load-more-btn:focus-visible { outline: 2px solid rgba(43,127,255,.5); outline-offset: 2px; }
    .load-more-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 16px;
      padding: 0 4px;
      background: rgba(255,255,255,.07);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
    }

          <defs>
            <linearGradient id="aims-grad-nav" gradientUnits="userSpaceOnUse" x1="998.9767" y1="471.5211" x2="729.8956" y2="931.9746">
              <stop offset="0" stop-color="#09E2AB"/>

function studioChips(tenantId, keys) {
  return keys.map(k => {
    const s = STUDIOS[k];
    return `<button class="studio-chip" onclick="go('${tenantId}','${k}')" aria-label="Open ${s.label}">
      <span class="studio-name">${s.label}</span>
    </button>`;
  }).join('');
}

function buildCard(tenant, idx, featured = false) {
  const role = ROLES[tenant.role];
  const sizeClass = featured ? 'card-hero' : 'card-compact';
  const variantClass = `card-v-${tenant.cardVariant || 'default'}`;

  const lastStudioLabel = tenant.lastStudio ? STUDIOS[tenant.lastStudio].label : null;
  const lastVisitCopy = lastStudioLabel
    ? `Last in ${lastStudioLabel} · ${tenant.lastVisited}`
    : `Last visited ${tenant.lastVisited}`;

  const activeIndicator = featured ? `
    <div class="active-badge">
      <span class="ds-badge ds-badge-success active-pulse"></span>
      Active workspace
    </div>
    <div class="hero-last-visit">${lastVisitCopy}</div>` : '';

  const lastVisitRow = featured ? '' : `<span class="last-visit">${lastVisitCopy}</span>`;

  return `
    <div class="card ${sizeClass} ${variantClass}" style="animation-delay:${idx * 45}ms" tabindex="0" role="button">
      <!-- avatar -->
      <div class="tenant-av" style="background:${tenant.color}18;border:1px solid ${tenant.color}30;color:${tenant.color}">
        ${tenant.initials}
      </div>

      <!-- identity -->
      <div class="card-identity">
        <div class="card-name">${tenant.name}</div>
        <div class="badge-row">
          <span class="badge ${tenant.industryTag || 'ds-tag-neutral'}">${tenant.industry}</span>
          <span class="badge ${role.cls}">${role.label}</span>
        </div>
        ${activeIndicator}
      </div>

      <div class="card-divider"></div>

      <!-- studios (clickable chips) -->
      <div class="studios-section">
        <span class="studios-open-label">Open a studio</span>
        <div class="studios-list" id="sl-${tenant.id}">
          ${studioChips(tenant.id, tenant.studios)}
        </div>
      </div>

      ${lastVisitRow ? `<div class="card-actions">${lastVisitRow}</div>` : ''}
    </div>`;
}

// ─── Load more ────────────────────────────────────────────────────────────────

const COMPACT_LIMIT = 5;
const LOAD_MORE_BATCH = 3;
let _visibleCount = COMPACT_LIMIT;
let _currentList = [];

function loadMore() {
  _visibleCount += LOAD_MORE_BATCH;
  renderCompactList();
}

function renderCompactList() {
  const rest = _currentList.slice(1);
  const visible = rest.slice(0, _visibleCount);
  const hidden  = rest.length - visible.length;

  let html = visible.map((t, i) => buildCard(t, i + 1, false)).join('');

  if (hidden > 0) {
    html += `
      <div class="load-more-wrap">
        <div class="load-more-rule"></div>
        <button class="load-more-btn" onclick="loadMore()">
          Show ${hidden} more
        </button>
        <div class="load-more-rule"></div>
      </div>`;
  }

  const container = document.getElementById('compact-list');
  if (container) container.innerHTML = html;
}

          <div class="ic-banner-text">Pick up where you left off</div>
          <div class="ic-banner-sub">${heroVisitLine}</div>
        </div>
      </div>
      ${buildCard(hero, 0, true)}
    `;
    if (rest.length > 0) {
      html += `<div class="section-label-other">Other workspaces</div>`;
      html += `<div id="compact-list"></div>`;
    }
    gridEl.innerHTML = html;
    renderCompactList();
  } else {
    gridEl.innerHTML = list.map((t, i) => buildCard(t, i, false)).join('');
  }

  const countEl = document.getElementById('tenantCount');
  if (countEl) countEl.textContent = TENANTS.length;
}

// ─── Sort ─────────────────────────────────────────────────────────────────────

const SORT_CYCLES = ['recent', 'alpha', 'role'];
const SORT_LABELS = { recent: 'Last visited', alpha: 'A–Z', role: 'Role' };
const ROLE_ORDER  = ['platform-admin', 'org-admin', 'member', 'viewer'];
let sortIdx = 0;

function applySort(list) {
  const order = SORT_CYCLES[sortIdx];
  if (order === 'alpha')  return [...list].sort((a, b) => a.name.localeCompare(b.name));
  if (order === 'role')   return [...list].sort((a, b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role));
  return list; // 'recent' = original fixture order
}

function cycleSortOrder() {
  sortIdx = (sortIdx + 1) % SORT_CYCLES.length;
  document.getElementById('sortLabel').textContent = SORT_LABELS[SORT_CYCLES[sortIdx]];
  triggerRender();
}

// ─── Search ───────────────────────────────────────────────────────────────────

function triggerRender() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q
    ? TENANTS.filter(t =>
        t.name.toLowerCase().includes(q) ||
        t.industry.toLowerCase().includes(q) ||
        ROLES[t.role].label.toLowerCase().includes(q)
      )
    : TENANTS;
  closeAll();
  _visibleCount = COMPACT_LIMIT;
  render(applySort(filtered), !!q);
}

document.getElementById('searchInput').addEventListener('input', () => triggerRender());

// ─── Dropdown ─────────────────────────────────────────────────────────────────

function closeAll() { closeUserMenu(); }

// ─── Navigation (simulated) ───────────────────────────────────────────────────

const STUDIO_URLS = {
  home:       'admin-console.html',
  data:       'data-studio-models.html',
  agentic:    'agentic-studio.html',
  governance: 'governance-studio.html',
  ws:         'admin-console.html',
};

function go(tenantId, destination) {
  closeAll();
  const tenant = TENANTS.find(t => t.id === tenantId);
  const dest   = destination ?? 'home';
  const url    = STUDIO_URLS[dest] ?? 'admin-console.html';
  const label  = dest === 'home' ? tenant.name : STUDIOS[dest].label;
  toast(`Entering ${label}…`);
  setTimeout(() => { window.location.href = url; }, 900);
}

// ─── Toast ────────────────────────────────────────────────────────────────────

let _toastTimer;
function toast(msg) {
  document.getElementById('toastMsg').textContent = msg;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ─── Dynamic greeting ─────────────────────────────────────────────────────────

(function() {
  const h = new Date().getHours();
  const prefix = h < 12 ? 'Good morning, ' : h < 17 ? 'Good afternoon, ' : 'Good evening, ';
  const el = document.getElementById('greetPrefix');
  if (el) el.textContent = prefix;
})();

// ─── ⌘K / Ctrl+K → focus search ──────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const inp = document.getElementById('searchInput');
    if (inp) { inp.focus(); inp.select(); }
  }
});

// ─── Single-tenant auto-redirect ─────────────────────────────────────────────

let _redirectTimer = null;

function startSingleTenantRedirect(tenant) {
  const grid = document.getElementById('grid');
  const banner = document.createElement('div');
  banner.className = 'redirect-banner';
  banner.id = 'redirectBanner';
  banner.innerHTML = `
    <div class="redirect-banner-row">
      <div class="redirect-banner-text">
        You only have one workspace. Redirecting to <strong>${tenant.name}</strong>…
      </div>
      <button class="redirect-cancel" onclick="cancelRedirect()">Cancel</button>
    </div>
    <div class="redirect-progress"><div class="redirect-progress-bar" id="redirectBar"></div></div>`;
  grid.insertAdjacentElement('beforebegin', banner);
  _redirectTimer = setTimeout(() => go(tenant.id, 'home'), 2400);
}

function cancelRedirect() {
  clearTimeout(_redirectTimer);
  const banner = document.getElementById('redirectBanner');
  if (banner) banner.remove();
}

// ─── User menu ────────────────────────────────────────────────────────────────

let _userMenuOpen = false;

function toggleUserMenu(e) {
  e.stopPropagation();
  _userMenuOpen ? closeUserMenu() : openUserMenu();
}

function openUserMenu() {
  _userMenuOpen = true;
  document.getElementById('userMenu').classList.add('is-open');
  document.getElementById('userPill').classList.add('is-open');
  document.getElementById('userPill').setAttribute('aria-expanded', 'true');
  closeAll();
}

function closeUserMenu() {
  _userMenuOpen = false;
  document.getElementById('userMenu').classList.remove('is-open');
  document.getElementById('userPill').classList.remove('is-open');
  document.getElementById('userPill').setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', e => {
  if (_userMenuOpen && !document.getElementById('userMenu').contains(e.target)) {
    closeUserMenu();
  }
});

document.getElementById('userPill').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleUserMenu(e); }
  if (e.key === 'Escape') closeUserMenu();
});

// ─── Loading skeleton ──────────────────────────────────────────────────────────

function skeletonCard(hero = false) {
  return `
    <div class="skeleton-card" style="padding:${hero ? '20px 24px' : '15px 20px'}">
      <div class="sk-av skeleton-base"></div>
      <div class="sk-col">
        <div class="sk-line w-40 skeleton-base"></div>
        <div class="sk-line w-25 skeleton-base"></div>
        ${hero ? '<div class="sk-line w-60 skeleton-base" style="margin-top:6px"></div>' : ''}
      </div>
      <div class="sk-btn skeleton-base" style="margin-left:auto"></div>
    </div>`;
}

function showSkeleton() {
  const gridEl = document.getElementById('grid');
  gridEl.innerHTML = `
    <div class="section-label-hero" style="opacity:.4">Pick up where you left off</div>
    ${skeletonCard(true)}
    <div class="section-label-other" style="opacity:.4;margin-top:16px">Other workspaces</div>
    ${skeletonCard()}${skeletonCard()}${skeletonCard()}`;
}

// ─── Init ─────────────────────────────────────────────────────────────────────

showSkeleton();
setTimeout(() => {
  render(TENANTS, false);
  if (TENANTS.length === 1) startSingleTenantRedirect(TENANTS[0]);
}, 2000);

// ─── Sign out ──────────────────────────────────────────────────────────────────

function signOut() {
  closeUserMenu();
  window.location.href = 'login.html';
}

// ─── Selector tour steps ──────────────────────────────────────────────────────

const TOUR_LS_STEP = 'aims-tour-selector-step';
const TOUR_LS_DONE = 'aims-tour-selector-seen';
const PAGE_ON_TOUR_FINISH = 'admin-console.html?tour=entry';
let tourState = { active: false, stepIndex: 0 };
let _tourLastFocus = null;

const TOUR_STEPS = [
  {
    title: 'Your workspaces',
    body: 'Authentication complete — every organization on your account is listed here. This tour covers <strong>search, sorting, studios, and navigation</strong>. Use <strong>← →</strong> or the buttons to move between steps.',
  },
  {
    title: 'Search workspaces',
    body: 'Type a name, industry, or role to instantly filter the list. Press <strong>⌘K</strong> from anywhere on this page to jump straight to the search bar.',
    target: '#searchInput',
    scrollToTarget: false,
  },
  {
    title: 'Sort order',
    body: 'Cycle through <strong>Last visited → A–Z → Role</strong>. The sort resets when you search so the most relevant result always appears first.',
    target: '#sortBtn',
    scrollToTarget: false,
  },
  {
    title: 'Your active workspace',
    body: 'The <strong>hero card</strong> at the top is your most recently visited workspace. The green pulse confirms it\'s your current session — pick up exactly where you left off.',
    target: '.card-hero',
    scrollToTarget: false,
    setup: () => { closeAll(); closeUserMenu(); },
  },
  {
    title: 'Active workspace badge',
    body: 'The badge and timestamp sit inside the identity block, visible before you decide where to go. The green pulse is live — it disappears once your session expires.',
    target: '.active-badge',
    scrollToTarget: false,
  },
  {
    title: 'Where you left off',
    body: 'Each card shows <strong>which studio you visited last and when</strong>. Scan the right column to pick up your work without opening anything first.',
    target: '.last-visit',
    scrollToTarget: false,
    setup: () => { closeAll(); closeUserMenu(); render(TENANTS, false); },
  },
  {
    title: 'Open a studio directly',
    body: 'Click any studio chip to go straight there — <strong>no dropdown, no second click</strong>. The redirect icon confirms it\'s a direct navigation link. Each chip lands you inside that studio\'s main view.',
    target: '#sl-avance',
    scrollToTarget: false,
    setup: () => { closeAll(); },
  },
  {
    title: 'Load more workspaces',
    body: 'Workspaces beyond the first 5 are collapsed to keep the page scannable. The button tells you exactly how many are hidden — click to reveal them.',
    target: '.load-more-btn',
    scrollToTarget: true,
    setup: () => {
      closeAll(); closeUserMenu();
      _visibleCount = COMPACT_LIMIT;
      render(TENANTS, false);
    },
  },
  {
    title: 'Enter Governance Studio',
    body: 'Let\'s open a studio. Click <strong>Finish</strong> to enter the Governance Studio for Avance Financial — the tour continues inside.',
    target: '#sl-avance',
    scrollToTarget: false,
    setup: () => { closeAll(); closeUserMenu(); render(TENANTS, false); },
  },
];

// ─── Tour engine ──────────────────────────────────────────────────────────────

function _tourSave(){ try{ localStorage.setItem(TOUR_LS_STEP, String(tourState.stepIndex)); }catch(e){} }
function _tourClearProgress(){ try{ localStorage.removeItem(TOUR_LS_STEP); localStorage.setItem(TOUR_LS_DONE,'1'); }catch(e){} }

function startTour(){
  let i=0;
  try{ const s=localStorage.getItem(TOUR_LS_STEP); if(s!=null && +s>0 && +s<TOUR_STEPS.length) i=+s; }catch(e){}
  startTourAt(i);
}
function restartTour(){ startTourAt(0); }
function startTourAt(i){
  tourState={ active:true, stepIndex:Math.max(0,Math.min(i|0,TOUR_STEPS.length-1)) };
  _tourLastFocus=document.activeElement;
  const t=document.getElementById('tourTrigger'); if(t) t.classList.add('tour-active');
  paintTourStep();
}
function endTour(finished){
  tourState.active=false;
  const t=document.getElementById('tourTrigger');
  if(t){ t.classList.remove('tour-active'); t.classList.add('seen'); }
  ['tourMaskT','tourMaskR','tourMaskB','tourMaskL'].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.remove('active'); });
  const sp=document.getElementById('tourSpotlight'); if(sp) sp.classList.remove('active');
  const po=document.getElementById('tourPopover'); if(po) po.classList.remove('active');
  finished ? _tourClearProgress() : _tourSave();
  closeAll(); closeUserMenu();
  _tourRefreshTriggerLabel();
  if(_tourLastFocus && _tourLastFocus.focus){ try{ _tourLastFocus.focus(); }catch(e){} }
  if(finished && typeof PAGE_ON_TOUR_FINISH !== 'undefined'){
    setTimeout(() => { location.href = PAGE_ON_TOUR_FINISH; }, 350);
  }
}
function tourNext(){ if(tourState.stepIndex>=TOUR_STEPS.length-1){ endTour(true); return; } tourState.stepIndex++; _tourSave(); paintTourStep(); }
function tourPrev(){ if(tourState.stepIndex<=0) return; tourState.stepIndex--; _tourSave(); paintTourStep(); }

function paintTourStep(){
  if(!tourState.active) return;
  const step=TOUR_STEPS[tourState.stepIndex];
  const isFirst=tourState.stepIndex===0, isLast=tourState.stepIndex===TOUR_STEPS.length-1;
  if(typeof step.setup==='function'){ try{ step.setup(); }catch(e){} }
  setTimeout(()=>{
    const popover=document.getElementById('tourPopover'), spotlight=document.getElementById('tourSpotlight');
    popover.innerHTML=`
      <div class="tour-popover-header">
        <span class="tour-popover-step">Step ${tourState.stepIndex+1} of ${TOUR_STEPS.length}</span>
        ${!isFirst?`<button class="tour-popover-restart" onclick="restartTour()">Restart</button>`:''}
        <button class="tour-popover-skip" onclick="endTour(false)">Skip tour</button>
      </div>
      <div class="tour-popover-title" id="tourTitle">${step.title}</div>
      <div class="tour-popover-body">${step.body}</div>
      <div class="tour-popover-footer">
        <div class="tour-progress">${TOUR_STEPS.map((_,i)=>`<div class="tour-progress-dot ${i===tourState.stepIndex?'current':i<tourState.stepIndex?'done':''}"></div>`).join('')}</div>
        ${!isFirst?`<button class="tour-btn tour-btn-prev" onclick="tourPrev()">← Back</button>`:''}
        <button class="tour-btn tour-btn-next" onclick="${isLast?'endTour(true)':'tourNext()'}">${isLast?'Finish':'Next →'}</button>
      </div>`;
    const targetEl=step.target ? document.querySelector(step.target) : null;
    if(targetEl){
      const place=()=>{ _tourPlace(targetEl.getBoundingClientRect(), popover, spotlight); };
      setTimeout(place, step.scrollToTarget ? 700 : 80);
      if(step.scrollToTarget) setTimeout(place, 1200);
    } else {
      _tourMaskFull(); spotlight.classList.remove('active'); _tourCenter(popover);
    }
    const live=document.getElementById('tourLive');
    if(live) live.textContent=`Step ${tourState.stepIndex+1} of ${TOUR_STEPS.length}. ${step.title}`;
    const nextBtn=popover.querySelector('.tour-btn-next'); if(nextBtn) setTimeout(()=>nextBtn.focus(),80);
  }, step.setup ? 180 : 50);
}

function _tourPlace(rect, popover, spotlight){
  const pad=6;
  spotlight.style.left=(rect.left-pad)+'px'; spotlight.style.top=(rect.top-pad)+'px';
  spotlight.style.width=(rect.width+pad*2)+'px'; spotlight.style.height=(rect.height+pad*2)+'px';
  spotlight.classList.add('active');
  _tourMask(rect,pad);
  if(window.innerWidth<560){ popover.classList.add('is-sheet'); popover.classList.add('active'); return; }
  popover.classList.remove('is-sheet');
  const pw=360, ph=popover.offsetHeight||260, m=16, W=window.innerWidth, H=window.innerHeight;
  let top, left;
  if(rect.bottom+ph+m<H){ top=rect.bottom+16; left=Math.min(Math.max(rect.left,16),W-pw-16); }
  else if(rect.top-ph-m>0){ top=rect.top-ph-16; left=Math.min(Math.max(rect.left,16),W-pw-16); }
  else { top=(H-ph)/2; left=(W-pw)/2; }
  popover.style.left=left+'px'; popover.style.top=top+'px'; popover.classList.add('active');
}
function _tourMask(rect,pad){
  const W=window.innerWidth,H=window.innerHeight;
  const top=Math.max(0,rect.top-pad),bot=Math.min(H,rect.bottom+pad),lft=Math.max(0,rect.left-pad),rgt=Math.min(W,rect.right+pad);
  const set=(id,l,t,w,h)=>{ const e=document.getElementById(id); e.style.left=l+'px'; e.style.top=t+'px'; e.style.width=Math.max(0,w)+'px'; e.style.height=Math.max(0,h)+'px'; e.classList.add('active'); };
  set('tourMaskT',0,0,W,top); set('tourMaskB',0,bot,W,H-bot); set('tourMaskL',0,top,lft,bot-top); set('tourMaskR',rgt,top,W-rgt,bot-top);
}
function _tourMaskFull(){
  const T=document.getElementById('tourMaskT'); T.style.left='0'; T.style.top='0'; T.style.width='100vw'; T.style.height='100vh'; T.classList.add('active');
  ['tourMaskR','tourMaskB','tourMaskL'].forEach(id=>{ const e=document.getElementById(id); e.classList.remove('active'); });
}
function _tourCenter(popover){
  if(window.innerWidth<560){ popover.classList.add('is-sheet'); popover.classList.add('active'); return; }
  popover.classList.remove('is-sheet');
  popover.style.left=((window.innerWidth-360)/2)+'px'; popover.style.top=((window.innerHeight-(popover.offsetHeight||260))/2)+'px';
  popover.classList.add('active');
}

document.addEventListener('keydown',(e)=>{
  if(!tourState.active) return;
  if(e.key==='Escape'){ endTour(false); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); tourNext(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); tourPrev(); }
});
document.addEventListener('keydown',(e)=>{
  if(!tourState.active || e.key!=='Tab') return;
  const po=document.getElementById('tourPopover');
  const f=po.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

function _tourRefreshTriggerLabel(){
  const t=document.getElementById('tourTrigger'); if(!t) return;
  const label=t.querySelector('.tour-trigger-label');
  let saved=null; try{ saved=localStorage.getItem(TOUR_LS_STEP); }catch(e){}
  if(saved!=null && +saved>0 && +saved<TOUR_STEPS.length){ if(label) label.textContent='Continue'; t.classList.add('seen'); }
  else{ if(label) label.textContent='Demo'; try{ if(localStorage.getItem(TOUR_LS_DONE)) t.classList.add('seen'); }catch(e){} }
}

(function tourInit(){
  _tourRefreshTriggerLabel();
  try{
    const q=new URLSearchParams(window.location.search).get('tour');
    if(q!=null){
      const n=parseInt(q,10);
      if(!isNaN(n)){
        // wait for skeleton to clear before starting
        setTimeout(()=>startTourAt(Math.max(0,n-1)), 2200);
      }
    }
  }catch(e){}
})();
</script>

  </button>
  <div class="tour-mask" id="tourMaskT"></div>
  <div class="tour-mask" id="tourMaskR"></div>

  <div class="tour-spotlight" id="tourSpotlight"></div>
