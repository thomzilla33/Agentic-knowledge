<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMS-OS — Voice Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset & Tokens ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0b0d12;
  --surface:   #12151e;
  --surface2:  #191d29;
  --surface3:  #1f2433;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --text:      #e8eaf2;
  --muted:     #5d6380;
  --muted2:    #8890b0;
  --accent:    #6c63ff;
  --accent2:   #5a52e0;
  --green:     #22d388;
  --amber:     #f5a623;
  --red:       #f04e5e;
  --blue:      #3b8beb;
  --cyan:      #29c6e0;
  --r:         8px;
  --r2:        12px;
  --r3:        16px;
  --shadow:    0 24px 60px rgba(0,0,0,0.7);
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 13px; -webkit-font-smoothing: antialiased; }

/* ── App Shell ──────────────────────────────────────────────────────────── */
.shell { display: flex; height: 100vh; }

/* ── Sidebar (AIMS OS Design System) ─────────────────────────────────── */
.sidebar{
  width:64px;flex-shrink:0;background:#000;display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,0.07);
  transition:width .22s cubic-bezier(.4,0,.2,1);overflow:hidden;
}
.sidebar.sb-expanded{width:250px}
.sb-brand{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;flex-shrink:0;border:0;border-bottom:1px solid rgba(255,255,255,0.05);overflow:visible;white-space:nowrap;background:transparent;width:100%;cursor:pointer;position:relative;color:inherit}
.sb-brand:hover{background:rgba(255,255,255,0.04)}
.sidebar:not(.sb-expanded) .sb-brand{justify-content:center;padding:0}
.sb-brand-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0}
.sb-brand-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.sidebar.sb-expanded .sb-brand-name{opacity:1}
.sb-brand-chevron{width:12px;height:12px;flex-shrink:0;opacity:0;color:rgba(255,255,255,0.6);transition:opacity .15s,transform .15s;margin-left:auto}
.sidebar.sb-expanded .sb-brand-chevron{opacity:1}
.sb-brand.studio-open .sb-brand-chevron{transform:rotate(180deg)}

/* ── Studio switcher dropdown ── */
.studio-sw{position:fixed;top:54px;left:64px;width:248px;background:#131929;border:1px solid rgba(255,255,255,0.10);border-radius:12px;box-shadow:0 20px 56px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.04);z-index:200;overflow:hidden;opacity:0;transform:translateY(-6px) scale(0.97);pointer-events:none;transition:opacity .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1)}
.sidebar.sb-expanded ~ .studio-sw{left:258px}
.studio-sw.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.studio-sw-hd{padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,0.06)}
.studio-sw-title{font-size:10px;font-weight:700;color:#5d6380;text-transform:uppercase;letter-spacing:.08em}
.studio-item{display:flex;align-items:center;gap:11px;padding:9px 12px;cursor:pointer;transition:background .1s;text-decoration:none;border:none;background:none;width:100%;text-align:left}
.studio-item:hover{background:rgba(255,255,255,0.05)}
.studio-item.s-active{background:rgba(43,127,255,0.08)}
.studio-item-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.3px}
.studio-item-info{flex:1;min-width:0;text-align:left}
.studio-item-name{font-size:13px;font-weight:600;color:#e8eaf2;white-space:nowrap}
.studio-item-desc{font-size:11px;color:#8890b0;margin-top:1px}
.studio-item-badge{width:16px;height:16px;flex-shrink:0;color:#155DFC}

/* ── Knowledge iframe view (Governance Studio embed) ── */
.gs-view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:50}
.gs-view.open{display:flex}
.gs-view-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.gs-view-back{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:500;padding:6px 11px;border-radius:7px;cursor:pointer;transition:background .15s}
.gs-view-back:hover{background:rgba(255,255,255,0.08)}
.gs-view-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text)}
.gs-view-label-ico{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff}
.gs-view-sub{font-size:11px;color:var(--muted2);margin-left:4px}
.gs-view-iframe{flex:1;width:100%;border:0;background:var(--bg);display:block}
.sb-nav{flex:1;display:flex;flex-direction:column;padding:6px 8px;gap:2px;overflow:hidden}
.sb-item{
  display:flex;align-items:center;height:40px;border:none;border-radius:10px;
  background:transparent;color:rgba(255,255,255,0.42);font-size:12px;font-weight:600;
  cursor:pointer;width:100%;text-align:left;transition:background .15s,color .15s;
  white-space:nowrap;overflow:hidden;flex-shrink:0;padding:0;
}
.sidebar:not(.sb-expanded) .sb-item{justify-content:center;gap:0}
.sidebar.sb-expanded .sb-item{justify-content:flex-start;padding:0 12px;gap:10px}
.sb-item:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,.80)}
.sb-item.active{background:linear-gradient(135deg,rgba(21,93,252,0.55) 0%,rgba(0,194,194,0.35) 100%);color:#fff}
.sb-item.active:hover{background:linear-gradient(135deg,rgba(21,93,252,0.65) 0%,rgba(0,194,194,0.45) 100%)}
.sidebar:not(.sb-expanded) .sb-item.active{background:transparent}
.sidebar:not(.sb-expanded) .sb-item.active .sb-item-icon{background:linear-gradient(135deg,#155DFC 0%,#00C2C2 100%);border-radius:10px;width:36px;height:36px;box-shadow:0 0 12px rgba(21,93,252,0.45)}
.sb-item-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sb-item-icon svg{width:18px;height:18px}
.sb-label{opacity:0;transition:opacity .12s;pointer-events:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar.sb-expanded .sb-label{opacity:1;pointer-events:auto}
.sb-chevron{margin-left:auto;width:13px;height:13px;flex-shrink:0;opacity:0;color:rgba(255,255,255,.35)}
.sidebar.sb-expanded .sb-chevron{opacity:1}
.sb-divider{height:1px;background:rgba(255,255,255,0.06);margin:4px 0;flex-shrink:0}
.sb-bottom{flex-shrink:0;border-top:1px solid rgba(255,255,255,0.05);padding:4px 8px 6px}
.sb-toggle{
  display:flex;align-items:center;height:40px;border:none;border-radius:10px;
  background:transparent;color:rgba(128,175,255,0.55);font-size:12px;font-weight:600;
  cursor:pointer;width:100%;white-space:nowrap;overflow:hidden;transition:background .12s,color .12s;
}
.sidebar:not(.sb-expanded) .sb-toggle{justify-content:center;gap:0;padding:0}
.sidebar.sb-expanded .sb-toggle{justify-content:flex-start;padding:0 12px;gap:10px}
.sb-toggle:hover{background:rgba(255,255,255,0.06);color:#80AFFF}
.sb-toggle-icon{width:18px;height:18px;flex-shrink:0;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.sidebar.sb-expanded .sb-toggle-icon{transform:rotate(180deg)}
.sb-toggle-label{opacity:0;transition:opacity .12s}
.sidebar.sb-expanded .sb-toggle-label{opacity:1}
.user-name { font-size: 12px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--muted); }

/* ── Main Content ───────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Page Header ────────────────────────────────────────────────────────── */
.page-header {
  padding: 20px 28px 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.page-title { font-family: var(--font-head); font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.page-title-icon { font-size: 20px; }
.page-tabs { display: flex; gap: 2px; }

.tab-btn {
  padding: 9px 16px; background: none; border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted2); font-family: var(--font-body); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; margin-bottom: -1px;
  display: flex; align-items: center; gap: 7px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

/* ── Page Content ───────────────────────────────────────────────────────── */
.page-content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ── Filter Bar ─────────────────────────────────────────────────────────── */
.filter-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
.search-input {
  width: 100%; padding: 7px 10px 7px 32px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); font-family: var(--font-body); font-size: 13px;
  outline: none; transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.filter-chip {
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border2); background: none;
  color: var(--muted2); font-family: var(--font-body); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.filter-chip:hover { border-color: var(--border2); color: var(--text); }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.ml-auto { margin-left: auto; }

.btn-primary {
  padding: 7px 16px; background: var(--accent); border: none;
  border-radius: var(--r); color: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--accent2); }
.btn-secondary {
  padding: 7px 14px; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); font-family: var(--font-body); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.btn-secondary:hover { background: var(--surface3); }
.btn-danger {
  padding: 7px 14px; background: var(--red); border: none;
  border-radius: var(--r); color: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.btn-danger:hover { background: #d03848; }
.btn-ghost {
  padding: 6px 12px; background: none; border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--muted2); font-family: var(--font-body); font-size: 12px;
  cursor: pointer; transition: all 0.15s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

/* ── Table ──────────────────────────────────────────────────────────────── */
.table-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 1; }
th {
  padding: 10px 14px; text-align: left;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); background: var(--surface2);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background 0.1s; }
tbody tr:hover { background: var(--surface2); }
tbody tr.selected { background: rgba(108,99,255,0.07); }
tbody tr:last-child td { border-bottom: none; }

.mono { font-family: var(--font-mono); font-size: 12px; }
.dim { color: var(--muted2); }
.right { text-align: right; }

/* ── Badges ─────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.badge-green  { background: rgba(34,211,136,0.12); color: var(--green); }
.badge-amber  { background: rgba(245,166,35,0.12);  color: var(--amber); }
.badge-red    { background: rgba(240,78,94,0.12);   color: var(--red); }
.badge-blue   { background: rgba(59,139,235,0.12);  color: var(--blue); }
.badge-purple { background: rgba(108,99,255,0.12);  color: var(--accent); }
.badge-gray   { background: rgba(93,99,128,0.15);   color: var(--muted2); }

/* dot */
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.dot-green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot-amber  { background: var(--amber); }
.dot-gray   { background: var(--muted); }

/* ── Avatar stack ───────────────────────────────────────────────────────── */
.avatar-stack { display: flex; }
.avatar {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--surface);
  margin-left: -7px; font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.avatar:first-child { margin-left: 0; }
.avatar-overflow { background: var(--surface3); color: var(--muted2); font-size: 9px; }

/* ── HiL shield ─────────────────────────────────────────────────────────── */
.hil-icon { color: var(--accent); font-size: 13px; }
.hil-none { color: var(--muted); font-size: 13px; }

/* ── Overlay ────────────────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(3px); z-index: 200;
  display: flex; align-items: flex-end;
  animation: fadeIn 0.2s ease;
}
.overlay-center { align-items: center; justify-content: center; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ── Bottom Sheet ───────────────────────────────────────────────────────── */
.sheet {
  width: 100%; max-height: 92vh;
  background: var(--surface); border-top: 1px solid var(--border2);
  border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column;
  animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }

.sheet-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px 14px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sheet-top-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.close-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; transition: color 0.15s; }
.close-btn:hover { color: var(--text); }

.sheet-identity { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-number { font-family: var(--font-head); font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.sheet-sub { font-size: 13px; color: var(--muted2); margin-bottom: 12px; }
.sheet-badges { display: flex; gap: 8px; }

.sheet-stats { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-stat { flex: 1; padding: 16px 24px; text-align: center; border-right: 1px solid var(--border); }
.sheet-stat:last-child { border-right: none; }
.sheet-stat-val { font-family: var(--font-head); font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 3px; }
.sheet-stat-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.sheet-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-tab { flex: 1; padding: 12px 8px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted2); font-family: var(--font-body); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; margin-bottom: -1px; }
.sheet-tab:hover { color: var(--text); }
.sheet-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

.sheet-body { flex: 1; overflow-y: auto; padding: 0 24px 8px; }

.sheet-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; background: var(--surface); }
.sheet-btn-release { flex: 1; padding: 13px; border: 1.5px solid var(--red); background: transparent; border-radius: var(--r); color: var(--red); font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.sheet-btn-release:hover { background: rgba(240,78,94,0.08); }
.sheet-btn-save { flex: 2; padding: 13px; background: var(--accent); border: none; border-radius: var(--r); color: #fff; font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.sheet-btn-save:hover { background: var(--accent2); }

/* ── Section in sheet ───────────────────────────────────────────────────── */
.s-section { padding-top: 22px; }
.s-section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.s-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.s-row:last-child { border-bottom: none; }
.s-row-label { font-size: 13px; font-weight: 500; flex-shrink: 0; }
.s-row-sub { font-size: 11px; color: var(--muted2); margin-top: 2px; }
.s-row-val { flex: 1; text-align: right; color: var(--muted2); font-size: 13px; max-width: 260px; }
.s-row-toggle { align-items: flex-start; }

/* ── Toggle Switch ──────────────────────────────────────────────────────── */
.toggle {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--surface3); border: none; cursor: pointer;
  position: relative; flex-shrink: 0; transition: background 0.2s;
}
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--muted); transition: transform 0.2s, background 0.2s;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); background: #fff; }
.toggle:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Select / Input ─────────────────────────────────────────────────────── */
.form-select, .form-input {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text);
  font-family: var(--font-body); font-size: 13px;
  padding: 6px 10px; outline: none;
  transition: border-color 0.15s;
}
.form-select:focus, .form-input:focus { border-color: var(--accent); }
.form-select { cursor: pointer; }

/* ── Modal ──────────────────────────────────────────────────────────────── */
.modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--r3); width: 520px; max-height: 88vh;
  box-shadow: var(--shadow); display: flex; flex-direction: column;
  animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}
@keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

.modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.modal-title { font-family: var(--font-head); font-size: 16px; font-weight: 700; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

/* Stepper */
.stepper { display: flex; align-items: center; gap: 0; margin-bottom: 22px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-num { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--muted); flex-shrink: 0; transition: all 0.2s; }
.step.active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.done .step-num { background: var(--green); border-color: var(--green); color: #fff; }
.step-label { font-size: 12px; color: var(--muted); }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step-line { flex: 1; height: 1px; background: var(--border2); min-width: 20px; }

/* Form field */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 8px 10px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); font-family: var(--font-body); font-size: 13px;
  outline: none; transition: border-color 0.15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }

/* Number option card */
.num-option {
  padding: 12px 14px; border-radius: var(--r);
  border: 1.5px solid var(--border2); margin-bottom: 8px;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.num-option:hover { border-color: var(--accent); background: rgba(108,99,255,0.04); }
.num-option.selected { border-color: var(--accent); background: rgba(108,99,255,0.08); }
.num-option-left { flex: 1; }
.num-option-number { font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin-bottom: 3px; }
.num-option-region { font-size: 11px; color: var(--muted2); }
.num-option-caps { display: flex; gap: 4px; }
.cap { padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; background: rgba(108,99,255,0.15); color: var(--accent); }
.num-option-price { font-size: 13px; font-weight: 600; color: var(--green); white-space: nowrap; }

/* Confirm card */
.confirm-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); padding: 20px; text-align: center; margin-bottom: 16px; }
.confirm-num { font-family: var(--font-head); font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.confirm-label { font-size: 13px; color: var(--muted2); }
.confirm-price { font-size: 14px; font-weight: 600; color: var(--green); margin-top: 8px; }

/* Alert banner */
.alert { padding: 10px 14px; border-radius: var(--r); font-size: 13px; margin-bottom: 12px; }
.alert-warn { background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.25); color: var(--amber); }
.alert-red  { background: rgba(240,78,94,0.1);  border: 1px solid rgba(240,78,94,0.25);  color: var(--red); }
.alert-info { background: rgba(108,99,255,0.1); border: 1px solid rgba(108,99,255,0.25); color: var(--accent); }

/* ── Agents tab ─────────────────────────────────────────────────────────── */
.agents-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.agents-table th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
.agents-table td { padding: 10px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
.agents-table tbody tr:hover { background: rgba(255,255,255,0.02); }

.agent-cell { display: flex; align-items: center; gap: 10px; }
.agent-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.agent-name { font-size: 13px; font-weight: 500; }
.agent-email { font-size: 11px; color: var(--muted); }

.status-pill { display: flex; align-items: center; gap: 5px; font-size: 12px; }

.remove-btn { padding: 4px 10px; background: none; border: 1px solid rgba(240,78,94,0.3); border-radius: var(--r); color: var(--red); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; opacity: 0; }
tr:hover .remove-btn { opacity: 1; }
.remove-btn:hover { background: rgba(240,78,94,0.1); }

/* Distribution radio */
.dist-options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.dist-option { padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--border2); cursor: pointer; transition: all 0.15s; display: flex; align-items: flex-start; gap: 12px; }
.dist-option:hover { border-color: var(--border2); background: var(--surface2); }
.dist-option.selected { border-color: var(--accent); background: rgba(108,99,255,0.06); }
.dist-option input { margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.dist-option-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.dist-option-desc { font-size: 12px; color: var(--muted2); }

/* HiL section */
.hil-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); padding: 16px; margin-top: 16px; }
.hil-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.hil-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.hil-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(108,99,255,0.15); color: var(--accent); font-weight: 700; }

.trigger-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.trigger-chip { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border2); font-size: 11px; font-weight: 500; color: var(--muted2); cursor: pointer; transition: all 0.15s; }
.trigger-chip.on { background: rgba(108,99,255,0.12); border-color: var(--accent); color: var(--accent); }

.notif-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.notif-row:last-child { border-bottom: none; }
.notif-label { font-size: 13px; display: flex; align-items: center; gap: 8px; }

/* ── Call History tab ───────────────────────────────────────────────────── */
.log-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; border-radius: var(--r); padding: 10px 8px; transition: background 0.1s; }
.log-item:hover { background: rgba(255,255,255,0.03); }
.log-dir { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.log-dir-in  { background: rgba(34,211,136,0.1); color: var(--green); }
.log-dir-out { background: rgba(59,139,235,0.1); color: var(--blue); }
.log-info { flex: 1; }
.log-num { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.log-meta { font-size: 11px; color: var(--muted); }
.log-dur { font-size: 12px; color: var(--muted2); font-family: var(--font-mono); }

/* ── Call History page ──────────────────────────────────────────────────── */
.logs-layout { display: flex; gap: 16px; }
.logs-table-wrap { flex: 1; }
.log-detail-panel { width: 400px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2); display: flex; flex-direction: column; overflow: hidden; max-height: calc(100vh - 160px); animation: slideRight 0.2s ease; }
@keyframes slideRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

.detail-hdr { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
.detail-num { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
.detail-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.detail-chips { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
.detail-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.detail-tab { flex: 1; padding: 9px 8px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted2); font-family: var(--font-body); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; margin-bottom: -1px; }
.detail-tab:hover { color: var(--text); }
.detail-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.detail-body { flex: 1; overflow-y: auto; padding: 14px 16px; }

/* Transcript bubbles */
.bubble { max-width: 88%; padding: 8px 12px; border-radius: var(--r2); margin-bottom: 10px; }
.bubble-caller { align-self: flex-end; background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.2); margin-left: auto; }
.bubble-agent  { background: var(--surface2); border: 1px solid var(--border); }
.bubble-human  { background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.2); }
.bubble-role { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 3px; }
.bubble-text { font-size: 13px; line-height: 1.5; }
.bubble-time { font-size: 10px; color: var(--muted); text-align: right; margin-top: 4px; }
.hil-divider { border: none; border-top: 1px dashed rgba(245,166,35,0.3); margin: 12px 0; position: relative; }
.hil-divider-label { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 8px; font-size: 10px; color: var(--amber); white-space: nowrap; }

/* Overview cards */
.overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.ov-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); padding: 16px; }
.ov-card-val { font-family: var(--font-head); font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.ov-card-lbl { font-size: 11px; color: var(--muted); }

/* Business hours grid */
.hours-grid { display: flex; flex-direction: column; gap: 6px; }
.hours-row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
.hours-day { width: 32px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.hours-times { display: flex; align-items: center; gap: 8px; flex: 1; }
.hours-input { width: 90px; padding: 5px 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); font-family: var(--font-mono); font-size: 12px; outline: none; }
.hours-input:focus { border-color: var(--accent); }
.hours-dash { color: var(--muted); }

/* Release modal */
.impact-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--surface2); border-radius: var(--r); margin-bottom: 8px; font-size: 13px; }
.impact-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.type-confirm { width: 100%; padding: 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); font-family: var(--font-mono); font-size: 14px; text-align: center; outline: none; letter-spacing: 0.15em; transition: border-color 0.15s; margin-top: 4px; }
.type-confirm:focus { border-color: var(--red); }
.type-confirm.valid { border-color: var(--green); }

/* Add agent modal */
.agent-pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; transition: background 0.1s; }
.agent-pick-item:hover { background: var(--surface2); }
.agent-pick-item.selected { background: rgba(108,99,255,0.08); }
.agent-pick-check { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all 0.15s; }
.agent-pick-item.selected .agent-pick-check { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Toast */
.toast-wrap { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: var(--r2); min-width: 280px; max-width: 400px; pointer-events: all; animation: toastIn 0.25s ease; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.toast-success { background: #0d2b1f; border: 1px solid rgba(34,211,136,0.3); }
.toast-error   { background: #2a0f12; border: 1px solid rgba(240,78,94,0.3); }
.toast-info    { background: var(--surface2); border: 1px solid var(--border2); }
.toast-icon { font-size: 14px; flex-shrink: 0; }
.toast-success .toast-icon { color: var(--green); }
.toast-error   .toast-icon { color: var(--red); }
.toast-msg { font-size: 13px; flex: 1; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-title { font-family: var(--font-head); font-size: 16px; color: var(--muted2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; margin-bottom: 20px; }

/* Separator */
.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* row gap */
.flex { display: flex; }
.items-center { align-items: center; }
.gap-8 { gap: 8px; }
.gap-4 { gap: 4px; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.hidden { display: none !important; }
/* ── PAGINATION ── */
.pagination{height:48px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;border-top:1px solid var(--border);background:var(--surface2);flex-shrink:0;gap:24px}
.pgn-rpp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2);white-space:nowrap}
.pgn-rpp-wrap{position:relative}
.pgn-rpp-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap}
.pgn-rpp-btn:hover{background:rgba(255,255,255,0.07);border-color:var(--border2)}
.pgn-rpp-menu{position:absolute;bottom:calc(100% + 4px);left:0;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:4px;min-width:72px;z-index:120;display:none;flex-direction:column;gap:1px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pgn-rpp-menu.open{display:flex}
.pgn-rpp-val{pointer-events:none}
.pgn-rpp-opt{padding:7px 12px;font-size:12px;color:var(--text);border-radius:5px;cursor:pointer;background:none;border:none;text-align:left;width:100%;transition:background .1s}
.pgn-rpp-opt:hover{background:rgba(255,255,255,0.06)}
.pgn-rpp-opt.sel{color:var(--accent);background:rgba(108,99,255,0.12)}
.pgn-range{font-size:12px;color:var(--text);white-space:nowrap}
.pgn-nav{display:flex;align-items:center;gap:4px}
.pgn-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.04);cursor:pointer;color:var(--text);transition:all .15s}
.pgn-btn:hover:not(:disabled){border-color:var(--border2);background:rgba(255,255,255,0.08)}
.pgn-btn:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>

      </button>

      <button class="sb-item" title="Workspace" aria-label="Workspace">
        <span class="sb-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg></span>
        <span class="sb-label">Workspace</span>
      </button>
    </div>

    <div class="sb-bottom">
      <button class="sb-toggle" id="sbToggleBtn" onclick="sbToggle()" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="false">
        <svg class="sb-toggle-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4L6 9l5 5"/><line x1="3" y1="3" x2="3" y2="15"/>
        </svg>
        <span class="sb-toggle-label">Collapse</span>
      </button>
    </div>

  </nav>

  <!-- ── Main ── -->
  <div class="main" style="position:relative">

    <!-- Governance Studio embedded view (default content — fills .main) -->
    <div class="gs-view open" id="gsView" aria-hidden="false">
      <div class="gs-view-hd">
        <div class="gs-view-label">
          <span class="gs-view-label-ico">GS</span>
          <span id="gsViewTitle">Knowledge</span>
          <span class="gs-view-sub">· Governance Studio</span>
        </div>
      </div>
      <iframe id="gsFrame" class="gs-view-iframe" title="Governance Studio" src="governance-studio/?embed=1#/intelligence-library/knowledge"></iframe>
    </div>

  </div>
</div>

<script>

/* ── Studio switcher dropdown ── */
function toggleStudioSw(e){
  if (e) e.stopPropagation();
  const sw = document.getElementById('studioSw');
  const btn = document.getElementById('studioLauncher');
  const isOpen = sw.classList.toggle('open');
  btn.classList.toggle('studio-open', isOpen);
  btn.setAttribute('aria-expanded', isOpen);
}
function closeStudioSw(){
  const sw = document.getElementById('studioSw');
  const btn = document.getElementById('studioLauncher');
  sw.classList.remove('open');
  btn.classList.remove('studio-open');
  btn.setAttribute('aria-expanded','false');
}
document.addEventListener('click',(e)=>{
  const sw = document.getElementById('studioSw');
  const btn = document.getElementById('studioLauncher');
  if (!sw || !btn) return;
  if (sw.classList.contains('open') && !btn.contains(e.target) && !sw.contains(e.target)) {
    closeStudioSw();
  }
});
document.addEventListener('keydown',(e)=>{ if (e.key === 'Escape') closeStudioSw(); });

/* ── Governance Studio embedded view ───────────────────────────────────────
   The whole .main area is dedicated to the Governance Studio iframe. This
   page is a thin shell — the sidebar lets users switch between Governance
   Studio routes; the SWITCH STUDIO menu jumps to other products.
*/
function setGSRoute(route, title){
  const frame = document.getElementById('gsFrame');
  const t     = document.getElementById('gsViewTitle');
  frame.src   = `governance-studio/?embed=1#/${route}`;
  if (t && title) t.textContent = title;
  // Reflect active state on the sidebar
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  if (route.includes('knowledge')) document.getElementById('sbKnowledgeBtn')?.classList.add('active');
}
// Back-compat shim: existing sidebar buttons still call openGSView(...)
function openGSView(route, title){ setGSRoute(route, title); }

// Mark the Knowledge sidebar item as active on initial load (it's the default route).
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sbKnowledgeBtn')?.classList.add('active');
});

/* ── Sidebar toggle ── */
function sbToggle(){
  const sb=document.getElementById('appSidebar');
  const btn=document.getElementById('sbToggleBtn');
  const expanded=sb.classList.toggle('sb-expanded');
  btn.setAttribute('aria-expanded',expanded);
  btn.querySelector('.sb-toggle-label').textContent=expanded?'Collapse':'Expand';
  try{localStorage.setItem('sb_vc_expanded',expanded?'1':'0');}catch(e){}
}
(function(){
  try{
    if(localStorage.getItem('sb_vc_expanded')==='1'){
      const sb=document.getElementById('appSidebar');
      const btn=document.getElementById('sbToggleBtn');
      if(sb){sb.classList.add('sb-expanded');}
      if(btn){btn.setAttribute('aria-expanded','true');btn.querySelector('.sb-toggle-label').textContent='Collapse';}
    }
  }catch(e){}
})();
</script>
</body>
</html>
