function togglePerm(slug, studio) {
  const i = findIntegration(slug);
  i.studios = i.studios || {governance:false, agentic:false, workforce:false};
  i.studios[studio] = !i.studios[studio];
  paintDetail(i);
}
function togglePersonalAllow(slug) {
  const i = findIntegration(slug); i.allowPersonal = !i.allowPersonal; paintDetail(i);
}
function disconnect(slug) {
  if(!confirm('Disconnect this integration? This will revoke credentials.')) return;
  const i = findIntegration(slug);
  i.connected = false; i.health = null;
  toast(`${i.name} disconnected`, 'success'); paintDetail(i);
}

/* ====================== CONNECT DRAWER ====================== */

function openConnect(slug) {
  const i = findIntegration(slug);
  if (!i) return;
  const existingCount = instancesOf(slug).length;
  state.drawerState = {
    integration:i,
    step:0,  // Step 0: Name your instance (NEW per engineering brief §5.2)
    instanceName: existingCount>0 ? `${i.name} — Instance ${existingCount+1}` : i.name,
    instanceDesc: '',
    authMode: i.multiTenant ? null : 'byok',  // null = customer picks AIMS-managed or BYOK
    authMethod:i.authMethods[0],
    studios:{governance:true,agentic:true,workforce:true},
    allowPersonal:false,
    authenticated:false,
    apiKeyValid:false,
    apiKey:'',
    displayName:''
  };
  state.drawerOpen = true;
  paintDrawer();
  $('drawerOverlay').classList.add('open');
  $('drawer').classList.add('open');
  setTimeout(()=>{ const inp=document.querySelector('.drawer input'); if(inp) inp.focus(); }, 300);
}

function closeDrawer() {
  state.drawerOpen = false;
  $('drawerOverlay').classList.remove('open');
  $('drawer').classList.remove('open');
}

function paintDrawer() {
  const s = state.drawerState; if(!s) return;

      </p>
      <div class="field-group">
        <label class="field-label">Instance name</label>
        <input class="input" type="text" placeholder="e.g. ${escapeHtml(i.name)} — Production" value="${escapeHtml(s.instanceName)}" oninput="state.drawerState.instanceName=this.value"/>
        <div class="field-help">A clear, distinguishing name. You'll see this everywhere this instance is referenced.</div>
      </div>
      <div class="field-group">
        <label class="field-label">Description (optional)</label>
        <input class="input" type="text" placeholder="What is this instance used for?" value="${escapeHtml(s.instanceDesc)}" oninput="state.drawerState.instanceDesc=this.value"/>

            <div class="auth-card ${s.authMode==='aims_managed'?'selected':''}" onclick="state.drawerState.authMode='aims_managed';paintDrawer()">
              <div class="auth-card-h"><span class="auth-name">AIMS-managed</span><span class="badge">Recommended</span></div>
              <div class="auth-card-desc">We provision a tenant-isolated subaccount on ${escapeHtml(i.name)}. Billed through AIMS. Faster setup, no key rotation.</div>
            </div>
            <div class="auth-card ${s.authMode==='byok'?'selected':''}" onclick="state.drawerState.authMode='byok';paintDrawer()">
              <div class="auth-card-h"><span class="auth-name">Bring your own key (BYOK)</span></div>
              <div class="auth-card-desc">Use your own ${escapeHtml(i.name)} account. Full control, billed by ${escapeHtml(i.name)} directly.</div>
            </div>
          </div>
        </div>
      ` : `
        <div class="field-group" style="padding-top:6px;border-top:1px solid var(--line);margin-top:6px">
          <label class="field-label">Authentication</label>

        </div>
      `}
    `;

    footer = `<button class="btn btn-ghost btn-sm" onclick="closeDrawer()">Cancel</button><button class="btn btn-primary btn-sm" ${canContinue?'':'disabled style="opacity:.5;cursor:not-allowed"'} onclick="drawerNext()">Continue →</button>`;
  }

  else if (s.step === 1) {
    body = `
      <div class="drawer-step-h">Step 2 of 6 · Authentication method</div>
      <div class="drawer-step-title">Choose how to connect to ${escapeHtml(i.name)}</div>
      <p style="font-size:11.5px;color:var(--t3);margin-bottom:14px;font-style:italic;line-height:1.55">

      </p>
      ${i.authMethods.map(m => {
        const pattern = AUTH_PATTERNS[m]; if (!pattern) return '';
        const sel = s.authMethod===m ? 'selected' : '';
        return `
          <div class="auth-card ${sel}" onclick="selectAuth('${m}')">
            <div class="auth-card-h">
              <span class="auth-name"><span style="margin-right:5px">${pattern.icon}</span>${escapeHtml(pattern.label)}</span>

  }

  else if (s.step === 2) {
    if (s.authMethod==='oauth') {

          <button class="btn btn-ghost btn-sm" onclick="testApiKey()">Test connection</button>

              return `
                <div class="map-row">

  }

  else if (s.step === 6) {
    const studios = Object.keys(s.studios).filter(k=>s.studios[k]).map(k=>STUDIO_META[k].label).join(', ');
    const mapping = fieldMappingFor(i.slug);
    const customCount = mapping.customFields.length;
    const decisions = s.mappingDecisions || {};
    const skipCount = Object.values(decisions).filter(v => v === 'skip').length;
    const mappedCount = customCount - skipCount;
    body = `
      <div class="drawer-step-h">Step 7 of 7 · Confirm</div>
      <div class="drawer-step-title">Review and connect</div>

        ${i.capabilities.length} ${i.capabilities.length===1?'capability':'capabilities'} enabled · Visible to Workspace Admins.<br>

function selectAuth(m){ state.drawerState.authMethod = m; paintDrawer() }
function drawerNext(){ state.drawerState.step++; paintDrawer() }
function drawerPrev(){ state.drawerState.step--; paintDrawer() }
function toggleMapSection(which){
  if (which === 'auto') state.drawerState.mapAutoOpen = !state.drawerState.mapAutoOpen;
  paintDrawer();
}
function setMapDecision(idx, decision){
  state.drawerState.mappingDecisions = state.drawerState.mappingDecisions || {};
  state.drawerState.mappingDecisions[idx] = decision;
  paintDrawer();
}
function toggleDrawerStudio(k){ state.drawerState.studios[k] = !state.drawerState.studios[k]; paintDrawer() }
function simulateOAuth(){
  toast('Opening OAuth popup…','success');
  setTimeout(()=>{ state.drawerState.authenticated = true; paintDrawer() }, 800);
}
function testApiKey(){
  if(!state.drawerState.apiKey){ toast('Paste a token first','error'); return }
  toast('Testing token…');
  setTimeout(()=>{ state.drawerState.apiKeyValid = true; paintDrawer() }, 600);
}
function simulateServiceUpload(){
  toast('Validating key file…');
  setTimeout(()=>{ state.drawerState.authenticated = true; paintDrawer() }, 600);
}
function finalizeConnect(){
  const s = state.drawerState; const i = s.integration;
  i.connected = true; i.health = 'healthy'; i.lastRun = 'just now'; i.errors24h = 0;
  i.connectedBy = {name:'Thomas González', initials:'TG'}; i.connectedAt = 'just now';
  i.studios = {...s.studios};
  i.allowPersonal = s.allowPersonal;
  closeDrawer();
  toast(`${i.name} connected ✓`, 'success');
  navigate(`#/integrations/${i.slug}`);
}

/* ====================== AUDIT (full) ====================== */

let auditFilters = { severity:new Set(), eventTypes:new Set(), dateRange:'30d', search:'', expanded:null };

function renderAudit() {
  let events = AUDIT_EVENTS;
  if (auditFilters.severity.size>0) events = events.filter(e=>auditFilters.severity.has(e.sev));
  if (auditFilters.search) {
    const q = auditFilters.search.toLowerCase();
    events = events.filter(e => (e.event||'').toLowerCase().includes(q) || (e.actor||'').toLowerCase().includes(q) || (e.resource||'').toLowerCase().includes(q));
  }

  $('content').innerHTML = `
    <div class="breadcrumb">
      <a href="#/integrations">Settings</a>
      <span class="crumb-sep">›</span>
      <span>Workspace</span>
      <span class="crumb-sep">›</span>
      <span class="crumb-current">Audit log</span>
    </div>

    <div class="ph">
      <div class="ph-top">
        <div class="ph-text">
          <div class="ph-h1">Audit log</div>
          <div class="ph-sub">Workspace-wide events for the last 90 days. Export to CSV or stream via webhook.</div>
        </div>
        <div class="ph-actions">
          <button class="btn btn-ghost btn-sm" onclick="toast('Webhook export drawer opened')">Configure webhook export</button>
          <button class="btn btn-primary btn-sm" onclick="toast('CSV exported','success')">Export CSV</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="audit-filters">
        <div class="audit-filter">
          <span>Date range:</span>
          <select class="audit-filter-input">
            <option>Last 30 days</option><option>Last 7 days</option><option>Last 90 days</option><option>Custom…</option>
          </select>
        </div>
        <div class="audit-filter">
          <span>Severity:</span>
          ${['info','warn','crit'].map(sev=>`<button class="pill ${auditFilters.severity.has(sev)?'active':''}" style="font-size:11px;padding:3px 9px" onclick="toggleAuditSev('${sev}')">${sev==='info'?'Info':sev==='warn'?'Warning':'Critical'}</button>`).join('')}
        </div>
        <div class="audit-filter" style="flex:1;min-width:200px">
          <input class="audit-filter-input" type="text" placeholder="Search by event, actor, resource…" value="${escapeHtml(auditFilters.search)}" oninput="auditFilters.search=this.value;renderAudit();setTimeout(()=>{const i=document.querySelector('.audit-filter input[type=text]');if(i){i.focus();i.setSelectionRange(this.value.length,this.value.length)}},0)"/>
        </div>
        <span class="audit-count">Showing ${events.length} of ${AUDIT_EVENTS.length} events</span>
      </div>

      ${events.length===0 ? `
        <div class="empty"><div class="empty-h">No events match these filters</div><div class="empty-p">Try widening the date range.</div></div>
      ` : auditTable(events, true)}
    </div>
  `;
}

function auditTable(events, full) {
  return `
    <table class="audit-table">
      <thead>
        <tr>
          <th style="width:120px">Timestamp</th>
          <th style="width:80px">Severity</th>
          <th>Event</th>
          <th>Actor</th>
          ${full?'<th>Resource</th>':''}
          <th>Studio</th>
          ${full?'<th>IP</th>':''}
          <th style="width:30px"></th>
        </tr>
      </thead>
      <tbody>
        ${events.map((e, idx) => `
          <tr onclick="toggleAuditExpand(${idx})">
            <td title="${escapeHtml(e.tsAbs||'')}">${escapeHtml(e.ts)}</td>
            <td><span class="audit-ev ${e.sev==='info'?'info':e.sev==='warn'?'warn':'crit'}">${e.sev.toUpperCase()}</span></td>
            <td><span class="audit-ev">${escapeHtml(e.event)}</span></td>
            <td><div class="audit-actor">${e.actorType==='agent'?'<span style="color:var(--purple);font-weight:600">🤖</span>':e.actorType==='system'?'<span style="color:var(--t3)">⚙</span>':'<div class="av" style="width:18px;height:18px;border-radius:50%;background:var(--grad);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">'+(e.actor[0]||'').toUpperCase()+'</div>'}<span>${escapeHtml(e.actor)}</span></div></td>
            ${full?`<td>${e.resource?'<a href="#/integrations/'+e.resource+'" style="color:var(--accent);text-decoration:none" onclick="event.stopPropagation()">'+escapeHtml(e.resource)+'</a>':'<span style="color:var(--t3)">—</span>'}</td>`:''}
            <td>${e.studio?'<span style="font-size:11px;color:var(--t2)">'+STUDIO_META[e.studio].label+'</span>':'<span style="color:var(--t3)">—</span>'}</td>
            ${full?`<td style="color:var(--t3);font-family:'SF Mono',Menlo,monospace;font-size:11px">${e.ip||'—'}</td>`:''}
            <td><svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="color:var(--t3);transition:transform .15s;${auditFilters.expanded===idx?'transform:rotate(180deg)':''}"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></td>
          </tr>
          ${auditFilters.expanded===idx ? `
            <tr><td colspan="${full?8:6}" style="padding:8px 12px 14px">
              <div class="audit-expand">${escapeHtml(JSON.stringify({timestamp:e.tsAbs, severity:e.sev, event:e.event, actor:e.actor, resource:e.resource, studio:e.studio, ip:e.ip, details:e.details}, null, 2))}</div>
              <div style="margin-top:6px;display:flex;gap:6px">
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toast('Event ID copied to clipboard','success')">Copy event ID</button>
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toast('cURL copied to clipboard','success')">Copy as cURL</button>
              </div>
            </td></tr>
          ` : ''}
        `).join('')}
      </tbody>
    </table>
  `;
}

function toggleAuditSev(sev) { auditFilters.severity.has(sev) ? auditFilters.severity.delete(sev) : auditFilters.severity.add(sev); renderAudit() }
function toggleAuditExpand(idx) { auditFilters.expanded = auditFilters.expanded===idx ? null : idx; renderAudit() }

function addWebhookAction() {
  const name = prompt('Action name (slug):'); if(!name) return;
  webhookState.actions.push({ name, method:'POST', url:'https://api.example.com/'+name });
  renderBuildWebhook();
}

function publishWebhook() {
  const s = webhookState;
  if(!s.name || !s.category){ toast('Name and category are required','error'); return }
  const slug = s.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  INTEGRATIONS.push({
    slug, name:s.name, vendor:'Built by your workspace', category:s.category, color:'#06B6D4',
    desc:s.desc||'Private workspace integration.',
    capabilities:[...webhookState.capabilities], authMethods:[s.auth==='none'?'apikey':'apikey'],
    source:'private', connected:false
  });
  toast(`${s.name} published as a Private integration ✓`,'success');
  webhookState.step = 1; webhookState.name=''; webhookState.desc=''; webhookState.actions=[];
  navigate('#/integrations');
}

let aiState = { slug:null, history:[], typing:false };

const AI_SUGGESTIONS = {
  initial: [
    { icon:'🛡', text:'How do I connect this securely?' },
    { icon:'⚡', text:'What can agents do with this?' },
    { icon:'🔍', text:'Show recent activity & issues' },
    { icon:'📊', text:'What permissions are needed?' }
  ],
  followUp: [
    { icon:'💡', text:'Suggest a workflow for this' },
    { icon:'🔄', text:'Compare with similar integrations' },
    { icon:'📚', text:'Show example use cases' },
    { icon:'⚙', text:'Best practices for this integration' }
  ]
};

function aiAnswer(prompt, i) {
  const p = prompt.toLowerCase();

  // 1. Connect securely
  if ((p.includes('connect') || p.includes('setup') || p.includes('install')) && (p.includes('secur') || p.includes('how'))) {
    const method = i.authMethods.includes('oauth') ? 'OAuth 2.0' : i.authMethods.includes('apikey') ? 'API token' : 'Service account';
    return `For ${i.name}, the most secure connection method is **${method}**.\n\nHere's the recommended flow:\n\n1. Use ${method} (not legacy auth)\n2. Grant only minimum required scopes\n3. Enable scope-based audit logging\n4. Rotate credentials every 90 days\n5. Restrict usage to specific studios + roles\n\nWant me to walk you through it? I can open the Connect drawer with secure defaults pre-selected.`;
  }

  // 2. What can agents do
  if ((p.includes('what can') || p.includes('what does') || p.includes('agent') || p.includes('use'))) {
    const caps = (i.capabilities||[]).map(c => `**${CAP_META[c].label}**`).join(', ');
    let body = `${i.name} exposes ${i.capabilities.length} ${i.capabilities.length===1?'capability':'capabilities'}: ${caps}.\n\n`;
    if (i.capabilities.includes('tools')) body += `**Tools** — agents can invoke ${i.tools?.length||'multiple'} actions${i.tools? ': ' + i.tools.slice(0,3).map(t=>'`'+t.name+'`').join(', ') + (i.tools.length>3?` and ${i.tools.length-3} more.`:'.') : '.'}\n\n`;
    if (i.capabilities.includes('knowledge')) body += `**Knowledge** — index ${i.name} as a searchable source for Governance.\n\n`;
    if (i.capabilities.includes('triggers')) body += `**Triggers** — wake agents on ${i.name} events.\n\n`;
    if (i.capabilities.includes('channels')) body += `**Channels** — agents can send outputs to ${i.name}.\n\n`;
    body += `Top use case in workspaces like yours: routing escalations from agents to the right team via ${i.name}.`;
    return body;
  }

  // 3. Recent activity / issues
  if (p.includes('recent') || p.includes('issue') || p.includes('error') || p.includes('activity') || p.includes('health')) {
    if (!i.connected) return `${i.name} is not connected yet. Once you connect it, I can show recent activity, errors, and usage patterns from the audit log.`;
    const events = AUDIT_EVENTS.filter(e => e.resource===i.slug);
    let body = `Health check for ${i.name}: **${i.health==='healthy'?'Healthy ✓':i.health==='degraded'?'Degraded ⚠':'Failed ✕'}**\n\n`;
    body += `**Last 24h:** ${i.errors24h||0} errors, last successful call ${i.lastRun}.\n\n`;
    if (events.length > 0) {
      body += `**Recent events (${events.length}):**\n`;
      events.slice(0,3).forEach(e => { body += `• ${e.ts} — \`${e.event}\` by ${e.actor}\n`; });
    }
    if (i.health === 'degraded') body += `\n💡 **My take:** the degradation looks transient. I'd watch it for the next hour before rotating credentials.`;
    if (i.health === 'failed') body += `\n💡 **My take:** the credentials likely expired. Want me to guide you through rotation?`;
    if (i.health === 'healthy') body += `\n💡 **My take:** everything looks good. No action needed.`;
    return body;
  }

  // 4. Permissions
  if (p.includes('permission') || p.includes('scope') || p.includes('access')) {
    let body = `For ${i.name}, the **least-privilege** recommendation depends on what your agents will do:\n\n`;
    if (i.scopes) body += `**Currently requested scopes:** ${i.scopes.map(s=>'`'+s+'`').join(', ')}\n\n`;
    body += `**Per studio:**\n`;
    body += `• **Agentic** — restrict to ${i.rolesAg?.[0]||'specific roles'} that actually invoke ${i.name}\n`;
    body += `• **Governance** — read-only access if you're using it as knowledge source\n`;
    body += `• **Workforce** — channel-write only for notifications\n\n`;
    body += `💡 I detected that 4 of the current scopes are unused by any agent. Want me to suggest a tighter set?`;
    return body;
  }

  // Follow-up: workflow suggestion
  if (p.includes('workflow') || p.includes('suggest a')) {
    return `Here's a workflow idea using ${i.name}:\n\n**"Auto-escalate critical issues to humans"**\n\n1. **Trigger** — a customer submits feedback containing sentiment < -0.7\n2. **Action** — agent enriches with customer context from CRM\n3. **${i.name}** — agent posts an alert with context to your ops channel\n4. **Wait** — workflow pauses for human acknowledgment\n5. **Resume** — if ack within 5min → continue; otherwise escalate\n\nWant me to scaffold this in Agentic Studio? I can pre-fill the nodes for you.`;
  }

  // Follow-up: compare
  if (p.includes('compare') || p.includes('similar') || p.includes('alternative')) {
    return `Comparable integrations in our catalog:\n\n• **Same category** as ${i.name} — see the ${(CATEGORIES.find(c=>c.slug===i.category)||{}).label} section\n• **Most-used alternative** by similar workspaces (industry, size) — depends on your stack\n\nWant a side-by-side comparison table? I can pull capabilities, auth methods, and recent reliability scores.`;
  }

  // Follow-up: use cases
  if (p.includes('use case') || p.includes('example')) {
    const cases = (i.useCases || defaultUseCases(i));
    return `Common use cases for ${i.name} in workspaces like yours:\n\n${cases.map((c,idx)=>`${idx+1}. ${c}`).join('\n')}\n\nWant me to dig into a specific one with implementation details?`;
  }

  // Follow-up: best practices
  if (p.includes('best practice') || p.includes('practice')) {
    return `Best practices for ${i.name}:\n\n1. **Secure by default** — OAuth over API keys when possible\n2. **Audit before broadening scope** — start narrow, expand on demand\n3. **Tag for compliance** — mark PII-touching integrations explicitly\n4. **Rate limit at the AIMS layer** — protect ${i.name} from agent loops\n5. **Health alerts** — wire degraded states to your on-call channel\n\nAnything specific you want to dive into?`;
  }

  // Default fallback
  return `Great question about **${i.name}**. Let me give you the relevant context:\n\n${i.desc}\n\n${i.connected ? `It's currently **${i.health||'connected'}** with ${i.errors24h||0} errors in the last 24h.` : `It's **not connected** yet.`}\n\nWhat angle would help most — security, capabilities, troubleshooting, or implementation?`;
}

    <div class="ai-head">
      <div class="ai-head-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c.5 0 1 .4 1.1.9l1.1 4.9c.1.3.3.5.6.6l4.9 1.1c.5.1.9.6.9 1.1s-.4 1-.9 1.1l-4.9 1.1c-.3.1-.5.3-.6.6l-1.1 4.9c-.1.5-.6.9-1.1.9s-1-.4-1.1-.9l-1.1-4.9c-.1-.3-.3-.5-.6-.6l-4.9-1.1c-.5-.1-.9-.6-.9-1.1s.4-1 .9-1.1l4.9-1.1c.3-.1.5-.3.6-.6l1.1-4.9c.1-.5.6-.9 1.1-.9z" fill="#fff"/></svg>

      </div>
      <button class="ai-close" onclick="closeAIDrawer()" aria-label="Close">×</button>
    </div>

    <div class="ai-conv" id="aiConv">
      <div class="ai-msg ai">
        <div class="ai-msg-av ai">AI</div>
        <div class="ai-msg-bubble">${aiRender(greeting)}</div>
      </div>
      ${aiState.history.map(m => `
        <div class="ai-msg ${m.role}">
          <div class="ai-msg-av ${m.role}">${m.role==='ai'?'AI':'TH'}</div>
          <div class="ai-msg-bubble">${m.role==='ai' ? (m.streaming ? '<span class="ai-typing"><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span></span>' : aiRender(m.text)) : escapeHtml(m.text)}</div>
        </div>
      `).join('')}
    </div>

    ${showSuggestions ? `
      <div class="ai-suggested">
        ${suggestions.map(s => `<button class="ai-chip" onclick="aiAsk('${escapeHtml(s.text).replace(/'/g, "\\'")}')"><span>${s.icon}</span>${escapeHtml(s.text)}</button>`).join('')}
      </div>
    ` : ''}

    <div class="ai-input-wrap">
      <form class="ai-input-form" onsubmit="aiSubmitForm(event)">
        <input class="ai-input" type="text" placeholder="Ask about ${escapeHtml(i.name)}…" id="aiInput" ${aiState.typing?'disabled':''}/>
        <button class="ai-send" type="submit" ${aiState.typing?'disabled':''} aria-label="Send">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="ai-footer-hint">AIMS-OS Assistant · Responses are simulated for demo</div>
    </div>
  `;

  const conv = $('aiConv');
  if (conv) conv.scrollTop = conv.scrollHeight;
}

function aiSubmitForm(e) {
  e.preventDefault();
  const inp = $('aiInput');
  const text = inp.value.trim();
  if (text) aiAsk(text);
  return false;
}

function aiAsk(text) {
  if (aiState.typing) return;
  aiState.history.push({ role:'user', text });
  aiState.typing = true;
  aiState.history.push({ role:'ai', text:'', streaming:true });
  paintAIDrawer();

  // Generate response then stream it
  const i = findIntegration(aiState.slug);
  const fullText = aiAnswer(text, i);

  setTimeout(() => {
    aiState.history[aiState.history.length-1].text = fullText;
    aiStreamLast();
  }, 700 + Math.random()*400);
}

function aiStreamLast() {
  const last = aiState.history[aiState.history.length-1];
  if (!last || last.role !== 'ai') return;
  const fullText = last.text;
  const bubbles = document.querySelectorAll('#aiConv .ai-msg.ai .ai-msg-bubble');
  const bubble = bubbles[bubbles.length-1];
  if (!bubble) return;

  let idx = 0;
  bubble.innerHTML = '';
  const interval = setInterval(() => {
    idx += 3 + Math.floor(Math.random()*4); // 3-6 chars per tick for speed
    if (idx >= fullText.length) {
      clearInterval(interval);
      bubble.innerHTML = aiRender(fullText);
      last.streaming = false;
      aiState.typing = false;
      paintAIDrawer();
      return;
    }
    bubble.textContent = fullText.slice(0, idx);
    const conv = $('aiConv');
    if (conv) conv.scrollTop = conv.scrollHeight;
  }, 18);
}

function aiRender(text) {
  // Minimal markdown: **bold**, `code`, line breaks
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  return html;
}

let tourState = { active:false, stepIndex:0 };

function startTour() {
  tourState = { active:true, stepIndex:0 };
  try { localStorage.setItem('aims-tour-seen','1'); } catch(e){}
  $('tourTrigger').classList.add('tour-active');
  $('tourOverlay').classList.add('active');
  paintTourStep();
}

function endTour() {
  tourState.active = false;
  $('tourTrigger').classList.remove('tour-active');
  $('tourTrigger').classList.add('seen');
  $('tourOverlay').classList.remove('active');
  $('tourSpotlight').classList.remove('active');
  $('tourPopover').classList.remove('active');
}

function tourNext() {
  if (tourState.stepIndex >= TOUR_STEPS.length - 1) { endTour(); return; }
  tourState.stepIndex++;
  paintTourStep();
}

function tourPrev() {
  if (tourState.stepIndex <= 0) return;
  tourState.stepIndex--;
  paintTourStep();
}

function paintTourStep() {
  if (!tourState.active) return;
  const step = TOUR_STEPS[tourState.stepIndex];
  const isFirst = tourState.stepIndex === 0;
  const isLast = tourState.stepIndex === TOUR_STEPS.length - 1;

  // Navigate route if needed
  if (step.route && location.hash !== step.route) {
    location.hash = step.route;
  }
  // Set detail tab if needed (after route)
  if (step.detailTab) {
    setTimeout(() => {
      const slug = location.hash.split('/')[2];
      if (slug) setDetailTab(slug, step.detailTab);
    }, 100);
  }

  // Wait for route to render, then position spotlight + popover
  setTimeout(() => {
    const popover = $('tourPopover');
    const spotlight = $('tourSpotlight');

    // Render popover content
    popover.innerHTML = `
      <div class="tour-popover-header">
        <span class="tour-popover-step">Step ${tourState.stepIndex+1} of ${TOUR_STEPS.length}</span>
        <button class="tour-popover-skip" onclick="endTour()">Skip tour</button>
      </div>
      <div class="tour-popover-title">${step.title}</div>
      <div class="tour-popover-body">${step.body}</div>
      <div class="tour-popover-footer">
        <div class="tour-progress">
          ${TOUR_STEPS.map((_, i) => `<div class="tour-progress-dot ${i===tourState.stepIndex?'current':i<tourState.stepIndex?'done':''}"></div>`).join('')}
        </div>
        ${!isFirst ? `<button class="tour-btn tour-btn-prev" onclick="tourPrev()">← Back</button>` : ''}
        <button class="tour-btn tour-btn-next" onclick="${isLast?'endTour()':'tourNext()'}">${isLast?'Finish':'Next →'}</button>
      </div>
    `;

    // Position spotlight on target (if specified)
    if (step.target) {
      const targetEl = document.querySelector(step.target);
      if (targetEl) {
        if (step.scrollToTarget) {
          // Custom scroll: place target just below sticky topbar (60px) + a comfortable gap
          const scrollContainer = document.querySelector('.content');
          const targetRect = targetEl.getBoundingClientRect();
          const TOPBAR_OFFSET = 80;
          if (scrollContainer) {
            const containerTop = scrollContainer.getBoundingClientRect().top;
            const scrollDelta = targetRect.top - containerTop - TOPBAR_OFFSET;
            scrollContainer.scrollBy({ top: scrollDelta, behavior: 'smooth' });
          } else {
            targetEl.scrollIntoView({ behavior:'smooth', block:'start' });
          }
        }
        setTimeout(() => {
          const rect = targetEl.getBoundingClientRect();
          const pad = 6;
          spotlight.style.left = (rect.left - pad) + 'px';
          spotlight.style.top  = (rect.top - pad) + 'px';
          spotlight.style.width  = (rect.width + pad*2) + 'px';
          spotlight.style.height = (rect.height + pad*2) + 'px';
          spotlight.classList.add('active');

          // Position popover — prefer below target, fall back to right/above
          const popoverWidth = 360;
          const popoverHeight = popover.offsetHeight || 280;
          const margin = 16;
          let popLeft, popTop;
          // Try below
          if (rect.bottom + popoverHeight + margin < window.innerHeight) {
            popTop = rect.bottom + 16;
            popLeft = Math.min(Math.max(rect.left, 16), window.innerWidth - popoverWidth - 16);
          } else if (rect.top - popoverHeight - margin > 0) {
            // Above
            popTop = rect.top - popoverHeight - 16;
            popLeft = Math.min(Math.max(rect.left, 16), window.innerWidth - popoverWidth - 16);
          } else {
            // Center on screen
            popTop = (window.innerHeight - popoverHeight) / 2;
            popLeft = (window.innerWidth - popoverWidth) / 2;
          }
          popover.style.left = popLeft + 'px';
          popover.style.top  = popTop + 'px';
          popover.classList.add('active');
        }, step.scrollToTarget ? 350 : 50);
      } else {
        // Target not found — center the popover
        spotlight.classList.remove('active');

      popover.style.top  = ((window.innerHeight - 280) / 2) + 'px';
      popover.classList.add('active');
    }
  }, step.route ? 250 : 50);
}

// Browse vs Operate: where the user is mentally
function setHomeTab(tab) {
  if (tab !== 'integrated' && tab !== 'marketplace') return;
  state.homeTab = tab;
  try { localStorage.setItem('aims_home_tab', tab); } catch(e){}
  renderHome();
  setTimeout(()=>{ const el = document.querySelector('.content'); if (el) el.scrollTop = 0; }, 0);
}

function setMode(mode) {
  if (mode !== 'browse' && mode !== 'operate') return;
  if (state.mode === mode) return;
  state.mode = mode;
  try { localStorage.setItem('aims_mode', mode); } catch(e){}
  paintModeToggle();
  // Reset to home when switching modes so the user sees the new surface
  if (location.hash.startsWith('#/integrations') && location.hash.split('/').length <= 2) {
    route();
  } else {
    // Go home so the mode change is immediately visible
    location.hash = '#/integrations';
  }
}

function paintModeToggle() {
  const grp = document.getElementById('tbModeToggle');
  if (!grp) return;
  grp.querySelectorAll('.tb-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === state.mode);
  });
  // Update the "needs attention" badge on the Operate button
  const badge = document.getElementById('tbOperateBadge');
  if (badge) {
    const count = INTEGRATIONS.filter(i => i.connected && bucketOf(deriveStatus(i)) === 'needs_attention').length;
    badge.textContent = count > 0 ? String(count) : '';
  }
}

// Admin vs User: how much surface do we expose
function togglePersona() {
  state.persona = (state.persona === 'admin') ? 'user' : 'admin';
  try { localStorage.setItem('aims_persona', state.persona); } catch(e){}
  paintPersonaPill();
  // If switching to user while in Operate, snap to Browse (users don't operate)
  if (state.persona === 'user' && state.mode === 'operate') {
    state.mode = 'browse';
    try { localStorage.setItem('aims_mode', 'browse'); } catch(e){}
    paintModeToggle();
  }
  toast(`Switched to ${state.persona === 'admin' ? 'Admin' : 'End-user'} view`);
  route();
}

function paintPersonaPill() {
  const btn = document.getElementById('tbPersonaBtn');
  const label = document.getElementById('tbPersonaLabel');
  if (!btn || !label) return;
  if (state.persona === 'user') {
    btn.classList.add('is-user');
    label.textContent = 'End-user view';
    document.documentElement.classList.add('persona-user');
  } else {
    btn.classList.remove('is-user');
    label.textContent = 'Admin view';
    document.documentElement.classList.remove('persona-user');
  }
  // In end-user view, the Operate mode is hidden (users don't see orchestration)
  const operateBtn = document.querySelector('.tb-mode-btn[data-mode="operate"]');
  if (operateBtn) operateBtn.style.display = (state.persona === 'user') ? 'none' : '';
}

// Paint mode + persona controls on initial load
function paintShellControls() {
  paintModeToggle();
  paintPersonaPill();
}

let rolePickerState = { open:false, slug:null, studio:null, search:'', selected:new Set() };

function openRolePicker(slug, studio, ev) {
  ev?.stopPropagation();
  const btn = ev?.currentTarget;
  rolePickerState = { open:true, slug, studio, search:'', selected:new Set() };

  const rect = btn ? btn.getBoundingClientRect() : { left: 100, top: 200, bottom: 220 };
  const popover = $('rolePicker');

  paintRolePicker();

  // Position: below the button, aligned to left edge
  let left = rect.left;
  let top = rect.bottom + 8;
  // If popover goes off right edge, shift left
  if (left + 340 > window.innerWidth - 12) left = window.innerWidth - 340 - 12;
  // If popover goes off bottom, position above the button
  if (top + 380 > window.innerHeight - 12) top = rect.top - 380 - 8;
  popover.style.left = Math.max(12, left) + 'px';
  popover.style.top  = Math.max(12, top) + 'px';

  $('rpOverlay').classList.add('open');
  popover.classList.add('open');
  setTimeout(() => { document.querySelector('.rp-search input')?.focus(); }, 100);
}

function closeRolePicker() {
  rolePickerState.open = false;
  $('rpOverlay').classList.remove('open');
  $('rolePicker').classList.remove('open');
}

function paintRolePicker() {
  const s = rolePickerState; if (!s.open) return;
  const i = findIntegration(s.slug); if (!i) return;
  const studioMeta = STUDIO_META[s.studio];
  const rolesKey = 'roles' + (s.studio==='governance'?'Gov':s.studio==='agentic'?'Ag':'Wf');
  const existingRoles = i[rolesKey] || [];

  const q = (s.search||'').toLowerCase();
  const filterFn = (item) => !q || item.label.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q);

  const studioRoles = (STUDIO_ROLES[s.studio]||[]).filter(filterFn);
  const groups = WORKSPACE_GROUPS.filter(filterFn);
  const allMembersCount = (studioRoles.reduce((a,b)=>a+(b.members||0),0)) || 47;
  const showAllMembers = !q || 'all members'.includes(q);

  // Count total members in current selection (to compute warning)
  const selectedExpansion = [...s.selected].reduce((sum, sel) => {
    const r = (STUDIO_ROLES[s.studio]||[]).find(x=>x.label===sel) || WORKSPACE_GROUPS.find(x=>x.label===sel);
    return sum + (r?.members||0);
  }, 0);
  const showWarning = selectedExpansion > 15;

  const renderItem = (item, kind) => {
    const added = existingRoles.includes(item.label);
    const selected = s.selected.has(item.label);
    return `
      <div class="rp-item ${added?'added':''} ${selected?'selected':''}" ${added?'':`onclick="toggleRolePickerItem('${item.label.replace(/'/g,"\\'")}')"`}>
        <div class="rp-checkbox">${added?'✓':selected?'✓':''}</div>
        <div class="rp-item-text">
          <div class="rp-item-label">${escapeHtml(item.label)}${kind==='group'?'<span style="font-size:10px;color:var(--t3);font-weight:500">· Group</span>':''}</div>
          ${item.desc ? `<div class="rp-item-meta">${escapeHtml(item.desc)}</div>` : ''}
        </div>
        <span class="rp-item-count">${item.members} ${item.members===1?'person':'people'}</span>
      </div>
    `;
  };

  $('rolePicker').innerHTML = `
    <div class="rp-header">
      <div style="flex:1;min-width:0">
        <div class="rp-header-title">Add role or group to ${escapeHtml(studioMeta.label)}</div>
        <div class="rp-header-sub">Only roles defined in this studio · Groups span the workspace</div>
      </div>
      <button class="rp-close" onclick="closeRolePicker()" aria-label="Close">×</button>
    </div>

    <div class="rp-search">
      <svg class="rp-search-ico" width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Search roles, groups, teams…" value="${escapeHtml(s.search)}" oninput="rolePickerState.search=this.value;paintRolePicker();setTimeout(()=>document.querySelector('.rp-search input')?.focus(),0)"/>
    </div>

    <div class="rp-body">
      ${showAllMembers ? `
        <div class="rp-section">
          <div class="rp-section-label">All members <span class="rp-section-count">Permissive</span></div>
          ${(()=>{
            const allLabel = `All ${studioMeta.label} members`;
            const added = existingRoles.includes(allLabel);
            const selected = s.selected.has(allLabel);
            return `
              <div class="rp-item rp-all-members ${added?'added':''} ${selected?'selected':''}" ${added?'':`onclick="toggleRolePickerItem('${allLabel.replace(/'/g,"\\'")}')"`}>
                <div class="rp-checkbox">${added?'✓':selected?'✓':''}</div>
                <div class="rp-item-text">
                  <div class="rp-item-label">All ${escapeHtml(studioMeta.label)} members <span class="rp-warn-chip">Broad</span></div>
                  <div class="rp-item-meta">Anyone with access to this studio (no role restriction)</div>
                </div>
                <span class="rp-item-count">${allMembersCount} people</span>
              </div>
            `;
          })()}
        </div>
      ` : ''}

      ${studioRoles.length > 0 ? `
        <div class="rp-section">
          <div class="rp-section-label">${escapeHtml(studioMeta.label)} roles <span class="rp-section-count">${studioRoles.length}</span></div>
          ${studioRoles.map(r => renderItem(r, 'role')).join('')}
        </div>
      ` : ''}

      ${groups.length > 0 ? `
        <div class="rp-section">
          <div class="rp-section-label">Workspace groups <span class="rp-section-count">${groups.length}</span></div>
          ${groups.map(g => renderItem(g, 'group')).join('')}
        </div>
      ` : ''}

      ${studioRoles.length===0 && groups.length===0 && !showAllMembers ? `
        <div class="rp-empty">
          No matches for "${escapeHtml(q)}"<br>
          <a class="rp-create-link" href="#" onclick="closeRolePicker();toast('Settings → Roles & Permissions','success');return false">Create a new role →</a>
        </div>
      ` : ''}
    </div>

    <div class="rp-footer">
      <a class="rp-create-link" href="#" onclick="closeRolePicker();toast('Opens Settings → Roles & Permissions','success');return false">+ Create new role</a>
      ${showWarning ? `<span class="rp-warn-chip" style="margin-left:auto;margin-right:8px" title="Significant expansion">⚠ ${selectedExpansion}+ people</span>` : ''}
      <button class="rp-commit" ${s.selected.size===0?'disabled':''} onclick="commitRolePicker()">Add ${s.selected.size>0?s.selected.size:''}</button>
    </div>
  `;
}

function toggleRolePickerItem(label) {
  if (rolePickerState.selected.has(label)) rolePickerState.selected.delete(label);
  else rolePickerState.selected.add(label);
  paintRolePicker();
}

function commitRolePicker() {
  const s = rolePickerState; if (!s.open || s.selected.size===0) return;
  const i = findIntegration(s.slug); if (!i) return;
  const rolesKey = 'roles' + (s.studio==='governance'?'Gov':s.studio==='agentic'?'Ag':'Wf');
  if (!i[rolesKey]) i[rolesKey] = [];
  s.selected.forEach(label => {
    if (!i[rolesKey].includes(label)) i[rolesKey].push(label);
  });
  const count = s.selected.size;
  closeRolePicker();
  toast(`Added ${count} ${count===1?'role':'roles'} to ${STUDIO_META[s.studio].label}`, 'success');
  paintDetail(i);
}

              <span style="font-size:9.5px;font-weight:700;padding:1.5px 6px;border-radius:8px;background:${f.confidence==='high'?'rgba(5,223,114,0.10)':'rgba(253,199,0,0.10)'};color:${f.confidence==='high'?'var(--green)':'var(--amber)'};border:1px solid ${f.confidence==='high'?'rgba(5,223,114,0.22)':'rgba(253,199,0,0.22)'};text-transform:uppercase;letter-spacing:.04em">${f.confidence}</span>
            </div>
          </div>
        `).join('')}
        <div style="padding:10px 12px;border-top:1px solid var(--line)">
          <button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="toast('Add custom field mapping')">+ Add custom field mapping</button>
        </div>
      </div>

      <div style="margin-top:14px;font-size:11px;color:var(--t3);line-height:1.55">
        Once activated, AIMS will start ingesting <strong style="color:var(--t1)">${mapping.fields.length} fields</strong> from ${escapeHtml(i.name)} into Helix. You can revise this mapping at any time without disrupting the pipeline.
      </div>
    </div>
    <div class="drawer-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeHelix()">Cancel</button>
      <a class="btn btn-ghost btn-sm" href="data-studio.html#/connections/${slug}" style="text-decoration:none">Open full mapping in Data Studio →</a>
      <button class="btn btn-primary btn-sm" onclick="closeHelix();toast('Mapping activated · Data is now flowing into Helix','success');setTimeout(()=>{const i=findIntegration('${slug}');if(i){const inst=instancesOf('${slug}').find(x=>x.id==='${instId}');if(inst){inst.status='fully_configured';delete inst.note;route();}}},800)">Activate mapping</button>
    </div>
  `;
  $('helixOverlay').classList.add('open');
  $('helixDrawer').classList.add('open');
}

function closeHelix() {
  $('helixOverlay').classList.remove('open');
  $('helixDrawer').classList.remove('open');
}

/* ====================== MOBILE SSB TOGGLE ====================== */

function toggleSsb(){
  const ssb = document.querySelector('.ssb');
  const bd = $('ssbBackdrop');
  if(!ssb) return;
  const willOpen = !ssb.classList.contains('open');
  ssb.classList.toggle('open', willOpen);
  bd.classList.toggle('open', willOpen);
}
function closeSsb(){
  document.querySelector('.ssb')?.classList.remove('open');
  $('ssbBackdrop')?.classList.remove('open');
}

// Auto-close ssb on navigation in mobile
window.addEventListener('hashchange', () => {
  if (window.innerWidth <= 1024) closeSsb();
});

/* ====================== BOOT ====================== */

// Sticky toolbar shadow on scroll
function wireToolbarScroll(){
  const content = $('content');
  if(!content) return;
  content.addEventListener('scroll', () => {
    const tb = $('catalogToolbar');
    if (!tb) return;
    const rect = tb.getBoundingClientRect();
    const parent = tb.parentElement.getBoundingClientRect();
    tb.classList.toggle('scrolled', rect.top <= parent.top + 2);
  }, { passive: true });
}
const _origRoute = route;
route = function(){ _origRoute(); setTimeout(wireToolbarScroll, 50); };

window.addEventListener('hashchange', route);
document.querySelectorAll('.ssb-item:not(.disabled)').forEach(b => {
  b.addEventListener('click', () => {
    const r = b.dataset.route;
    if (r==='integrations') navigate('#/integrations');
    else if (r==='audit') navigate('#/audit');
    else if (r==='personal') navigate('#/personal');
    else if (r==='requests') navigate('#/requests');
  });
});
document.querySelectorAll('.ssb-item.disabled').forEach(b => {
  b.addEventListener('click', () => {
    const label = b.querySelector('.ssb-item-label, .ssb-label');
    toast(`${label ? label.textContent : 'This feature'} — Coming soon`, 'success');
  });
});

// Paint shell controls (mode toggle + persona pill) on initial load
paintShellControls();

// Paint requests pending indicator
(function paintRequestsAlert(){
  const dot = document.getElementById('reqAlertDot');
  if (!dot) return;
  const pending = REQUESTS.filter(r => r.status==='pending_review').length;
  dot.style.display = pending > 0 ? '' : 'none';
})();

route();
</script>

</body>
</html>
