<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AIMS-OS — Settings · Integrations</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0d1a; --bg2:#0f172e; --bg3:#0d1323;
  --t1:rgba(255,255,255,0.92); --t2:rgba(255,255,255,0.60); --t3:rgba(255,255,255,0.38);
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.14);
  --hover:rgba(255,255,255,0.04);
  --hover-strong:rgba(255,255,255,0.08);
  --shell-page-bg:#070e1c;
  --shell-topbar-bg:rgba(10,13,26,0.72);
  --shell-sidebar-bg:#0d1323;
  --accent:#2B7FFF; --accent-2:#155DFC;
  --cyan:#06B6D4; --green:#05DF72; --amber:#FDC700; --red:#EF4444; --purple:#A78BFA; --pink:#EC4899;
  --grad:linear-gradient(135deg,#2B7FFF 0%,#155DFC 100%);
  --grad-cyan:linear-gradient(135deg,#06B6D4 0%,#0E7490 100%);
  --grad-identity:linear-gradient(135deg,#00C2C2 0%,#155DFC 100%);     /* workspace identity (Contoso, avatar) */
  --grad-app:linear-gradient(135deg,#06B6D4 0%,#155DFC 100%);          /* current app context (Settings/Integrations) */
  --r4:4px; --r6:6px; --r8:8px; --r10:10px; --r12:12px; --r14:14px;
  /* Spacing scale (4px base) — for new code; existing values may be unchanged */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:48px;
}
html,body{height:100%}
body{
  background:var(--shell-page-bg); color:var(--t1);
  font-family:'Inter','SF Pro Text',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  margin:0; min-height:100vh;
}

/* ── TOPBAR (fixed full width, blur backdrop) ── */
.topbar{
  position:fixed; top:0; left:0; right:0; height:52px; z-index:20;
  display:flex; align-items:center; gap:10px; padding:0 20px 0 15px;
  background:var(--shell-topbar-bg);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
}
.tb-left{flex:1; display:flex; align-items:center; gap:6px}
.tb-right{flex:1; display:flex; align-items:center; gap:4px; justify-content:flex-end}

.tb-context-wrap{position:relative; flex-shrink:0; display:inline-flex; align-items:center}
.tb-context{
  display:flex; align-items:center; gap:8px; height:34px; padding:0 9px 0 6px;
  border-radius:8px; background:transparent; border:none; cursor:pointer;
  color:var(--t1); font-family:inherit; transition:background .15s;
}
.tb-context:hover{background:var(--hover)}
.tb-context-logo{
  width:26px; height:26px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:900; color:#fff; flex-shrink:0;
  letter-spacing:-.3px; overflow:hidden;
}
.tb-context-name{
  font-size:13px; font-weight:700; color:var(--t1);
  white-space:nowrap; max-width:380px; overflow:hidden; text-overflow:ellipsis;
}
.tb-context-chev{color:var(--t2); flex-shrink:0; transition:transform .15s}

/* ── Mode toggle (Browse / Operate) — orchestration thesis ── */
.tb-mode-toggle{
  display:inline-flex; align-items:center; gap:2px; margin-left:8px;
  padding:3px; height:34px;
  background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:9px;
  flex-shrink:0;
}
.tb-mode-btn{
  display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px;
  background:transparent; border:none; cursor:pointer;
  color:var(--t2); font-family:inherit; font-size:12px; font-weight:600;
  border-radius:6px; transition:background .15s, color .15s;
  letter-spacing:.01em;
}
.tb-mode-btn:hover{color:var(--t1); background:var(--hover)}
.tb-mode-btn.active{
  background:var(--cyan); color:#001318;
  box-shadow:0 1px 0 rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08) inset;
}
.tb-mode-btn.active svg{color:#001318}
.tb-mode-btn svg{color:currentColor}
.tb-mode-badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 5px;
  background:var(--amber); color:#1a0f00;
  font-size:10px; font-weight:800; border-radius:8px; line-height:1;
}
.tb-mode-badge:empty{display:none}
@media (max-width:780px){
  .tb-mode-btn span:not(.tb-mode-badge){display:none}
  .tb-mode-btn{padding:0 8px}
}

/* ── Persona pill (Admin / User view) ── */
.tb-persona{
  display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px;
  background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:18px;
  color:var(--t2); font-family:inherit; font-size:12px; font-weight:600;
  cursor:pointer; transition:background .15s, color .15s, border-color .15s;
  flex-shrink:0;
}
.tb-persona:hover{background:var(--hover); color:var(--t1); border-color:var(--line-strong)}
.tb-persona-ic{color:currentColor; transition:transform .15s}
.tb-persona.is-user{background:rgba(6,182,212,0.08); color:var(--cyan); border-color:rgba(6,182,212,0.3)}
@media (max-width:900px){.tb-persona-label{display:none} .tb-persona{padding:0 8px}}

/* Hide admin-only surfaces when persona=user */
html.persona-user [data-admin-only]{display:none !important}

.tb-search-btn{
  width:340px; flex-shrink:0; height:32px;
  background:var(--hover); border:1px solid var(--line);
  border-radius:var(--r8); padding:0 6px 0 10px;
  color:var(--t3); font-family:inherit; font-size:13px;
  cursor:pointer; display:flex; align-items:center; gap:8px;
  transition:border-color .15s, background .15s; text-align:left;
}
.tb-search-btn:hover{background:var(--hover-strong); border-color:var(--line-strong)}
.tb-search-ic{color:var(--t2); flex-shrink:0}
.tb-search-placeholder{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-search-kbd{
  font-family:inherit; font-size:10px; font-weight:600;
  padding:2px 5px; border-radius:4px;
  background:rgba(255,255,255,0.06); color:var(--t3);
  border:1px solid var(--line); line-height:1; flex-shrink:0;
}
@media (max-width:720px){.tb-search-btn{width:32px;padding:0;justify-content:center}.tb-search-placeholder,.tb-search-kbd{display:none}}

.icon-btn{
  width:32px; height:32px; border-radius:var(--r8);
  background:transparent; border:none; color:var(--t2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .1s, color .1s; position:relative;
}
.icon-btn:hover{background:var(--hover); color:var(--t1)}
.notif-bell-wrap{position:relative; display:inline-flex}
.notif-bell-dot{
  position:absolute; top:-3px; right:-3px;
  min-width:16px; height:16px; border-radius:8px;
  background:#DC2626; border:2px solid var(--shell-topbar-bg);
  color:#fff; font-size:9px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  padding:0 4px; line-height:1; pointer-events:none;
}
.tb-divider-v{
  display:inline-block; width:1px; height:22px;
  background:var(--line); margin:0 4px; flex-shrink:0; align-self:center;
}

.tb-identity{
  display:inline-flex; align-items:center; gap:2px;
  background:var(--hover); border:1px solid var(--line);
  border-radius:9999px; padding:3px; flex-shrink:0;
  transition:border-color .12s;
}
.tb-identity:hover{border-color:var(--line-strong)}
.tb-ws-badge{
  display:inline-flex; align-items:center; gap:7px;
  padding:0 8px 0 0; background:transparent; border:none; cursor:pointer;
  color:rgba(255,255,255,0.85); font-family:inherit; font-size:12px; font-weight:600;
  line-height:1; flex-shrink:0; transition:background .12s, color .12s;
  max-width:180px; height:28px; border-radius:9999px;
}
.tb-ws-badge:hover{background:var(--hover-strong); color:var(--t1)}
.tb-ws-badge-logo{
  width:22px; height:22px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:900; color:#fff; flex-shrink:0;
  letter-spacing:-.3px;
  background:var(--grad-identity);
}
.tb-ws-badge-name{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;
}
.avatar-sm{
  width:28px; height:28px; border-radius:50%;
  background:var(--grad-identity);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:#fff;
  cursor:pointer; flex-shrink:0; border:none; font-family:inherit;
}

/* ── APP layout (below fixed topbar) ── */
.app{
  display:flex; width:100%; height:100vh;
  padding:60px 8px 8px 0; gap:8px;
  overflow:hidden; box-sizing:border-box;
}

/* ── SIDEBAR (52px rail, collapsible to 220px) ── */
.sidebar{
  width:52px; flex-shrink:0; margin-left:8px;
  background:var(--shell-sidebar-bg);
  display:flex; flex-direction:column;
  border-radius:14px;
  border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 2px 4px rgba(0,0,0,0.4),0 8px 24px rgba(0,0,0,0.45),0 24px 48px rgba(0,0,0,0.3);
  position:relative; z-index:10; overflow:hidden;
  transition:width .22s cubic-bezier(.4,0,.2,1);
}
.sidebar.sb-expanded{width:220px}
.sb-nav{flex:1; display:flex; flex-direction:column; padding:6px 8px; gap:1px; overflow:hidden}
.sb-item{
  display:flex; align-items:center; height:42px; border:none; border-radius:var(--r8);
  background:transparent; color:rgba(255,255,255,0.50);
  font-size:13px; font-weight:600;
  cursor:pointer; width:100%; text-align:left; text-decoration:none;
  transition:background .15s, color .15s;
  white-space:nowrap; overflow:hidden; flex-shrink:0; padding:0 10px; gap:0;
  font-family:inherit;
}
.sidebar:not(.sb-expanded) .sb-item{justify-content:center; padding:0}
.sidebar.sb-expanded .sb-item{justify-content:flex-start; padding:0 8px; gap:10px}
.sb-item-icon{
  width:32px; height:32px; border-radius:8px;
  background:rgba(255,255,255,0.04);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:background .15s;
}
.sb-item-icon svg{width:17px; height:17px}
.sb-item:hover{background:transparent; color:rgba(255,255,255,0.80)}
.sb-item:hover .sb-item-icon{background:rgba(255,255,255,0.09)}
.sidebar:not(.sb-expanded) .sb-item.active{background:transparent}
.sidebar:not(.sb-expanded) .sb-item.active .sb-item-icon{
  background:var(--grad); color:#fff;
  box-shadow:0 2px 10px rgba(21,93,252,0.4);
}
.sidebar.sb-expanded .sb-item.active{background:rgba(43,127,255,0.10); color:var(--t1)}
.sidebar.sb-expanded .sb-item.active .sb-item-icon{background:var(--grad); color:#fff}
.sb-label{opacity:0; transition:opacity .12s; pointer-events:none; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sidebar.sb-expanded .sb-label{opacity:1; pointer-events:auto}
.sb-divider{height:1px; background:var(--line); margin:4px 0; flex-shrink:0}
.sb-bottom{flex-shrink:0; border-top:1px solid var(--line); padding:4px 8px 8px}
.sb-toggle{
  display:flex; align-items:center; height:40px; border:none; border-radius:10px;
  background:transparent; color:rgba(128,175,255,0.55);
  font-size:12px; font-weight:600;
  cursor:pointer; width:100%; white-space:nowrap; overflow:hidden;
  transition:background .12s, color .12s; font-family:inherit;
}
.sidebar:not(.sb-expanded) .sb-toggle{justify-content:center; gap:0; padding:0}
.sidebar.sb-expanded .sb-toggle{justify-content:flex-start; padding:0 8px; gap:10px}
.sb-toggle:hover{background:var(--hover); color:#80AFFF}
.sb-toggle-icon{width:18px; height:18px; flex-shrink:0; transition:transform .22s}
.sidebar.sb-expanded .sb-toggle-icon{transform:rotate(180deg)}
.sb-toggle-label{opacity:0; transition:opacity .12s}
.sidebar.sb-expanded .sb-toggle-label{opacity:1}

.main{
  flex:1; display:flex; min-width:0;
  background:var(--bg);
  border:1px solid var(--line); border-radius:var(--r14);
  overflow:hidden;
}

/* ── Sub-sidebar (Settings) — PREMIUM SaaS ── */
.ssb{
  width:264px; flex-shrink:0;
  background:linear-gradient(180deg, var(--shell-sidebar-bg) 0%, rgba(13,19,35,0.97) 100%);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  overflow:hidden; position:relative;
}
.ssb::before{
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(43,127,255,0.30) 50%, transparent 100%);
  pointer-events:none;
}

/* Header */
.ssb-header{padding:16px 16px 4px}
.ssb-header-title{
  font-size:15px; font-weight:700; color:var(--t1);
  letter-spacing:-.01em; line-height:1.2;
}

/* Search */
.ssb-search-wrap{position:relative; padding:10px 12px 10px}
.ssb-search-ico{
  position:absolute; left:24px; top:50%; transform:translateY(-50%);
  color:var(--t3); pointer-events:none;
}
.ssb-search{
  width:100%; background:rgba(255,255,255,0.04);
  border:1px solid var(--line); border-radius:8px;
  padding:7px 38px 7px 32px;
  color:var(--t1); font-size:12.5px; font-family:inherit; outline:none;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
.ssb-search::placeholder{color:var(--t3)}
.ssb-search:focus{
  border-color:rgba(43,127,255,0.40);
  background:rgba(43,127,255,0.06);
  box-shadow:0 0 0 3px rgba(43,127,255,0.10);
}
.ssb-search-kbd{
  position:absolute; right:20px; top:50%; transform:translateY(-50%);
  font-family:inherit; font-size:9.5px; font-weight:600;
  padding:1.5px 5px; border-radius:4px;
  background:rgba(255,255,255,0.06); color:var(--t3);
  border:1px solid var(--line); line-height:1; pointer-events:none;
}

/* Scrollable nav */
.ssb-scroll{flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 8px 12px}
.ssb-scroll::-webkit-scrollbar{width:5px}
.ssb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08); border-radius:3px}
.ssb-scroll::-webkit-scrollbar-track{background:transparent}

/* Group */
.ssb-group{padding:8px 0 2px}
.ssb-group + .ssb-group{margin-top:6px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.04)}
.ssb-grp-h{
  display:flex; align-items:center; gap:7px;
  padding:0 14px 8px;
}
.ssb-grp-h::before{
  content:''; width:3px; height:3px; border-radius:50%;
  background:var(--t3); opacity:.6;
}
.ssb-grp-label{
  font-size:10px; font-weight:700; color:var(--t3);
  text-transform:uppercase; letter-spacing:.10em;
}

/* Items — premium with icons */
.ssb-item{
  position:relative;
  display:flex; align-items:center; gap:10px;
  padding:7px 12px; border-radius:7px;
  color:rgba(255,255,255,0.62); font-size:13px; font-weight:500;
  cursor:pointer; margin:1px 4px; border:none; background:transparent;
  width:calc(100% - 8px); text-align:left; font-family:inherit;
  transition:background .14s, color .14s;
}
.ssb-item:hover:not(.disabled){background:rgba(255,255,255,0.04); color:var(--t1)}
.ssb-item:hover:not(.disabled) .ssb-item-ico{background:rgba(255,255,255,0.08); color:var(--t1)}
.ssb-item.active{background:rgba(43,127,255,0.10); color:var(--t1)}
.ssb-item.active::before{
  content:''; position:absolute; left:-4px; top:8px; bottom:8px;
  width:3px; border-radius:0 3px 3px 0;
  background:var(--grad);
  box-shadow:0 0 12px rgba(43,127,255,0.55);
}
.ssb-item.active .ssb-item-ico{background:rgba(43,127,255,0.15); color:var(--accent)}
.ssb-item.disabled{opacity:.40; cursor:not-allowed}

.ssb-item-ico{
  width:22px; height:22px; border-radius:5px;
  background:rgba(255,255,255,0.04);
  display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.55); flex-shrink:0;
  transition:background .14s, color .14s;
}
.ssb-item-ico svg{width:13px; height:13px}
.ssb-item-label{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ssb-item-lock{
  width:11px; height:11px; color:var(--t3); flex-shrink:0; opacity:.7;
}
.ssb-item-alert{
  width:7px; height:7px; border-radius:50%;
  background:var(--amber); flex-shrink:0;
  box-shadow:0 0 0 3px rgba(253,199,0,0.15);
}
.ssb-item-new{
  font-size:8.5px; font-weight:700; padding:1.5px 6px; border-radius:8px;
  background:rgba(5,223,114,0.10); color:var(--green);
  border:1px solid rgba(5,223,114,0.22); flex-shrink:0;
  letter-spacing:.05em; line-height:1; text-transform:uppercase;
}
.ssb-item-badge{
  font-size:8.5px; font-weight:700; padding:2px 6px; border-radius:8px;
  flex-shrink:0; letter-spacing:.05em; line-height:1; text-transform:uppercase;
}
.ssb-badge-soon{
  background:rgba(167,139,250,0.10); color:var(--purple);
  border:1px solid rgba(167,139,250,0.22);
}
.ssb-item-kbd{
  font-family:inherit; font-size:9.5px; font-weight:600;
  padding:1.5px 5px; border-radius:4px;
  background:rgba(255,255,255,0.04); color:var(--t3);
  border:1px solid var(--line); line-height:1; flex-shrink:0;
  opacity:0; transition:opacity .12s;
}
.ssb-item:hover:not(.disabled) .ssb-item-kbd{opacity:1}


/* ── Content ── */
.content{flex:1; overflow:auto; background:var(--bg)}

/* ── Page header ── */
.breadcrumb{
  padding:14px 32px 0; font-size:12px; color:var(--t2);
  display:flex; align-items:center; gap:6px;
}
.breadcrumb a{color:var(--t2); text-decoration:none; opacity:.7}
.breadcrumb a:hover{opacity:1; color:var(--t1)}
.crumb-current{color:var(--t1); font-weight:500}
.crumb-sep{color:var(--t3)}

.ph{padding:18px 32px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:10}
.ph-top{display:flex; align-items:flex-start; gap:16px; margin-bottom:8px}
.ph-text{flex:1; min-width:0}
.ph-h1{font-size:22px; font-weight:700; color:var(--t1); letter-spacing:-.01em; margin-bottom:4px}
.ph-sub{font-size:13px; color:var(--t2)}
.ph-actions{display:flex; gap:8px; align-items:center; flex-shrink:0}
.ph-kpis{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap}
.kpi{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--t2)}
.kpi-num{color:var(--t1); font-weight:600}
.kpi-dot{width:6px; height:6px; border-radius:50%}
.kpi-dot.ok{background:var(--green)}
.kpi-dot.warn{background:var(--amber)}
.kpi-dot.muted{background:var(--t3)}

/* ── Buttons ── */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:var(--r8);
  font-size:13px; font-weight:600; cursor:pointer;
  border:1px solid transparent; font-family:inherit;
  transition:background .12s, transform .1s, box-shadow .15s;
  text-decoration:none; white-space:nowrap;
}
.btn-primary{background:var(--grad); color:#fff; box-shadow:0 2px 10px rgba(21,93,252,0.3)}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(21,93,252,0.4)}
/* Outline variant of primary: same emphasis level but visually paired with a sibling primary */
.btn-primary.btn-outline{background:transparent; color:var(--cyan); border-color:rgba(6,182,212,0.45); box-shadow:none}
.btn-primary.btn-outline:hover{background:rgba(6,182,212,0.08); border-color:rgba(6,182,212,0.65); transform:translateY(-1px); box-shadow:0 2px 8px rgba(6,182,212,0.15)}
html.theme-light .btn-primary.btn-outline{color:var(--cyan); border-color:rgba(6,182,212,0.50)}
.btn-ghost{background:var(--hover); color:var(--t1); border-color:var(--line)}
.btn-ghost:hover{background:var(--hover-strong)}
.btn-danger{background:rgba(239,68,68,0.10); color:var(--red); border-color:rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.18)}
.btn-link{background:transparent; color:var(--t2); padding:6px 8px}
.btn-link:hover{color:var(--t1); background:var(--hover)}
.btn-sm{padding:5px 10px; font-size:12px}
.btn-lg{padding:10px 18px; font-size:14px}

/* ── Inputs ── */
.input{
  width:100%; background:rgba(255,255,255,0.04);
  border:1px solid var(--line); border-radius:var(--r6);
  padding:8px 12px; color:var(--t1); font-size:13px; font-family:inherit;
  outline:none; transition:border-color .12s, background .12s;
}
.input:focus{border-color:rgba(43,127,255,0.5); background:rgba(43,127,255,0.05)}
.input::placeholder{color:var(--t3)}

/* ── Sections ── */
.section{padding:24px 32px}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px}
.section-title{font-size:10px; font-weight:700; color:var(--t3); text-transform:uppercase; letter-spacing:.08em}

/* Segmented control */
.seg{display:inline-flex; background:var(--hover); border:1px solid var(--line); border-radius:var(--r6); padding:2px; gap:2px}
.seg-btn{
  padding:4px 10px; font-size:12px; font-weight:500; color:var(--t2);
  background:transparent; border:none; border-radius:var(--r4); cursor:pointer;
  font-family:inherit; transition:background .12s, color .12s;
}
.seg-btn:hover{color:var(--t1)}
.seg-btn.active{background:rgba(255,255,255,0.08); color:var(--t1)}

/* ── Connected cards grid ── */
.connected-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px}
.conn-card{
  background:var(--bg3); border:1px solid var(--line); border-radius:var(--r10);
  padding:14px; display:flex; flex-direction:column; gap:10px;
  cursor:pointer; transition:border-color .15s, transform .15s, background .15s;
}
.conn-card:hover{border-color:var(--line-strong); background:var(--bg2)}
.conn-row{display:flex; align-items:center; gap:10px}
.logo{
  width:32px; height:32px; border-radius:var(--r8); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff;
  overflow:hidden;
}
/* Brand logo container (full-color SVG on neutral background) */
.logo.logo-brand{
  background:#fff !important;
  border:1px solid var(--line);
}
.logo img{
  width:68%; height:68%; object-fit:contain; display:block;
  pointer-events:none;
}
.logo-sm{width:24px; height:24px; font-size:10px; border-radius:6px}
.logo-lg{width:48px; height:48px; font-size:18px; border-radius:var(--r10)}
.conn-name{font-size:14px; font-weight:600; color:var(--t1); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.health-badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px}
.health-ok{background:rgba(5,223,114,0.10); color:var(--green); border:1px solid rgba(5,223,114,0.2)}
.health-warn{background:rgba(253,199,0,0.10); color:var(--amber); border:1px solid rgba(253,199,0,0.2)}
.health-bad{background:rgba(239,68,68,0.10); color:var(--red); border:1px solid rgba(239,68,68,0.2)}
.health-dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.cap-chips{display:flex; gap:4px; flex-wrap:wrap}
.cap-chip{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-weight:600; padding:2.5px 7px; border-radius:5px;
  background:rgba(255,255,255,0.04); color:var(--t2); border:1px solid var(--line);
}
.cap-chip svg{flex-shrink:0}
.cap-chip.cap-tool{color:var(--purple); background:rgba(167,139,250,0.10); border-color:rgba(167,139,250,0.22)}
.cap-chip.cap-data{color:var(--green); background:rgba(5,223,114,0.10); border-color:rgba(5,223,114,0.22)}
.cap-chip.cap-mcp{color:var(--cyan); background:rgba(6,182,212,0.10); border-color:rgba(6,182,212,0.25)}

.conn-meta{display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--t2)}
.conn-meta strong{color:var(--t1); font-weight:600}
.conn-foot{display:flex; align-items:center; gap:8px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; color:var(--t2)}
.conn-foot .av{width:18px; height:18px; border-radius:50%; background:var(--grad); color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.conn-by{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.icon-btn{background:transparent; border:none; color:var(--t2); cursor:pointer; padding:4px; border-radius:var(--r4); display:flex}
.icon-btn:hover{background:var(--hover); color:var(--t1)}

/* ── Source tabs + filter pills ── */
.src-tabs{display:flex; gap:2px; padding:4px; background:var(--hover); border:1px solid var(--line); border-radius:var(--r8); margin-bottom:12px; flex-wrap:wrap}
.src-tab{
  padding:5px 12px; font-size:12px; font-weight:600; color:var(--t2);
  background:transparent; border:none; border-radius:var(--r6); cursor:pointer;
  font-family:inherit; transition:background .12s, color .12s;
}
.src-tab:hover{color:var(--t1)}
.src-tab.active{background:var(--bg3); color:var(--t1); box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.src-tab .src-count{margin-left:6px; font-size:10px; color:var(--t3); font-weight:500}
.src-tab.active .src-count{color:var(--t2)}
.src-tab.build-own{margin-left:auto; color:var(--cyan); display:inline-flex; align-items:center; gap:5px}

.pill-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.pill{
  font-size:11px; font-weight:500; padding:4px 10px; border-radius:20px;
  background:var(--hover); color:var(--t2); border:1px solid var(--line);
  cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  font-family:inherit; transition:background .12s, color .12s, border-color .12s;
}
.pill:hover{background:var(--hover-strong); color:var(--t1)}
.pill.active{background:rgba(43,127,255,0.15); color:var(--accent); border-color:rgba(43,127,255,0.35)}
.pill-clear{color:var(--red); border-color:transparent; background:transparent}
.pill-clear:hover{background:rgba(239,68,68,0.1)}

.search-wrap{position:relative; display:inline-block}
.search-input{
  width:280px; background:var(--hover); border:1px solid var(--line);
  border-radius:var(--r6); padding:6px 10px 6px 30px; color:var(--t1);
  font-size:12px; font-family:inherit; outline:none;
}
.search-input:focus{border-color:rgba(43,127,255,0.4); background:rgba(43,127,255,0.04)}
.search-input::placeholder{color:var(--t3)}
.search-icon{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--t3); pointer-events:none}

/* ── Catalog grid ── */
.catalog-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px}
.cat-card{
  background:var(--bg3); border:1px solid var(--line); border-radius:var(--r10);
  padding:14px; display:flex; flex-direction:column; gap:8px;
  cursor:pointer; transition:border-color .15s, background .15s;
  min-height:140px;
}
.cat-card:hover{border-color:var(--line-strong); background:var(--bg2)}
.cat-row{display:flex; align-items:flex-start; gap:10px}
.cat-name{font-size:13px; font-weight:600; color:var(--t1); flex:1; line-height:1.3}
.cat-cat{font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-top:2px}
.cat-desc{font-size:11px; color:var(--t2); line-height:1.5; flex:1}
.cat-foot{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:auto}
.src-badge{
  font-size:9px; font-weight:700; padding:2px 7px; border-radius:4px;
  text-transform:uppercase; letter-spacing:.04em;
}
.src-badge.official{background:rgba(43,127,255,0.12); color:var(--accent); border:1px solid rgba(43,127,255,0.22)}
.src-badge.partner{background:rgba(236,72,153,0.10); color:var(--pink); border:1px solid rgba(236,72,153,0.22)}
.src-badge.private{background:rgba(167,139,250,0.10); color:var(--purple); border:1px solid rgba(167,139,250,0.22)}
.cat-state{font-size:11px; color:var(--t2); display:flex; align-items:center; gap:4px}
.cat-state.connected{color:var(--green)}
.cat-cta{
  font-size:11px; font-weight:600; padding:3px 10px; border-radius:var(--r6);
  background:var(--hover); color:var(--t1); border:1px solid var(--line);
  cursor:pointer; font-family:inherit;
}
.cat-cta:hover{background:var(--hover-strong)}
.cat-cta.primary{background:var(--grad); border:none; color:#fff}

/* ── Empty / Loading ── */
.empty{
  text-align:center; padding:48px 24px; color:var(--t2);
}
.empty-h{font-size:15px; font-weight:600; color:var(--t1); margin-bottom:6px}
.empty-p{font-size:13px; color:var(--t2); margin-bottom:14px}

/* ── Divider ── */
.divider{height:1px; background:var(--line); margin:8px 0}

/* ── Detail page ── */
.detail-head{padding:18px 32px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.detail-row{display:flex; align-items:center; gap:14px}
.detail-text{flex:1; min-width:0}
.detail-name{display:flex; align-items:center; gap:8px; font-size:22px; font-weight:700; color:var(--t1); letter-spacing:-.01em}
.detail-vendor{font-size:12px; color:var(--t2); margin-top:2px}
.detail-meta{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--t2); flex-wrap:wrap; margin-top:4px}
.detail-meta .sep{color:var(--t3); opacity:.6}
.detail-actions{display:flex; align-items:center; gap:8px; flex-shrink:0}

.tabs{display:flex; gap:2px; padding:0 32px; border-bottom:1px solid var(--line); background:var(--bg)}
.tab{
  padding:11px 14px; font-size:13px; font-weight:600; color:var(--t2);
  background:transparent; border:none; cursor:pointer; font-family:inherit;
  border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:color .12s, border-color .12s;
}
.tab:hover{color:var(--t1)}
.tab.active{color:var(--accent); border-color:var(--accent)}

.detail-body{padding:24px 32px}
.ov-cols{display:grid; grid-template-columns:1fr 280px; gap:24px}
.ov-main h3, .ov-side h3{font-size:13px; font-weight:700; color:var(--t1); margin-bottom:10px; margin-top:20px}
.ov-main h3:first-child, .ov-side h3:first-child{margin-top:0}
.ov-main p{color:var(--t2); font-size:13px; margin-bottom:10px}
.ov-cap-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin:8px 0 14px}
.ov-cap-card{background:var(--bg3); border:1px solid var(--line); border-radius:var(--r8); padding:12px}
.ov-cap-card-h{font-size:12px; font-weight:700; color:var(--t1); margin-bottom:4px; display:flex; align-items:center; gap:6px}
.ov-cap-card-d{font-size:11px; color:var(--t2); line-height:1.5}
.ov-uses{list-style:none; padding:0}
.ov-uses li{font-size:13px; color:var(--t2); padding:5px 0 5px 18px; position:relative}
.ov-uses li:before{content:''; position:absolute; left:0; top:11px; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.scope-chips{display:flex; flex-wrap:wrap; gap:5px}
.scope-chip{font-size:11px; padding:3px 8px; border-radius:var(--r4); background:var(--hover); color:var(--t2); border:1px solid var(--line); font-family:'SF Mono','Menlo',monospace}

.ov-side{background:var(--bg3); border:1px solid var(--line); border-radius:var(--r10); padding:16px; height:fit-content}
.ov-side-row{padding:8px 0; font-size:12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:2px}
.ov-side-row:last-child{border-bottom:none}
.ov-side-k{color:var(--t3); font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600}
.ov-side-v{color:var(--t1); font-size:12px}
.ov-side-v a{color:var(--accent); text-decoration:none}
.ov-side-v a:hover{text-decoration:underline}
.ov-comp{display:flex; flex-wrap:wrap; gap:5px; margin-top:4px}
.ov-comp .src-badge{background:var(--hover); color:var(--t2); border-color:var(--line)}

.tab-disabled-overlay{
  position:relative; opacity:0.4; pointer-events:none;
}
.tab-locked{
  text-align:center; padding:48px 24px;
  background:var(--bg3); border:1px dashed var(--line); border-radius:var(--r10);
}
.tab-locked-h{font-size:14px; font-weight:600; color:var(--t1); margin-bottom:6px}
.tab-locked-p{font-size:12px; color:var(--t2); margin-bottom:14px}

/* ── Capabilities tab ── */
.cap-grp{background:var(--bg2); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden}
.cap-grp-head{display:flex; align-items:center; gap:10px; padding:14px 18px 10px; background:transparent; border:none}
.cap-grp-icon{width:24px; height:24px; border-radius:var(--r6); display:flex; align-items:center; justify-content:center}
.cap-grp-icon.tools{background:rgba(167,139,250,0.12); color:var(--purple)}
.cap-grp-icon.knowledge{background:rgba(5,223,114,0.10); color:var(--green)}
.cap-grp-icon.triggers{background:rgba(253,199,0,0.10); color:var(--amber)}
.cap-grp-icon.channels{background:rgba(6,182,212,0.10); color:var(--cyan)}
.cap-grp-title{font-size:13px; font-weight:600; color:var(--t1); flex:1}
.cap-grp-count{font-size:11px; color:var(--t2)}
.cap-grp-body{padding:0 18px 14px; border-top:1px solid var(--line); margin-top:4px}
.cap-row{display:grid; grid-template-columns:1fr 2fr auto auto; gap:12px; padding:10px 6px; border-bottom:1px solid rgba(255,255,255,0.04); align-items:center; font-size:12px}
.cap-row:last-child{border-bottom:none}
.cap-row:hover{background:var(--hover)}
.cap-row-name{font-weight:600; color:var(--t1); font-family:'SF Mono','Menlo',monospace; font-size:12px}
.cap-row-desc{color:var(--t2)}
.cap-row-scope{font-family:'SF Mono','Menlo',monospace; font-size:11px; color:var(--t3); background:var(--hover); padding:2px 6px; border-radius:var(--r4)}
.toggle{position:relative; width:32px; height:18px; background:var(--hover); border-radius:9px; border:1px solid var(--line); cursor:pointer; transition:background .15s}
.toggle-disabled{opacity:.4; cursor:not-allowed}
.toggle:after{content:''; position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s}
.toggle.on{background:var(--accent); border-color:transparent}
.toggle.on:after{left:17px}
.cap-grp.disabled{opacity:.4}
.cap-grp.disabled .cap-grp-head{cursor:not-allowed}

/* ── Permissions tab ── */
.perm-card{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px}
.perm-card h3{font-size:14px; font-weight:700; color:var(--t1); margin:0 0 4px; letter-spacing:-0.005em}
.perm-card .perm-sub{font-size:12px; color:var(--t2); margin:0 0 14px; line-height:1.5}
.studio-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px}
.studio-card{background:var(--bg3); border:none; border-radius:8px; padding:12px}
.studio-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.studio-ico{width:28px; height:28px; border-radius:var(--r6); display:flex; align-items:center; justify-content:center}
.studio-ico.gov{background:rgba(5,223,114,0.10); color:var(--green)}
.studio-ico.ag{background:rgba(167,139,250,0.10); color:var(--purple)}
.studio-ico.wf{background:rgba(43,127,255,0.10); color:var(--accent)}
.studio-name{font-size:13px; font-weight:600; color:var(--t1); flex:1}
.studio-roles-label{font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin:10px 0 6px}
.studio-roles{display:flex; flex-wrap:wrap; gap:5px}
.role-chip{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--hover); color:var(--t1); border:1px solid var(--line)}
.role-add{font-size:11px; padding:3px 9px; border-radius:20px; background:transparent; color:var(--t2); border:1px dashed var(--line); cursor:pointer; font-family:inherit}
.role-add:hover{color:var(--t1); border-color:var(--line-strong)}
.perm-toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.save-bar{
  position:sticky; bottom:0; padding:12px 32px; background:var(--bg3);
  border-top:1px solid var(--line); display:flex; align-items:center; gap:10px;
  margin:24px -32px -24px;
}
.save-bar-text{flex:1; font-size:12px; color:var(--amber); font-weight:500}

/* ── Audit tab/page ── */
.audit-head{margin:0 0 14px; font-size:12.5px; color:var(--t2); line-height:1.5}
.audit-filters{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:var(--bg3); border:1px solid var(--line); border-radius:var(--r8); margin-bottom:14px}
.audit-filter{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--t2)}
.audit-filter-input{background:var(--hover); border:1px solid var(--line); border-radius:var(--r6); padding:4px 8px; color:var(--t1); font-size:12px; font-family:inherit; outline:none}
.audit-count{margin-left:auto; font-size:11px; color:var(--t3)}
.audit-table{width:100%; border-collapse:collapse; background:transparent; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.audit-table th, .audit-table td{text-align:left; padding:10px 12px; font-size:12px; border-bottom:1px solid var(--line)}
.audit-table th{background:var(--hover); color:var(--t3); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.05em}
.audit-table tbody tr{cursor:pointer; transition:background .12s}
.audit-table tbody tr:hover{background:var(--hover)}
.audit-table tbody tr:last-child td{border-bottom:none}
.audit-ev{display:inline-flex; padding:2px 7px; border-radius:var(--r4); font-size:10px; font-weight:600; font-family:'SF Mono','Menlo',monospace; background:var(--hover); color:var(--t2); border:1px solid var(--line)}
.audit-ev.info{color:var(--accent); background:rgba(43,127,255,0.10); border-color:rgba(43,127,255,0.2)}
.audit-ev.warn{color:var(--amber); background:rgba(253,199,0,0.10); border-color:rgba(253,199,0,0.2)}
.audit-ev.crit{color:var(--red); background:rgba(239,68,68,0.10); border-color:rgba(239,68,68,0.2)}
.audit-actor{display:flex; align-items:center; gap:6px}
.audit-expand{background:var(--bg); padding:14px; font-family:'SF Mono','Menlo',monospace; font-size:11px; color:var(--t2); white-space:pre-wrap; border-radius:var(--r6); margin-top:6px; border:1px solid var(--line)}

/* ── Drawer ── */
.drawer-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
  z-index:99; opacity:0; pointer-events:none; transition:opacity .2s;
}
.drawer-overlay.open{opacity:1; pointer-events:all}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:480px; max-width:100vw;
  background:var(--bg2); border-left:1px solid var(--line);
  z-index:100; display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:-10px 0 40px rgba(0,0,0,0.4);
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line)}
.drawer-title{font-size:15px; font-weight:700; color:var(--t1); flex:1}
.drawer-close{background:transparent; border:none; color:var(--t2); cursor:pointer; font-size:18px; padding:4px 8px; border-radius:var(--r6)}
.drawer-close:hover{background:var(--hover); color:var(--t1)}
.drawer-body{flex:1; overflow-y:auto; padding:20px}
.drawer-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
.drawer-step-h{font-size:11px; color:var(--t3); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:6px}
.drawer-step-title{font-size:15px; font-weight:700; color:var(--t1); margin-bottom:14px}
.auth-card{
  border:1px solid var(--line); border-radius:var(--r8); padding:12px;
  margin-bottom:8px; cursor:pointer; transition:border-color .12s, background .12s;
}
.auth-card:hover{border-color:var(--line-strong); background:var(--hover)}
.auth-card.selected{border-color:var(--accent); background:rgba(43,127,255,0.06)}
.auth-card-h{display:flex; align-items:center; gap:8px; margin-bottom:4px}
.auth-card-h .auth-name{font-size:13px; font-weight:600; color:var(--t1)}
.auth-card-h .badge{font-size:9px; font-weight:700; padding:1px 6px; border-radius:var(--r4); background:rgba(5,223,114,0.10); color:var(--green); border:1px solid rgba(5,223,114,0.2); text-transform:uppercase; letter-spacing:.05em}
.auth-card-desc{font-size:11px; color:var(--t2); line-height:1.5}
.field-group{margin-bottom:14px}
.field-label{display:block; font-size:11px; font-weight:600; color:var(--t1); margin-bottom:6px}
.field-help{font-size:11px; color:var(--t3); margin-top:4px}
.field-help a{color:var(--accent)}
.connected-panel{padding:12px; background:rgba(5,223,114,0.06); border:1px solid rgba(5,223,114,0.18); border-radius:var(--r8); font-size:12px; color:var(--green); margin:12px 0}
.connected-panel strong{color:var(--t1); font-weight:700; display:block; margin-bottom:2px}
.checkbox-row{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12px; color:var(--t1); cursor:pointer}
.checkbox{width:14px; height:14px; border-radius:var(--r4); border:1px solid var(--line-strong); background:var(--hover); display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer}
.checkbox.checked{background:var(--accent); border-color:var(--accent); color:#fff}
.confirm-summary{background:var(--hover); border:1px solid var(--line); border-radius:var(--r8); padding:12px; font-size:12px; color:var(--t2); line-height:1.7; margin:12px 0}
.confirm-summary strong{color:var(--t1)}

/* ── Build your own ── */
.method-chooser{padding:24px 32px}
.method-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; margin-top:18px}
.method-card{
  background:var(--bg3); border:1px solid var(--line); border-radius:var(--r10);
  padding:18px; cursor:pointer; transition:border-color .15s, background .15s;
  display:flex; flex-direction:column; gap:8px;
}
.method-card:hover{border-color:var(--line-strong); background:var(--bg2)}
.method-ico{width:36px; height:36px; border-radius:var(--r8); display:flex; align-items:center; justify-content:center; margin-bottom:4px}
.method-ico.webhook{background:rgba(43,127,255,0.10); color:var(--accent)}
.method-ico.openapi{background:rgba(167,139,250,0.10); color:var(--purple)}
.method-ico.sdk{background:rgba(6,182,212,0.10); color:var(--cyan)}
.method-name{font-size:15px; font-weight:700; color:var(--t1)}
.method-desc{font-size:12px; color:var(--t2); line-height:1.5; flex:1}
.method-meta{display:flex; gap:10px; font-size:11px; color:var(--t3); margin-top:6px}
.method-meta .m{display:flex; align-items:center; gap:4px}
.method-meta strong{color:var(--t1); font-weight:600}

.stepper{display:flex; gap:0; margin-bottom:18px; padding:0 32px; border-bottom:1px solid var(--line)}
.step{display:flex; align-items:center; gap:8px; padding:12px 0; margin-right:24px; font-size:12px; color:var(--t3); position:relative; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px}
.step.active{color:var(--t1); border-color:var(--accent)}
.step.done{color:var(--t2)}
.step-num{width:20px; height:20px; border-radius:50%; background:var(--hover); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--t3)}
.step.active .step-num{background:var(--accent); border-color:var(--accent); color:#fff}
.step.done .step-num{background:rgba(5,223,114,0.15); border-color:rgba(5,223,114,0.3); color:var(--green)}

.code-block{background:var(--bg); border:1px solid var(--line); border-radius:var(--r8); padding:14px; font-family:'SF Mono','Menlo',monospace; font-size:11px; color:var(--t1); white-space:pre-wrap; overflow-x:auto; line-height:1.6; margin:8px 0}
.code-kw{color:#A78BFA}
.code-str{color:#05DF72}
.code-fn{color:#FDC700}
.code-com{color:var(--t3); font-style:italic}

/* ── Toast ── */
.toast-container{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r8);
  padding:10px 14px; font-size:13px; color:var(--t1);
  box-shadow:0 6px 24px rgba(0,0,0,0.5);
  display:flex; align-items:center; gap:8px;
  animation:slideIn .25s cubic-bezier(0.4, 0, 0.2, 1);
}
.toast.success{border-color:rgba(5,223,114,0.3)}
.toast.error{border-color:rgba(239,68,68,0.3)}
.toast-icon{width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-size:10px}
.toast.success .toast-icon{background:var(--green)}
.toast.error .toast-icon{background:var(--red)}
@keyframes slideIn{from{transform:translateY(20px); opacity:0}to{transform:translateY(0); opacity:1}}

/* Scrollbars */
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1); border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.18)}
::-webkit-scrollbar-track{background:transparent}

/* Connect to enable overlay */
.lock-overlay{
  margin:24px 0; padding:40px 24px; background:var(--bg3);
  border:1px dashed var(--line); border-radius:var(--r10); text-align:center;
}
.lock-overlay-h{font-size:14px; font-weight:600; color:var(--t1); margin-bottom:6px}
.lock-overlay-p{font-size:12px; color:var(--t2); margin-bottom:14px}

/* Detail row — wrap on smaller screens */
.detail-row{flex-wrap:wrap}
.detail-meta{flex-wrap:wrap; row-gap:2px}
.detail-actions{flex-wrap:wrap}

/* mkt-card-foot — allow wrap if needed */
.mkt-card-foot{flex-wrap:wrap; gap:6px}

/* Hero stats — grid instead of flex */
.mkt-hero-stats{
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:8px 24px;
  text-align:center;
  max-width:640px; margin:0 auto;
}
.mkt-hero-stat{padding:0 4px}

/* Used-in grid — responsive */
.used-in-grid{
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
}

/* Mobile menu toggle (hamburger) in topbar */
.tb-menu-btn{
  display:none; width:32px; height:32px;
  border-radius:var(--r8); background:transparent; border:none;
  color:var(--t2); cursor:pointer;
  align-items:center; justify-content:center;
  margin-right:4px; flex-shrink:0;
}
.tb-menu-btn:hover{background:var(--hover); color:var(--t1)}

/* Sub-sidebar overlay backdrop (mobile/tablet) */
.ssb-backdrop{
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
  z-index:14; opacity:0; transition:opacity .2s;
}
.ssb-backdrop.open{display:block; opacity:1}

/* ── Responsive breakpoints ── */

/* Tablet (≤1024px): sub-sidebar becomes overlay */
@media (max-width: 1024px){
  .tb-menu-btn{display:flex}
  .tb-search-btn{width:auto; flex:1 1 auto; max-width:280px}
  .tb-context-name{max-width:140px}

  .ssb{
    position:absolute; top:0; bottom:0; left:0;
    width:280px; z-index:15;
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius:14px 0 0 14px;
    box-shadow:8px 0 32px rgba(0,0,0,0.5);
  }
  .ssb.open{transform:translateX(0)}

  .main{position:relative}

  /* Hero compaction */
  .mkt-hero{padding:36px 24px 32px}
  .mkt-hero-title{font-size:26px}
  .mkt-hero-sub{font-size:13px; margin-bottom:20px}

  /* Active strip — wrap on narrower */
  .active-strip{flex-wrap:wrap; gap:12px}
  .active-strip-text{flex:1 1 100%}
  .active-strip-cta{order:3}

  /* Featured card stacks */
  .featured-card{flex-direction:column; align-items:flex-start; padding:24px}
  .featured-visual{align-self:center}
  .logo.logo-xl{width:72px; height:72px; font-size:24px}
  .featured-title{font-size:19px}

  /* Detail page */
  .detail-head{padding:16px 24px}
  .detail-name{font-size:20px}
  .detail-actions{width:100%; margin-top:8px}

  /* Section paddings */
  .mkt-section, .featured-wrap, .build-promo, .studio-filter, .cat-strip,
  .breadcrumb, .ph, .detail-body, .section{padding-left:24px; padding-right:24px}
  .build-promo{margin-left:24px; margin-right:24px}
  .active-strip{margin-left:24px; margin-right:24px}
}

/* Mobile (≤720px): tighter compactions */
@media (max-width: 720px){
  .app{padding:60px 8px 8px 8px}

  /* Topbar */
  .tb-context-name{display:none}
  .tb-ws-badge-name{display:none}
  .tb-search-btn{display:none}
  .tb-divider-v{display:none}
  .topbar{padding:0 12px 0 8px; gap:6px}

  /* Hero stats — 2 columns */
  .mkt-hero-stats{grid-template-columns:repeat(2, 1fr); gap:14px 16px}
  .mkt-hero{padding:28px 16px 24px}
  .mkt-hero-title{font-size:22px}
  .mkt-hero-sub{font-size:12.5px; margin-bottom:16px}
  .mkt-search-input{padding:12px 14px 12px 40px; font-size:13px}
  .mkt-search-icon{left:14px}

  /* Section paddings */
  .mkt-section, .featured-wrap, .studio-filter, .cat-strip,
  .breadcrumb, .ph, .detail-body, .section{padding-left:16px; padding-right:16px}
  .build-promo{margin-left:16px; margin-right:16px; padding:16px; flex-wrap:wrap}
  .active-strip{margin-left:16px; margin-right:16px}
  .detail-head{padding:14px 16px}

  /* Section header */
  .mkt-section-h{flex-direction:column; align-items:flex-start; gap:6px}
  .mkt-section-title{font-size:15px}

  /* Card grids — single column on mobile */
  .mkt-grid{grid-template-columns:1fr; gap:10px}
  .connected-grid{grid-template-columns:1fr}

  /* Studio chips bigger touch target on mobile */
  .studio-chip{width:22px; height:22px}
  .studio-chip svg{width:13px; height:13px}

  /* USED IN — single column */
  .used-in-grid{grid-template-columns:1fr}

  /* Studio filter wraps */
  .studio-filter{padding:14px 16px 0}
  .studio-pill{padding:5px 10px; font-size:11.5px}

  /* Cat-strip — show fade mask hint */
  .cat-strip{padding:14px 16px; gap:6px}
  .cat-item{font-size:11.5px; padding:6px 11px}

  /* Featured card — even tighter */
  .featured-card{padding:18px; gap:14px}
  .featured-title{font-size:17px; line-height:1.3}
  .featured-desc{font-size:12px}

  /* Detail page */
  .detail-name{font-size:18px}
  .ov-cols{grid-template-columns:1fr}
  .ov-side{order:2}
  .tabs{padding:0 16px; overflow-x:auto; gap:4px; -webkit-overflow-scrolling:touch}
  .tab{padding:11px 10px; font-size:12.5px; flex-shrink:0}

  /* Capabilities rows */
  .cap-row{grid-template-columns:1fr; gap:6px; padding:10px}
  .cap-row > *:not(:first-child){padding-left:0}

  /* Permissions studios — single column */
  .studio-grid{grid-template-columns:1fr}

  /* Audit table — hide IP column on mobile */
  .audit-table th:nth-child(7), .audit-table td:nth-child(7){display:none}
  .audit-table{font-size:11px}
  .audit-table th, .audit-table td{padding:8px}

  /* Build promo */
  .build-promo-text{flex:1 1 100%; order:2}
  .build-promo-ico{flex-shrink:0; order:1}
  .build-promo .btn{order:3; width:100%; justify-content:center}

  /* Drawer full-width on mobile */
  .drawer, .ai-drawer{width:100vw; max-width:100vw}
}

/* ── Marketplace hero ── */
.mkt-hero{
  padding:56px 32px 44px; text-align:center;
  background:radial-gradient(ellipse at 50% 0%, rgba(43,127,255,0.10) 0%, transparent 60%), linear-gradient(180deg, rgba(6,182,212,0.04) 0%, transparent 100%);
  border-bottom:1px solid var(--line); position:relative; overflow:hidden;
}
.mkt-hero::before{
  content:''; position:absolute; top:-100px; left:50%; transform:translateX(-50%);
  width:600px; height:200px; background:radial-gradient(circle, rgba(43,127,255,0.18), transparent 70%);
  pointer-events:none; filter:blur(40px);
}
.mkt-hero-eyebrow{display:flex; justify-content:center; margin-bottom:14px}
.mkt-hero-eyebrow-tag{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 10px;
  background:rgba(6,182,212,0.10); color:var(--cyan);
  border:1px solid rgba(6,182,212,0.28); border-radius:11px;
  font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
}
.mkt-hero-title{font-size:32px; font-weight:700; color:var(--t1); letter-spacing:-.02em; margin-bottom:10px; position:relative; padding-top:12px}
.mkt-hero-sub{font-size:14px; color:var(--t2); max-width:540px; margin:0 auto 26px; position:relative; line-height:1.6}
.mkt-search-wrap{position:relative; max-width:560px; margin:0 auto 22px}
.mkt-search-icon{position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--t3); pointer-events:none}
.mkt-search-input{
  width:100%; padding:14px 18px 14px 46px;
  background:var(--bg3); border:1px solid var(--line);
  border-radius:var(--r10); font-size:14px; color:var(--t1);
  outline:none; font-family:inherit;
  transition:border-color .15s, background .15s, box-shadow .15s;
  box-shadow:0 4px 20px rgba(0,0,0,0.18);
}
.mkt-search-input:focus{border-color:var(--accent); background:var(--bg2); box-shadow:0 0 0 4px rgba(43,127,255,0.16), 0 4px 20px rgba(0,0,0,0.25)}
.mkt-search-input::placeholder{color:var(--t3)}
.mkt-hero-stats{font-size:12px; color:var(--t2); position:relative}
.mkt-hero-stat strong{color:var(--t1); font-weight:700; font-size:14px; display:block; margin-bottom:1px}

/* ── Category nav strip ── */
.cat-strip{
  display:flex; gap:6px; padding:14px 32px;
  border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none;
}
.cat-strip::-webkit-scrollbar{display:none}
.cat-item{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 13px; background:var(--bg3); border:1px solid var(--line);
  border-radius:20px; cursor:pointer; color:var(--t1);
  font-size:12px; font-weight:600; font-family:inherit;
  white-space:nowrap; transition:border-color .15s, background .15s, color .15s;
}
.cat-item:hover{border-color:var(--line-strong); background:var(--bg2)}
.cat-item.active{border-color:transparent; color:#fff}
.cat-item-icon{display:flex; align-items:center; justify-content:center; flex-shrink:0; opacity:.9}

/* ── Active workspace strip ── */
.active-strip{
  margin:24px 32px 0; padding:14px 18px;
  background:linear-gradient(135deg, rgba(5,223,114,0.04) 0%, rgba(43,127,255,0.04) 100%);
  border:1px solid var(--line); border-radius:var(--r10);
  display:flex; align-items:center; gap:14px;
}
.active-strip-text{flex:1; min-width:0}
.active-strip-title{font-size:13px; font-weight:700; color:var(--t1); margin-bottom:2px; display:flex; align-items:center; gap:8px}
.active-strip-sub{font-size:12px; color:var(--t2)}
.active-strip-avatars{display:flex; align-items:center; gap:6px; flex-shrink:0}
.active-avatar{
  position:relative; cursor:pointer; transition:transform .12s;
}
.active-avatar:hover{transform:translateY(-2px)}
.active-avatar .logo{border:1px solid var(--line)}
.active-dot{
  position:absolute; bottom:-1px; right:-1px;
  width:9px; height:9px; border-radius:50%;
  border:2px solid var(--bg);
}
.active-dot.health-healthy{background:var(--green)}
.active-dot.health-degraded{background:var(--amber)}
.active-dot.health-failed{background:var(--red)}
.active-more{
  height:32px; padding:0 10px; border-radius:var(--r8);
  background:var(--hover); border:1px solid var(--line);
  color:var(--t2); font-size:11px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
}
.active-strip-cta{flex-shrink:0}

/* ── Featured card ── */
.featured-wrap{padding:24px 32px 0}
.featured-card{
  position:relative; padding:28px 32px;
  background:linear-gradient(135deg, rgba(43,127,255,0.10) 0%, rgba(6,182,212,0.08) 100%);
  border:1px solid rgba(6,182,212,0.22); border-radius:var(--r12);
  display:flex; align-items:center; gap:32px; overflow:hidden;
  cursor:pointer; transition:border-color .15s, transform .12s;
}
.featured-card:hover{border-color:rgba(6,182,212,0.40); transform:translateY(-1px)}
.featured-card::before{
  content:''; position:absolute; top:-50px; right:-50px;
  width:300px; height:300px;
  background:radial-gradient(circle at center, rgba(6,182,212,0.18), transparent 65%);
  pointer-events:none; filter:blur(20px);
}
.featured-content{flex:1; min-width:0; position:relative; z-index:1}
.featured-eyebrow{
  display:inline-flex; align-items:center; gap:6px;
  font-size:10px; font-weight:700; letter-spacing:.10em; text-transform:uppercase;
  color:var(--cyan); margin-bottom:10px;
  padding:3px 10px; border-radius:20px;
  background:rgba(6,182,212,0.12); border:1px solid rgba(6,182,212,0.25);
}
.featured-title{font-size:22px; font-weight:700; color:var(--t1); margin-bottom:8px; letter-spacing:-.01em; line-height:1.25}
.featured-desc{font-size:13px; color:var(--t2); line-height:1.6; max-width:520px; margin-bottom:16px}
.featured-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.featured-visual{position:relative; flex-shrink:0; z-index:1}
.logo.logo-xl{width:96px; height:96px; font-size:34px; border-radius:var(--r14); box-shadow:0 8px 30px rgba(0,0,0,0.4)}

/* ── Market section ── */
.mkt-section{padding:32px 32px 8px}
.mkt-section + .mkt-section{padding-top:8px}
.mkt-section-h{
  display:flex; align-items:flex-end; justify-content:space-between;
  margin-bottom:14px; gap:12px;
}
.mkt-section-title{font-size:16px; font-weight:700; color:var(--t1); letter-spacing:-.01em}
.mkt-section-sub{font-size:12px; color:var(--t2); margin-top:2px}
.mkt-section-link{font-size:12px; color:var(--accent); text-decoration:none; font-weight:500}
.mkt-section-link:hover{text-decoration:underline}

/* ── Market grid + card (richer) ── */
.mkt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(264px, 1fr));
  gap:12px;
}
.mkt-card{
  background:var(--bg3); border:1px solid var(--line);
  border-radius:var(--r10); padding:16px;
  cursor:pointer; display:flex; flex-direction:column; gap:10px;
  transition:border-color .15s, background .15s, transform .12s, box-shadow .15s;
  position:relative; min-height:178px;
}
.mkt-card:hover{
  border-color:var(--line-strong);
  background:var(--bg2);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
}
.mkt-card-row{display:flex; align-items:flex-start; gap:11px}
.mkt-card-text{flex:1; min-width:0}
.mkt-card-name{font-size:14px; font-weight:600; color:var(--t1); line-height:1.3; display:flex; align-items:center; gap:6px}
.mkt-card-verified{color:var(--accent); flex-shrink:0; display:inline-flex}
.mkt-card-vendor{font-size:11px; color:var(--t3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mkt-card-corner{position:absolute; top:14px; right:14px}
.mkt-card-desc{
  font-size:12px; color:var(--t2); line-height:1.55;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; flex:1;
}
.mkt-card-caps{display:flex; flex-wrap:wrap; gap:4px}
.mkt-card-foot{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:6px; padding-top:10px; border-top:1px solid var(--line);
}
.mkt-card-cta{
  font-size:11px; font-weight:600; padding:5px 13px;
  border-radius:var(--r6); cursor:pointer;
  background:var(--hover); color:var(--t1); border:1px solid var(--line);
  font-family:inherit; transition:background .12s, border-color .12s;
}
.mkt-card-cta:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
.mkt-card-state{
  font-size:11px; font-weight:600;
  display:inline-flex; align-items:center; gap:5px;
}
.mkt-card-state.connected{color:var(--green)}
.mkt-card-state.degraded{color:var(--amber)}
.mkt-card-state.failed{color:var(--red)}
.mkt-card-arrow{
  font-size:14px; color:var(--t3);
  transition:opacity .12s, transform .12s, color .12s;
}
.mkt-card:hover .mkt-card-arrow{color:var(--accent); transform:translateX(2px)}
.logo.logo-md{width:40px; height:40px; font-size:14px; border-radius:var(--r8)}
.logo.logo-xs{width:20px; height:20px; font-size:9px; border-radius:5px}
.logo.logo-active{width:32px; height:32px; font-size:11px; border-radius:var(--r8)}

/* ── New / tag chips on cards ── */
.mkt-card-flag{
  position:absolute; top:14px; right:14px;
  font-size:9px; font-weight:700; padding:2px 7px; border-radius:var(--r4);
  text-transform:uppercase; letter-spacing:.05em;
}
.mkt-card-flag.new{background:rgba(5,223,114,0.12); color:var(--green); border:1px solid rgba(5,223,114,0.25)}
.mkt-card-flag.partner{background:rgba(236,72,153,0.10); color:var(--pink); border:1px solid rgba(236,72,153,0.22)}
.mkt-card-flag.private{background:rgba(167,139,250,0.10); color:var(--purple); border:1px solid rgba(167,139,250,0.22)}

/* ── Status bucket chip (tier-1 indicator per orchestration thesis) ── */
.mkt-card-status{
  position:absolute; top:14px; right:14px;
  display:inline-flex; align-items:center; gap:5px;
  font-size:10px; font-weight:700; padding:3px 8px 3px 7px;
  border-radius:20px; line-height:1;
  letter-spacing:.01em; white-space:nowrap;
  max-width:140px; overflow:hidden; text-overflow:ellipsis;
}
.mkt-card-status-dot{
  width:6px; height:6px; border-radius:50%; flex-shrink:0;
  background:currentColor; box-shadow:0 0 0 2px color-mix(in srgb, currentColor 18%, transparent);
}
.mkt-card-status.status-working{
  background:rgba(5,223,114,0.10); color:var(--green); border:1px solid rgba(5,223,114,0.25);
}
.mkt-card-status.status-needs_attention{
  background:rgba(253,199,0,0.10); color:var(--amber); border:1px solid rgba(253,199,0,0.28);
}
.mkt-card-status.status-needs_attention .mkt-card-status-dot{
  animation:status-pulse 1.6s ease-in-out infinite;
}
@keyframes status-pulse{
  0%,100%{box-shadow:0 0 0 2px color-mix(in srgb, currentColor 20%, transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb, currentColor 4%, transparent)}
}
.mkt-card-status.status-inactive{
  background:rgba(148,163,184,0.10); color:var(--t3); border:1px solid var(--line);
}
/* When both status chip and source flag exist, stack them */
.mkt-card-status + .mkt-card-flag,
.mkt-card-flag + .mkt-card-status{
  top:38px;
}
.mkt-card-usage{
  font-size:11px; color:var(--t3); font-weight:500;
  display:inline-flex; align-items:center; gap:5px;
}

/* ──────────────────────────────────────────────────────────
   OPERATE VIEW (orchestration thesis)
   "Status of your data infrastructure" instead of "Here are integrations"
   ────────────────────────────────────────────────────────── */
.op-hero{
  display:flex; gap:32px; align-items:center; justify-content:space-between;
  padding:36px 32px 28px;
  border-bottom:1px solid var(--line);
}
.op-hero-left{flex:1; min-width:0}
.op-hero-eyebrow{
  display:inline-flex; align-items:center; gap:10px; margin-bottom:14px;
}
.op-mode-tag{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px;
  background:rgba(6,182,212,0.10); color:var(--cyan);
  border:1px solid rgba(6,182,212,0.28); border-radius:11px;
  font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
}
.op-hero-sub{font-size:12px; color:var(--t3); font-weight:500}
.op-hero-title{
  font-size:30px; font-weight:800; color:var(--t1); margin-bottom:8px;
  letter-spacing:-.02em; line-height:1.15;
}
.op-hero-desc{font-size:14px; color:var(--t2); line-height:1.55; max-width:580px}
.op-hero-right{
  display:flex; gap:24px; flex-shrink:0; padding-left:24px;
  border-left:1px solid var(--line);
}
.op-kpi{text-align:right}
.op-kpi-n{font-size:30px; font-weight:800; line-height:1; letter-spacing:-.02em}
.op-kpi-l{font-size:11px; color:var(--t3); margin-top:5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600}

@media (max-width:860px){
  .op-hero{flex-direction:column; align-items:flex-start; gap:20px}
  .op-hero-right{border-left:none; padding-left:0; gap:18px}
  .op-kpi{text-align:left}
  .op-hero-title{font-size:22px}
}

/* Tabs */
.op-tabs{
  display:flex; align-items:center; gap:6px;
  padding:14px 32px; border-bottom:1px solid var(--line);
  background:var(--bg);
  position:sticky; top:0; z-index:5;
  backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%);
}
.op-tab{
  display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px;
  background:transparent; border:1px solid transparent;
  color:var(--t2); font-family:inherit; font-size:13px; font-weight:600;
  cursor:pointer; border-radius:8px; transition:background .15s, color .15s, border-color .15s;
}
.op-tab:hover{background:var(--hover); color:var(--t1)}
.op-tab.active{background:var(--hover-strong); color:var(--t1); border-color:var(--line)}
.op-tab-count{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 6px;
  font-size:10px; font-weight:800; border-radius:9px; line-height:1;
}
.op-tab-count-warn{background:rgba(253,199,0,0.15); color:var(--amber)}
.op-tab-count-ok{background:rgba(5,223,114,0.12); color:var(--green)}
.op-tab-count-idle{background:rgba(148,163,184,0.15); color:var(--t3)}
.op-tab-count-neutral{background:var(--hover); color:var(--t2)}
.op-link{
  color:var(--cyan); font-size:13px; font-weight:600; text-decoration:none;
  padding:0 10px; height:32px; display:inline-flex; align-items:center;
}
.op-link:hover{text-decoration:underline}

/* List */
.op-list{padding:8px 24px 32px; display:flex; flex-direction:column; gap:6px}
.op-row{
  display:grid; grid-template-columns:160px 1fr 32px 140px; gap:16px;
  align-items:center; padding:14px 14px 14px 18px;
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  cursor:pointer; transition:border-color .15s, background .15s;
}
.op-row:hover{border-color:var(--line-strong); background:var(--hover-strong)}
.op-row-status .mkt-card-status{font-size:11px; padding:4px 9px}
.op-row-main{display:flex; align-items:center; gap:12px; min-width:0}
.op-row-text{min-width:0; flex:1}
.op-row-name{font-size:14px; font-weight:700; color:var(--t1); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.op-row-meta{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  font-size:12px; color:var(--t3); font-weight:500;
}
.op-row-meta .op-dot{color:var(--line-strong); font-weight:400}
.op-row-owner{display:flex; align-items:center; justify-content:center}
.op-row-avatar{
  width:26px; height:26px; border-radius:50%;
  background:linear-gradient(135deg,#06B6D4,#A78BFA);
  color:#fff; font-size:10px; font-weight:800;
  display:flex; align-items:center; justify-content:center; letter-spacing:-.02em;
}
.op-row-action{display:flex; justify-content:flex-end}
.op-cta{
  display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px;
  font-family:inherit; font-size:12px; font-weight:700;
  border-radius:7px; cursor:pointer; transition:transform .12s, background .15s;
  white-space:nowrap;
}
.op-cta:hover{transform:translateY(-1px)}
.op-cta-warn{background:var(--amber); color:#1a0f00; border:1px solid var(--amber)}
.op-cta-warn:hover{background:#e3b400}
.op-cta-ok{background:transparent; color:var(--t1); border:1px solid var(--line-strong)}
.op-cta-ok:hover{background:var(--hover)}
.op-cta-neutral{background:transparent; color:var(--t2); border:1px solid var(--line)}
.op-cta-neutral:hover{color:var(--t1); border-color:var(--line-strong); background:var(--hover)}
.op-cta-disabled{opacity:.5; cursor:not-allowed}
.op-cta-disabled:hover{transform:none}

.op-empty{
  text-align:center; padding:48px 24px;
  background:var(--bg2); border:1px dashed var(--line); border-radius:12px;
}
.op-empty-ic{
  width:48px; height:48px; border-radius:50%;
  background:rgba(5,223,114,0.10); color:var(--green);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:800; margin-bottom:14px;
}
.op-empty-t{font-size:15px; font-weight:700; color:var(--t1); margin-bottom:4px}
.op-empty-d{font-size:13px; color:var(--t3)}

@media (max-width:780px){
  .op-row{grid-template-columns:1fr; gap:10px; padding:14px}
  .op-row-status{order:1}
  .op-row-main{order:2}
  .op-row-owner{display:none}
  .op-row-action{order:3; justify-content:flex-start}
}

/* ──────────────────────────────────────────────────────────
   SETUP PROGRESS (Connected → Map → Validate → Publish)
   Lives in the integration detail head, just below "Used in".
   ────────────────────────────────────────────────────────── */
.setup-progress{
  display:flex; align-items:flex-start;
  padding:16px 18px; margin-top:18px;
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  gap:0;
}
.sp-step{
  display:flex; align-items:center; gap:10px;
  position:relative; flex:1; min-width:0;
}
.sp-step-marker{
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; position:relative; z-index:1;
  font-family:inherit;
}
.sp-step.sp-done .sp-step-marker{
  background:rgba(5,223,114,0.16); color:var(--green);
  border:1.5px solid rgba(5,223,114,0.40);
}
.sp-step.sp-current .sp-step-marker{
  background:rgba(253,199,0,0.16); color:var(--amber);
  border:1.5px solid rgba(253,199,0,0.50);
}
.sp-step.sp-error .sp-step-marker{
  background:rgba(239,68,68,0.16); color:var(--red);
  border:1.5px solid rgba(239,68,68,0.45);
}
.sp-step.sp-pending .sp-step-marker{
  background:var(--hover); color:var(--t3);
  border:1.5px dashed var(--line-strong);
}
.sp-step-pulse{
  width:8px; height:8px; border-radius:50%;
  background:var(--amber);
  box-shadow:0 0 0 0 rgba(253,199,0,0.6);
  animation:sp-pulse 1.4s ease-in-out infinite;
}
@keyframes sp-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(253,199,0,0.5)}
  50%{box-shadow:0 0 0 6px rgba(253,199,0,0)}
}
.sp-step-text{flex:1; min-width:0; line-height:1.25}
.sp-step-label{font-size:12px; font-weight:700; color:var(--t1); letter-spacing:.01em}
.sp-step.sp-pending .sp-step-label{color:var(--t3); font-weight:600}
.sp-step-sub{font-size:11px; color:var(--t2); margin-top:1px}
.sp-step.sp-error .sp-step-sub{color:var(--red)}
.sp-step.sp-current .sp-step-sub{color:var(--amber)}
.sp-step-bar{
  flex:1; height:2px; min-width:24px;
  background:var(--line); margin:0 8px;
  border-radius:2px;
}
.sp-step.sp-done + .sp-step .sp-step-bar,
.sp-step.sp-done .sp-step-bar{
  background:linear-gradient(90deg, rgba(5,223,114,0.45) 0%, rgba(5,223,114,0.45) 100%);
}

@media (max-width:780px){
  .setup-progress{flex-direction:column; align-items:stretch; gap:14px}
  .sp-step-bar{display:none}
}

/* ──────────────────────────────────────────────────────────
   GATE BANNER (orchestration thesis: graduated gatekeeping)
   ────────────────────────────────────────────────────────── */
.gate-banner{
  display:flex; align-items:center; gap:16px;
  padding:14px 18px; margin:0 32px 18px;
  border-radius:10px; border:1px solid transparent;
}
.gate-banner-warn{
  background:color-mix(in srgb, var(--amber) 8%, transparent);
  border-color:color-mix(in srgb, var(--amber) 28%, transparent);
}
.gate-banner-bad{
  background:color-mix(in srgb, var(--red) 8%, transparent);
  border-color:color-mix(in srgb, var(--red) 28%, transparent);
}
.gate-banner-ic{
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.gate-banner-warn .gate-banner-ic{background:rgba(253,199,0,0.14); color:var(--amber)}
.gate-banner-bad  .gate-banner-ic{background:rgba(239,68,68,0.14); color:var(--red)}
.gate-banner-body{flex:1; min-width:0}
.gate-banner-title{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:14px; font-weight:700; color:var(--t1);
  margin-bottom:3px; letter-spacing:.01em;
}
.gate-banner-desc{font-size:13px; color:var(--t2); line-height:1.5}
.gate-banner-actions{flex-shrink:0}
.gate-chip{
  display:inline-flex; align-items:center; height:18px; padding:0 7px;
  font-size:10px; font-weight:800; border-radius:9px; line-height:1;
  letter-spacing:.04em; text-transform:uppercase;
}
.gate-chip-warn{background:rgba(253,199,0,0.18); color:var(--amber); border:1px solid rgba(253,199,0,0.36)}
.gate-chip-block{background:rgba(239,68,68,0.18); color:var(--red); border:1px solid rgba(239,68,68,0.36)}

@media (max-width:780px){
  .gate-banner{flex-direction:column; align-items:flex-start; gap:12px}
  .gate-banner-actions{align-self:flex-end}
}


/* ──────────────────────────────────────────────────────────
   REQUEST FORM (admin asks for a new integration)
   ────────────────────────────────────────────────────────── */
.req-form{padding:32px 32px 60px; max-width:880px; margin:0 auto}
.req-form-hero{margin-bottom:28px}
.req-form-title{font-size:30px; font-weight:800; color:var(--t1); letter-spacing:-.02em; margin:8px 0 8px}
.req-form-sub{font-size:14px; color:var(--t2); line-height:1.55; max-width:620px}

.req-form-card{
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  overflow:hidden;
}
.req-form-section{padding:24px 28px; border-bottom:1px solid var(--line)}
.req-form-section:last-of-type{border-bottom:none}
.req-form-section-h{
  display:flex; gap:14px; align-items:flex-start;
  margin-bottom:18px;
}
.req-form-section-n{
  width:26px; height:26px; border-radius:50%;
  background:rgba(6,182,212,0.12); color:var(--cyan);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; flex-shrink:0;
  border:1px solid rgba(6,182,212,0.30);
}
.req-form-section-t{font-size:15px; font-weight:700; color:var(--t1); letter-spacing:.01em}
.req-form-section-d{font-size:12.5px; color:var(--t3); margin-top:3px; line-height:1.5}
.req-form-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.req-form-grid .field-group{margin-bottom:0}
@media (max-width:680px){.req-form-grid{grid-template-columns:1fr}}

.req-textarea{
  min-height:100px; padding-top:12px; padding-bottom:12px;
  font-family:inherit; line-height:1.5; resize:vertical;
}

.req-radio-row{display:flex; gap:8px; flex-wrap:wrap}
.req-radio{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 12px; border:1px solid var(--line); border-radius:7px;
  cursor:pointer; font-size:12.5px; color:var(--t1);
  background:rgba(255,255,255,0.02);
  transition:border-color .12s, background .12s;
}
.req-radio:hover{border-color:var(--line-strong); background:rgba(255,255,255,0.04)}
.req-radio.selected{border-color:var(--cyan); background:rgba(6,182,212,0.07); color:var(--cyan)}
.req-radio input[type=radio]{accent-color:var(--cyan); margin:0}

.req-check-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
.req-check{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 12px; border:1px solid var(--line); border-radius:7px;
  cursor:pointer; font-size:12.5px; color:var(--t2);
  background:rgba(255,255,255,0.02);
  transition:border-color .12s, background .12s, color .12s;
}
.req-check:hover{border-color:var(--line-strong)}
.req-check.selected{border-color:var(--green); background:rgba(5,223,114,0.06); color:var(--green)}
.req-check input[type=checkbox]{accent-color:var(--green); margin:0}

.req-form-footer{
  display:flex; align-items:center; justify-content:flex-end; gap:12px;
  padding:20px 28px;
  background:rgba(255,255,255,0.02); border-top:1px solid var(--line);
}

/* Success state */
.req-success{
  padding:60px 32px; text-align:center; max-width:560px; margin:0 auto;
}
.req-success-ic{
  width:64px; height:64px; border-radius:50%;
  background:rgba(5,223,114,0.16); color:var(--green);
  display:inline-flex; align-items:center; justify-content:center;
  margin-bottom:18px;
  border:1.5px solid rgba(5,223,114,0.36);
}
.req-success-title{font-size:24px; font-weight:800; color:var(--t1); margin-bottom:6px; letter-spacing:-.01em}
.req-success-sub{font-size:13px; color:var(--t2); margin-bottom:18px}
.req-success-body{font-size:14px; color:var(--t2); line-height:1.6; margin-bottom:26px}
.req-success-actions{display:flex; gap:12px; justify-content:center; align-items:center}
.req-success-actions a{text-decoration:none}

/* ──────────────────────────────────────────────────────────
   REQUEST INBOX
   ────────────────────────────────────────────────────────── */
.req-list{padding:8px 24px 32px; display:flex; flex-direction:column; gap:6px}
.req-row{
  display:grid; grid-template-columns:170px 1fr 200px 110px 140px; gap:16px;
  align-items:center; padding:14px 14px 14px 18px;
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  cursor:pointer; transition:border-color .15s, background .15s;
}
.req-row:hover{border-color:var(--line-strong); background:var(--hover-strong)}

.req-row-status{display:flex; flex-direction:column; gap:5px; align-items:flex-start}
.req-status-chip{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:700; padding:3px 8px 3px 7px;
  border-radius:20px; line-height:1; border:1px solid; white-space:nowrap;
  letter-spacing:.01em;
}
.req-status-dot{width:6px; height:6px; border-radius:50%; box-shadow:0 0 0 2px color-mix(in srgb, currentColor 14%, transparent)}
.req-priority-tag{
  font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:8px;
  background:rgba(239,68,68,0.10); color:var(--red); border:1px solid rgba(239,68,68,0.22);
  text-transform:uppercase; letter-spacing:.05em; line-height:1;
}

.req-row-main{min-width:0}
.req-row-name{font-size:14px; font-weight:700; color:var(--t1); margin-bottom:3px}
.req-row-sub{font-size:12px; color:var(--t2); line-height:1.5; margin-bottom:5px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.req-row-meta{display:flex; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--t3)}

.req-row-owner{display:flex; align-items:center; gap:10px; min-width:0}
.req-row-owner-text{font-size:11.5px; color:var(--t1); line-height:1.4; min-width:0}
.req-row-owner-sub{font-size:10.5px; color:var(--t3); margin-top:1px}

.req-row-quote{text-align:right}
.req-quote-amt{font-size:14px; font-weight:800; color:var(--green); letter-spacing:-.01em}
.req-quote-eta{font-size:11px; color:var(--t3); margin-top:1px}
.req-quote-pending{font-size:11px; color:var(--t3); font-style:italic}

.req-row-action{display:flex; justify-content:flex-end}

@media (max-width:980px){
  .req-row{grid-template-columns:1fr; gap:10px}
  .req-row-owner, .req-row-quote{display:none}
}


/* ── Provider capabilities: read-only catalog view (Sprint 1) ── */
.cap-readonly-banner{
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; margin-bottom:16px;
  background:rgba(6,182,212,0.06);
  border:1px solid rgba(6,182,212,0.22); border-radius:10px;
}
.cap-readonly-banner-ic{
  width:36px; height:36px; border-radius:9px;
  background:rgba(6,182,212,0.14); color:var(--cyan);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.cap-readonly-banner-body{flex:1; min-width:0}
.cap-readonly-banner-t{font-size:13px; font-weight:700; color:var(--t1); margin-bottom:2px; letter-spacing:.01em}
.cap-readonly-banner-d{font-size:12px; color:var(--t2); line-height:1.5}

.cap-grp-active-chip{
  display:inline-flex; align-items:center; height:20px; padding:0 9px;
  background:rgba(167,139,250,0.08); color:var(--purple);
  border:1px solid rgba(167,139,250,0.24); border-radius:10px;
  font-size:10.5px; font-weight:700; letter-spacing:.02em;
  margin-left:auto; flex-shrink:0;
}
.cap-row-ro .toggle{display:none}
.cap-grp-readonly .cap-row{padding-right:16px}
.cap-grp-readonly .cap-row .cap-row-scope{color:var(--t3)}

.mcp-tools-readonly .mcp-tool-row-ro .toggle{display:none}
.mcp-tools-readonly .mcp-tool-row{padding-right:14px}


/* ── Home tabs: "Already integrated" vs "Marketplace" ── */
.home-tabs{
  display:flex; align-items:center; gap:6px;
  padding:14px 32px; margin-bottom:4px;
  border-bottom:1px solid var(--line);
  background:var(--bg); position:sticky; top:0; z-index:5;
  backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%);
}
.home-tab{
  display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 14px;
  background:transparent; border:1px solid transparent;
  color:var(--t2); font-family:inherit; font-size:13px; font-weight:600;
  cursor:pointer; border-radius:8px; transition:background .12s, color .12s, border-color .12s;
}
.home-tab:hover:not([disabled]){background:var(--hover); color:var(--t1)}
.home-tab.active{background:var(--hover-strong); color:var(--t1); border-color:var(--line)}
.home-tab[disabled]{opacity:.45; cursor:not-allowed}
.home-tab-count{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 6px;
  font-size:10px; font-weight:800; border-radius:9px; line-height:1;
  background:var(--hover); color:var(--t2);
}
.home-tab.active .home-tab-count{background:rgba(6,182,212,0.14); color:var(--cyan)}

/* ── Already-integrated view ── */
.integrated-section{padding:24px 32px 40px}
.integrated-cat{margin-bottom:32px}
.integrated-cat-h{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.integrated-cat-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
.integrated-cat-label{font-size:12px; font-weight:800; color:var(--t1); text-transform:uppercase; letter-spacing:.05em}
.integrated-cat-count{
  display:inline-flex; align-items:center; justify-content:center;
  height:18px; padding:0 7px; min-width:22px;
  font-size:10px; font-weight:800; border-radius:9px;
  background:var(--hover); color:var(--t2); line-height:1;
}
.integrated-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.int-card{
  position:relative;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:16px 16px 14px;
  cursor:pointer; transition:border-color .12s, background .12s, transform .12s;
  display:flex; flex-direction:column; gap:10px;
}
