function capDescriptionForIntegration(i, cap) {
  const map = {
    tools:{
      slack:'14 actions including send_message, read_channel_history and create_channel.',
      github:'Repo operations, PR management, workflow dispatch.',
      jira:'Create/update issues, transitions, comment, attach files.',
      salesforce:'Read accounts, opportunities, contacts; trigger Apex flows.',
      snowflake:'Run SQL, manage warehouses, list databases and schemas.',
      _default:`Functions an agent can invoke as ${i.name} actions.`
    },
    knowledge:{
      gdrive:'Index files and folders for semantic search.',
      notion:'Pages and databases ingested daily for Governance.',
      snowflake:'Tables and views queryable as knowledge sources.',
      github:'Repo READMEs and docs indexed for code context.',
      _default:`Data sources from ${i.name} ingested and indexed.`
    },
    triggers:{
      slack:'Reacts to messages, mentions and member events.',
      jira:'Issue status transitions, comments and links.',
      github:'PR events, pushes, workflow completions.',
      _default:`Events from ${i.name} that can wake up workflows.`
    },
    channels:{
      slack:'Send to channels, DMs and threads with delivery retries.',
      email:'SMTP outbound and IMAP inbound channels.',
      twilio:'SMS, WhatsApp and voice as outbound channels.',
      _default:`Outbound destination — ${i.name} receives outputs from agents.`
    }
  };
  return map[cap][i.slug] || map[cap]._default;
}

function defaultUseCases(i) {
  const list = [];
  if (i.capabilities.includes('tools')) list.push(`Let agents in Agentic Studio invoke ${i.name} actions on behalf of operators.`);
  if (i.capabilities.includes('knowledge')) list.push(`Index ${i.name} data as a Governance Knowledge Pack.`);
  if (i.capabilities.includes('triggers')) list.push(`Wake up an agent when an event happens in ${i.name}.`);
  if (i.capabilities.includes('channels')) list.push(`Send agent outputs to ${i.name} as a delivery destination.`);
  return list.slice(0, 3);
}

function detailCapabilities(i) {
  if (!i.connected) {
    return lockOverlay(i, 'Connect to manage capabilities');
  }
  return ['tools','knowledge','triggers','channels'].map(c => capabilityGroup(i, c)).join('');
}

function capabilityGroup(i, cap) {
  const has = i.capabilities.includes(cap);
  const meta = CAP_META[cap];
  if (!has) {
    return `
      <div class="cap-grp disabled">
        <div class="cap-grp-head">
          <div class="cap-grp-icon ${cap}">${meta.icon}</div>
          <div class="cap-grp-title">${meta.label}</div>
          <div class="cap-grp-count">Not supported by this integration</div>
        </div>
      </div>
    `;
  }

  let rows = '';
  if (cap==='tools' && i.tools) {
    rows = i.tools.map(t => `
      <div class="cap-row">
        <div class="cap-row-name">${escapeHtml(t.name)}</div>
        <div class="cap-row-desc">${escapeHtml(t.desc)}</div>
        <div class="cap-row-scope">${escapeHtml(t.scope||'')}</div>
        <div class="toggle ${t.enabled?'on':''}" onclick="toast('${t.enabled?'Disabled':'Enabled'} ${t.name}')"></div>
      </div>
    `).join('');
  } else if (cap==='triggers' && i.triggers) {
    rows = i.triggers.map(t => `
      <div class="cap-row">
        <div class="cap-row-name">${escapeHtml(t.name)}</div>
        <div class="cap-row-desc">${escapeHtml(t.desc)}</div>
        <div class="cap-row-scope"></div>
        <div class="toggle ${t.enabled?'on':''}" onclick="toast('${t.enabled?'Disabled':'Enabled'} ${t.name}')"></div>
      </div>
    `).join('');
  } else if (cap==='knowledge') {
    rows = `
      <div class="cap-row" style="grid-template-columns:1fr auto">
        <div>
          <div class="cap-row-name" style="font-family:inherit">Default workspace source</div>
          <div class="cap-row-desc" style="margin-top:2px">Indexed daily · last refresh ${escapeHtml(i.lastRun)}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="toast('Re-indexing started')">Re-index now</button>
      </div>
      <div style="padding:10px 14px; border-top:1px solid var(--line)"><button class="btn btn-link btn-sm" onclick="toast('Add source dialog opened')">+ Add source</button></div>
    `;
  } else if (cap==='channels') {
    rows = `
      <div class="cap-row" style="grid-template-columns:1fr auto">
        <div>
          <div class="cap-row-name" style="font-family:inherit">Default channel</div>
          <div class="cap-row-desc" style="margin-top:2px">Retry policy: 3 attempts · exponential backoff · dead-letter to #ops-alerts</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="toast('Channel config opened')">Configure</button>
      </div>
    `;
  } else {
    rows = `<div class="empty" style="padding:24px"><div class="empty-p">No items yet.</div></div>`;
  }

  const count = (cap==='tools'?i.tools?.length: cap==='triggers'?i.triggers?.length: '') || '';
  return `
    <div class="cap-grp">
      <div class="cap-grp-head">
        <div class="cap-grp-icon ${cap}">${meta.icon}</div>
        <div class="cap-grp-title">${meta.label}</div>
        <div class="cap-grp-count">${count ? count+' available' : ''}</div>
      </div>
      <div class="cap-grp-body">${rows}</div>
    </div>
  `;
}

function detailAudit(i) {
  const events = AUDIT_EVENTS.filter(e => e.resource === i.slug);
  return `
    <div class="audit-head">Showing audit events for <strong style="color:var(--t1)">${escapeHtml(i.name)}</strong> · Last 30 days · <a href="#/audit" style="color:var(--accent);text-decoration:none">View full audit log →</a></div>
    ${events.length===0 ? `<div class="empty"><div class="empty-h">No events for this integration in the last 30 days</div><div class="empty-p">Try widening the date range from the full audit log.</div></div>` : auditTable(events, false)}
  `;
}

function lockOverlay(i, title) {
  return `
    <div class="lock-overlay">
      <div class="lock-overlay-h">🔒 ${escapeHtml(title)}</div>
      <div class="lock-overlay-p">Connect this integration to manage capabilities, permissions and audit events.</div>
      <button class="btn btn-primary btn-sm" onclick="openConnect('${i.slug}')">Connect ${escapeHtml(i.name)}</button>
    </div>
  `;
}

function togglePerm(slug, studio) {
  const i = findIntegration(slug);
  i.studios = i.studios || {governance:false, agentic:false, workforce:false};
  i.studios[studio] = !i.studios[studio];
  paintDetail(i);
}
function togglePersonalAllow(slug) {
  const i = findIntegration(slug); i.allowPersonal = !i.allowPersonal; paintDetail(i);
}
function disconnect(slug) {
  if(!confirm('Disconnect this integration? This will revoke credentials.')) return;
  const i = findIntegration(slug);
  i.connected = false; i.health = null;
  toast(`${i.name} disconnected`, 'success'); paintDetail(i);
}

/* ====================== CONNECT DRAWER ====================== */

function openConnect(slug) {
  const i = findIntegration(slug);
  if (!i) return;
  state.drawerState = {
    integration:i,
    step:i.authMethods.length>1 ? 1 : 2,
    authMethod:i.authMethods[0],
    studios:{governance:true,agentic:true,workforce:true},
    allowPersonal:false,
    authenticated:false,
    apiKeyValid:false,
    apiKey:'',
    displayName:''
  };
  state.drawerOpen = true;
  paintDrawer();
  $('drawerOverlay').classList.add('open');
  $('drawer').classList.add('open');
}

function closeDrawer() {
  state.drawerOpen = false;
  $('drawerOverlay').classList.remove('open');
  $('drawer').classList.remove('open');
}

function paintDrawer() {
  const s = state.drawerState; if(!s) return;
  const i = s.integration;
  const d = $('drawer');

  let body = '';
  let footer = '';

  if (s.step === 1) {
    body = `
      <div class="drawer-step-h">Step 1 of 4</div>
      <div class="drawer-step-title">Choose authentication method</div>
      ${i.authMethods.map(m => {
        const meta = {
          oauth:{label:'OAuth 2.0',desc:'Sign in to '+i.name+' and authorize AIMS-OS. Most secure and easiest for end users.',badge:'Most secure'},
          apikey:{label:'API token',desc:'Paste a token from '+i.name+'. Used when OAuth is not available or for service automation.',badge:''},
          service:{label:'Service account',desc:'Upload a JSON key file. For server-to-server access (e.g. Google Cloud).',badge:''}
        }[m];
        const sel = s.authMethod===m ? 'selected' : '';
        return `
          <div class="auth-card ${sel}" onclick="selectAuth('${m}')">
            <div class="auth-card-h"><span class="auth-name">${meta.label}</span>${meta.badge?`<span class="badge">${meta.badge}</span>`:''}</div>
            <div class="auth-card-desc">${meta.desc}</div>
          </div>
        `;
      }).join('')}
    `;
    footer = `<button class="btn btn-ghost btn-sm" onclick="closeDrawer()">Cancel</button><button class="btn btn-primary btn-sm" onclick="drawerNext()">Continue →</button>`;
  }

  else if (s.step === 2) {
    if (s.authMethod==='oauth') {
      body = `
        <div class="drawer-step-h">Step 2 of 4 · OAuth 2.0</div>
        <div class="drawer-step-title">Authorize with ${escapeHtml(i.name)}</div>
        ${s.authenticated ? `
          <div class="connected-panel">
            <strong>✓ Connected as AIMS Workspace</strong>
            Authorized by Thomas González · ${i.scopes?i.scopes.length:5} of ${i.scopes?i.scopes.length:5} requested scopes granted
          </div>
        ` : `
          <p style="font-size:13px;color:var(--t2);margin-bottom:14px">Clicking Continue will open ${escapeHtml(i.name)} in a popup. After you authorize, you'll be returned here.</p>
          ${i.scopes ? `
            <div class="field-label">Scopes that will be requested</div>
            <div class="scope-chips" style="margin-bottom:8px">${i.scopes.map(sc=>`<span class="scope-chip">${escapeHtml(sc)}</span>`).join('')}</div>
          ` : ''}
          <button class="btn btn-primary btn-sm" onclick="simulateOAuth()">Continue to ${escapeHtml(i.name)} →</button>
        `}
      `;
      footer = s.authenticated
        ? `<button class="btn btn-ghost btn-sm" onclick="drawerPrev()">← Back</button><button class="btn btn-primary btn-sm" onclick="drawerNext()">Continue →</button>`
        : `<button class="btn btn-ghost btn-sm" onclick="drawerPrev()">← Back</button>`;
    }
    else if (s.authMethod==='apikey') {
      body = `
        <div class="drawer-step-h">Step 2 of 4 · API token</div>
        <div class="drawer-step-title">Paste your ${escapeHtml(i.name)} token</div>
        <div class="field-group">
          <label class="field-label">${escapeHtml(i.name)} token</label>
          <input class="input" type="password" placeholder="xoxb-1234-abcd-…" value="${escapeHtml(s.apiKey)}" oninput="state.drawerState.apiKey=this.value;state.drawerState.apiKeyValid=false;paintDrawer();setTimeout(()=>{document.querySelector('.drawer input').focus()},0)"/>
          <div class="field-help">Find this in <a href="#" onclick="toast('Vendor docs opened');return false;">${escapeHtml(i.name)} → API settings ↗</a></div>
        </div>
        <div class="field-group">
          <label class="field-label">Display name (optional)</label>
          <input class="input" type="text" placeholder="Production workspace" value="${escapeHtml(s.displayName)}" oninput="state.drawerState.displayName=this.value"/>
        </div>
        ${s.apiKeyValid ? `
          <div class="connected-panel"><strong>✓ Valid token</strong>Connected to AIMS Workspace · ${i.scopes?i.scopes.length:5} scopes granted</div>
        ` : `
          <button class="btn btn-ghost btn-sm" onclick="testApiKey()">Test connection</button>
        `}
      `;
      footer = `<button class="btn btn-ghost btn-sm" onclick="drawerPrev()">← Back</button><button class="btn btn-primary btn-sm ${s.apiKeyValid?'':'btn-disabled'}" ${s.apiKeyValid?'':'disabled style="opacity:.5;cursor:not-allowed"'} onclick="drawerNext()">Continue →</button>`;
    }
    else {
      body = `
        <div class="drawer-step-h">Step 2 of 4 · Service account</div>
        <div class="drawer-step-title">Upload your service account key</div>
        <div class="field-group">
          ${s.authenticated ? `
            <div class="connected-panel"><strong>✓ Key validated</strong>Project: aims-prod · Account: ai-agent@aims.iam.gserviceaccount.com</div>
          ` : `
            <div style="border:2px dashed var(--line); border-radius:var(--r8); padding:32px; text-align:center; color:var(--t2); cursor:pointer" onclick="simulateServiceUpload()">
              <div style="font-size:24px;margin-bottom:6px">⬆</div>
              <div style="font-size:13px;color:var(--t1);font-weight:600;margin-bottom:4px">Drop or click to upload</div>
              <div style="font-size:11px">service-account-key.json</div>
            </div>
          `}
        </div>
      `;
      footer = `<button class="btn btn-ghost btn-sm" onclick="drawerPrev()">← Back</button><button class="btn btn-primary btn-sm ${s.authenticated?'':''}" ${s.authenticated?'':'disabled style="opacity:.5;cursor:not-allowed"'} onclick="drawerNext()">Continue →</button>`;
    }
  }

  else if (s.step === 3) {
    body = `
      <div class="drawer-step-h">Step 3 of 4 · Initial scope</div>
      <div class="drawer-step-title">Where should this integration be available?</div>
      <div class="field-group">
        ${Object.keys(STUDIO_META).map(k=>`
          <div class="checkbox-row" onclick="toggleDrawerStudio('${k}')">
            <div class="checkbox ${s.studios[k]?'checked':''}">${s.studios[k]?'✓':''}</div>
            <span>${STUDIO_META[k].label}</span>
            <span style="font-size:11px;color:var(--t3);margin-left:auto">${STUDIO_META[k].desc}</span>
          </div>
        `).join('')}
      </div>
      <div class="field-group" style="padding-top:14px;border-top:1px solid var(--line)">
        <div class="field-label">Who can use it?</div>
        <div style="font-size:12px;color:var(--t2);margin-bottom:8px">Workspace Admins only (default). Configure per-studio roles after connecting.</div>
      </div>
      <div class="field-group">
        <div class="checkbox-row" onclick="state.drawerState.allowPersonal=!state.drawerState.allowPersonal;paintDrawer()">
          <div class="checkbox ${s.allowPersonal?'checked':''}">${s.allowPersonal?'✓':''}</div>
          <span>Allow members to also connect their personal accounts</span>
        </div>
      </div>
    `;
    footer = `<button class="btn btn-ghost btn-sm" onclick="drawerPrev()">← Back</button><button class="btn btn-primary btn-sm" onclick="drawerNext()">Continue →</button>`;
  }

  else if (s.step === 4) {
    const studios = Object.keys(s.studios).filter(k=>s.studios[k]).map(k=>STUDIO_META[k].label).join(', ');
    body = `
      <div class="drawer-step-h">Step 4 of 4 · Confirm</div>
      <div class="drawer-step-title">Review and connect</div>
      <div class="confirm-summary">
        <strong>${escapeHtml(i.name)}</strong> will be available in <strong>${escapeHtml(studios||'no studios')}</strong>.<br>
        Authentication: <strong>${s.authMethod==='oauth'?'OAuth 2.0':s.authMethod==='apikey'?'API token':'Service account'}</strong>${s.displayName?' · "'+escapeHtml(s.displayName)+'"':''}.<br>
        ${i.capabilities.length} ${i.capabilities.length===1?'capability':'capabilities'} enabled · Visible to Workspace Admins.<br>
        Personal connections ${s.allowPersonal?'<strong style="color:var(--green)">allowed</strong>':'<strong style="color:var(--t3)">disabled</strong>'}.
      </div>
      <p style="font-size:12px;color:var(--t2)">After connecting, you can refine per-studio roles, manage capabilities and view audit events.</p>
    `;
    footer = `<button class="btn btn-ghost btn-sm" onclick="drawerPrev()">← Back</button><button class="btn btn-primary" onclick="finalizeConnect()">Connect ${escapeHtml(i.name)}</button>`;
  }

  d.innerHTML = `
    <div class="drawer-head">
      ${logo(i, 'sm')}
      <div class="drawer-title">Connect ${escapeHtml(i.name)}</div>
      <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>
    <div class="drawer-body">${body}</div>
    <div class="drawer-foot">${footer}</div>
  `;
}

function selectAuth(m){ state.drawerState.authMethod = m; paintDrawer() }
function drawerNext(){ state.drawerState.step++; paintDrawer() }
function drawerPrev(){ state.drawerState.step--; paintDrawer() }
function toggleDrawerStudio(k){ state.drawerState.studios[k] = !state.drawerState.studios[k]; paintDrawer() }
function simulateOAuth(){
  toast('Opening OAuth popup…','success');
  setTimeout(()=>{ state.drawerState.authenticated = true; paintDrawer() }, 800);
}
function testApiKey(){
  if(!state.drawerState.apiKey){ toast('Paste a token first','error'); return }
  toast('Testing token…');
  setTimeout(()=>{ state.drawerState.apiKeyValid = true; paintDrawer() }, 600);
}
function simulateServiceUpload(){
  toast('Validating key file…');
  setTimeout(()=>{ state.drawerState.authenticated = true; paintDrawer() }, 600);
}
function finalizeConnect(){
  const s = state.drawerState; const i = s.integration;
  i.connected = true; i.health = 'healthy'; i.lastRun = 'just now'; i.errors24h = 0;
  i.connectedBy = {name:'Thomas González', initials:'TG'}; i.connectedAt = 'just now';
  i.studios = {...s.studios};
  i.allowPersonal = s.allowPersonal;
  closeDrawer();
  toast(`${i.name} connected ✓`, 'success');
  navigate(`#/integrations/${i.slug}`);
}

/* ====================== AUDIT (full) ====================== */

let auditFilters = { severity:new Set(), eventTypes:new Set(), dateRange:'30d', search:'', expanded:null };

function renderAudit() {
  let events = AUDIT_EVENTS;
  if (auditFilters.severity.size>0) events = events.filter(e=>auditFilters.severity.has(e.sev));
  if (auditFilters.search) {
    const q = auditFilters.search.toLowerCase();
    events = events.filter(e => (e.event||'').toLowerCase().includes(q) || (e.actor||'').toLowerCase().includes(q) || (e.resource||'').toLowerCase().includes(q));
  }

  $('content').innerHTML = `
    <div class="breadcrumb">
      <a href="#/integrations">Settings</a>
      <span class="crumb-sep">›</span>
      <span>Workspace</span>
      <span class="crumb-sep">›</span>
      <span class="crumb-current">Audit log</span>
    </div>

    <div class="ph">
      <div class="ph-top">
        <div class="ph-text">
          <div class="ph-h1">Audit log</div>
          <div class="ph-sub">Workspace-wide events for the last 90 days. Export to CSV or stream via webhook.</div>
        </div>
        <div class="ph-actions">
          <button class="btn btn-ghost btn-sm" onclick="toast('Webhook export drawer opened')">Configure webhook export</button>
          <button class="btn btn-primary btn-sm" onclick="toast('CSV exported','success')">Export CSV</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="audit-filters">
        <div class="audit-filter">
          <span>Date range:</span>
          <select class="audit-filter-input">
            <option>Last 30 days</option><option>Last 7 days</option><option>Last 90 days</option><option>Custom…</option>
          </select>
        </div>
        <div class="audit-filter">
          <span>Severity:</span>
          ${['info','warn','crit'].map(sev=>`<button class="pill ${auditFilters.severity.has(sev)?'active':''}" style="font-size:11px;padding:3px 9px" onclick="toggleAuditSev('${sev}')">${sev==='info'?'Info':sev==='warn'?'Warning':'Critical'}</button>`).join('')}
        </div>
        <div class="audit-filter" style="flex:1;min-width:200px">
          <input class="audit-filter-input" type="text" placeholder="Search by event, actor, resource…" value="${escapeHtml(auditFilters.search)}" oninput="auditFilters.search=this.value;renderAudit();setTimeout(()=>{const i=document.querySelector('.audit-filter input[type=text]');if(i){i.focus();i.setSelectionRange(this.value.length,this.value.length)}},0)"/>
        </div>
        <span class="audit-count">Showing ${events.length} of ${AUDIT_EVENTS.length} events</span>
      </div>

      ${events.length===0 ? `
        <div class="empty"><div class="empty-h">No events match these filters</div><div class="empty-p">Try widening the date range.</div></div>
      ` : auditTable(events, true)}
    </div>
  `;
}

function auditTable(events, full) {
  return `
    <table class="audit-table">
      <thead>
        <tr>
          <th style="width:120px">Timestamp</th>
          <th style="width:80px">Severity</th>
          <th>Event</th>
          <th>Actor</th>
          ${full?'<th>Resource</th>':''}
          <th>Studio</th>
          ${full?'<th>IP</th>':''}
          <th style="width:30px"></th>
        </tr>
      </thead>
      <tbody>
        ${events.map((e, idx) => `
          <tr onclick="toggleAuditExpand(${idx})">
            <td title="${escapeHtml(e.tsAbs||'')}">${escapeHtml(e.ts)}</td>
            <td><span class="audit-ev ${e.sev==='info'?'info':e.sev==='warn'?'warn':'crit'}">${e.sev.toUpperCase()}</span></td>
            <td><span class="audit-ev">${escapeHtml(e.event)}</span></td>
            <td><div class="audit-actor">${e.actorType==='agent'?'<span style="color:var(--purple);font-weight:600">🤖</span>':e.actorType==='system'?'<span style="color:var(--t3)">⚙</span>':'<div class="av" style="width:18px;height:18px;border-radius:50%;background:var(--grad);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">'+(e.actor[0]||'').toUpperCase()+'</div>'}<span>${escapeHtml(e.actor)}</span></div></td>
            ${full?`<td>${e.resource?'<a href="#/integrations/'+e.resource+'" style="color:var(--accent);text-decoration:none" onclick="event.stopPropagation()">'+escapeHtml(e.resource)+'</a>':'<span style="color:var(--t3)">—</span>'}</td>`:''}
            <td>${e.studio?'<span style="font-size:11px;color:var(--t2)">'+STUDIO_META[e.studio].label+'</span>':'<span style="color:var(--t3)">—</span>'}</td>
            ${full?`<td style="color:var(--t3);font-family:'SF Mono',Menlo,monospace;font-size:11px">${e.ip||'—'}</td>`:''}
            <td><svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="color:var(--t3);transition:transform .15s;${auditFilters.expanded===idx?'transform:rotate(180deg)':''}"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></td>
          </tr>
          ${auditFilters.expanded===idx ? `
            <tr><td colspan="${full?8:6}" style="padding:8px 12px 14px">
              <div class="audit-expand">${escapeHtml(JSON.stringify({timestamp:e.tsAbs, severity:e.sev, event:e.event, actor:e.actor, resource:e.resource, studio:e.studio, ip:e.ip, details:e.details}, null, 2))}</div>
              <div style="margin-top:6px;display:flex;gap:6px">
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toast('Event ID copied to clipboard','success')">Copy event ID</button>
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toast('cURL copied to clipboard','success')">Copy as cURL</button>
              </div>
            </td></tr>
          ` : ''}
        `).join('')}
      </tbody>
    </table>
  `;
}

function toggleAuditSev(sev) { auditFilters.severity.has(sev) ? auditFilters.severity.delete(sev) : auditFilters.severity.add(sev); renderAudit() }
function toggleAuditExpand(idx) { auditFilters.expanded = auditFilters.expanded===idx ? null : idx; renderAudit() }

function addWebhookAction() {
  const name = prompt('Action name (slug):'); if(!name) return;
  webhookState.actions.push({ name, method:'POST', url:'https://api.example.com/'+name });
  renderBuildWebhook();
}

function publishWebhook() {
  const s = webhookState;
  if(!s.name || !s.category){ toast('Name and category are required','error'); return }
  const slug = s.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  INTEGRATIONS.push({
    slug, name:s.name, vendor:'Built by your workspace', category:s.category, color:'#06B6D4',
    desc:s.desc||'Private workspace integration.',
    capabilities:[...webhookState.capabilities], authMethods:[s.auth==='none'?'apikey':'apikey'],
    source:'private', connected:false
  });
  toast(`${s.name} published as a Private integration ✓`,'success');
  webhookState.step = 1; webhookState.name=''; webhookState.desc=''; webhookState.actions=[];
  navigate('#/integrations');
}

    { icon:'💡', text:'Suggest a workflow for this' },
    { icon:'🔄', text:'Compare with similar integrations' },
    { icon:'📚', text:'Show example use cases' },
    { icon:'⚙', text:'Best practices for this integration' }
  ]
};

function aiAnswer(prompt, i) {
  const p = prompt.toLowerCase();

  // 1. Connect securely
  if ((p.includes('connect') || p.includes('setup') || p.includes('install')) && (p.includes('secur') || p.includes('how'))) {
    const method = i.authMethods.includes('oauth') ? 'OAuth 2.0' : i.authMethods.includes('apikey') ? 'API token' : 'Service account';
    return `For ${i.name}, the most secure connection method is **${method}**.\n\nHere's the recommended flow:\n\n1. Use ${method} (not legacy auth)\n2. Grant only minimum required scopes\n3. Enable scope-based audit logging\n4. Rotate credentials every 90 days\n5. Restrict usage to specific studios + roles\n\nWant me to walk you through it? I can open the Connect drawer with secure defaults pre-selected.`;
  }

  // 2. What can agents do
  if ((p.includes('what can') || p.includes('what does') || p.includes('agent') || p.includes('use'))) {
    const caps = (i.capabilities||[]).map(c => `**${CAP_META[c].label}**`).join(', ');
    let body = `${i.name} exposes ${i.capabilities.length} ${i.capabilities.length===1?'capability':'capabilities'}: ${caps}.\n\n`;
    if (i.capabilities.includes('tools')) body += `**Tools** — agents can invoke ${i.tools?.length||'multiple'} actions${i.tools? ': ' + i.tools.slice(0,3).map(t=>'`'+t.name+'`').join(', ') + (i.tools.length>3?` and ${i.tools.length-3} more.`:'.') : '.'}\n\n`;
    if (i.capabilities.includes('knowledge')) body += `**Knowledge** — index ${i.name} as a searchable source for Governance.\n\n`;
    if (i.capabilities.includes('triggers')) body += `**Triggers** — wake agents on ${i.name} events.\n\n`;
    if (i.capabilities.includes('channels')) body += `**Channels** — agents can send outputs to ${i.name}.\n\n`;
    body += `Top use case in workspaces like yours: routing escalations from agents to the right team via ${i.name}.`;
    return body;
  }

  // 3. Recent activity / issues
  if (p.includes('recent') || p.includes('issue') || p.includes('error') || p.includes('activity') || p.includes('health')) {
    if (!i.connected) return `${i.name} is not connected yet. Once you connect it, I can show recent activity, errors, and usage patterns from the audit log.`;
    const events = AUDIT_EVENTS.filter(e => e.resource===i.slug);
    let body = `Health check for ${i.name}: **${i.health==='healthy'?'Healthy ✓':i.health==='degraded'?'Degraded ⚠':'Failed ✕'}**\n\n`;
    body += `**Last 24h:** ${i.errors24h||0} errors, last successful call ${i.lastRun}.\n\n`;
    if (events.length > 0) {
      body += `**Recent events (${events.length}):**\n`;
      events.slice(0,3).forEach(e => { body += `• ${e.ts} — \`${e.event}\` by ${e.actor}\n`; });
    }
    if (i.health === 'degraded') body += `\n💡 **My take:** the degradation looks transient. I'd watch it for the next hour before rotating credentials.`;
    if (i.health === 'failed') body += `\n💡 **My take:** the credentials likely expired. Want me to guide you through rotation?`;
    if (i.health === 'healthy') body += `\n💡 **My take:** everything looks good. No action needed.`;
    return body;
  }

  // 4. Permissions
  if (p.includes('permission') || p.includes('scope') || p.includes('access')) {
    let body = `For ${i.name}, the **least-privilege** recommendation depends on what your agents will do:\n\n`;
    if (i.scopes) body += `**Currently requested scopes:** ${i.scopes.map(s=>'`'+s+'`').join(', ')}\n\n`;
    body += `**Per studio:**\n`;
    body += `• **Agentic** — restrict to ${i.rolesAg?.[0]||'specific roles'} that actually invoke ${i.name}\n`;
    body += `• **Governance** — read-only access if you're using it as knowledge source\n`;
    body += `• **Workforce** — channel-write only for notifications\n\n`;
    body += `💡 I detected that 4 of the current scopes are unused by any agent. Want me to suggest a tighter set?`;
    return body;
  }

  // Follow-up: workflow suggestion
  if (p.includes('workflow') || p.includes('suggest a')) {
    return `Here's a workflow idea using ${i.name}:\n\n**"Auto-escalate critical issues to humans"**\n\n1. **Trigger** — a customer submits feedback containing sentiment < -0.7\n2. **Action** — agent enriches with customer context from CRM\n3. **${i.name}** — agent posts an alert with context to your ops channel\n4. **Wait** — workflow pauses for human acknowledgment\n5. **Resume** — if ack within 5min → continue; otherwise escalate\n\nWant me to scaffold this in Agentic Studio? I can pre-fill the nodes for you.`;
  }

  // Follow-up: compare
  if (p.includes('compare') || p.includes('similar') || p.includes('alternative')) {
    return `Comparable integrations in our catalog:\n\n• **Same category** as ${i.name} — see the ${(CATEGORIES.find(c=>c.slug===i.category)||{}).label} section\n• **Most-used alternative** by similar workspaces (industry, size) — depends on your stack\n\nWant a side-by-side comparison table? I can pull capabilities, auth methods, and recent reliability scores.`;
  }

  // Follow-up: use cases
  if (p.includes('use case') || p.includes('example')) {
    const cases = (i.useCases || defaultUseCases(i));
    return `Common use cases for ${i.name} in workspaces like yours:\n\n${cases.map((c,idx)=>`${idx+1}. ${c}`).join('\n')}\n\nWant me to dig into a specific one with implementation details?`;
  }

  // Follow-up: best practices
  if (p.includes('best practice') || p.includes('practice')) {
    return `Best practices for ${i.name}:\n\n1. **Secure by default** — OAuth over API keys when possible\n2. **Audit before broadening scope** — start narrow, expand on demand\n3. **Tag for compliance** — mark PII-touching integrations explicitly\n4. **Rate limit at the AIMS layer** — protect ${i.name} from agent loops\n5. **Health alerts** — wire degraded states to your on-call channel\n\nAnything specific you want to dive into?`;
  }

  // Default fallback
  return `Great question about **${i.name}**. Let me give you the relevant context:\n\n${i.desc}\n\n${i.connected ? `It's currently **${i.health||'connected'}** with ${i.errors24h||0} errors in the last 24h.` : `It's **not connected** yet.`}\n\nWhat angle would help most — security, capabilities, troubleshooting, or implementation?`;
}

function openAIDrawer(slug) {
  const i = findIntegration(slug);
  if (!i) return;
  aiState = { slug, history:[], typing:false };
  paintAIDrawer();
  $('aiOverlay').classList.add('open');
  $('aiDrawer').classList.add('open');
  setTimeout(() => { const inp = document.querySelector('.ai-input'); if (inp) inp.focus(); }, 300);
}

function closeAIDrawer() {
  $('aiOverlay').classList.remove('open');
  $('aiDrawer').classList.remove('open');
}

function paintAIDrawer() {
  const i = findIntegration(aiState.slug); if (!i) return;
  const d = $('aiDrawer');

  const greeting = `Hi! I'm your integration assistant. I have full context on **${i.name}** — its capabilities, current health, permissions, and how it fits in your workspace. Ask me anything.`;

  const suggestions = aiState.history.length === 0 ? AI_SUGGESTIONS.initial : AI_SUGGESTIONS.followUp;
  const showSuggestions = !aiState.typing && (aiState.history.length === 0 || aiState.history[aiState.history.length-1].role === 'ai');

  d.innerHTML = `
    <div class="ai-head">
      <div class="ai-head-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c.5 0 1 .4 1.1.9l1.1 4.9c.1.3.3.5.6.6l4.9 1.1c.5.1.9.6.9 1.1s-.4 1-.9 1.1l-4.9 1.1c-.3.1-.5.3-.6.6l-1.1 4.9c-.1.5-.6.9-1.1.9s-1-.4-1.1-.9l-1.1-4.9c-.1-.3-.3-.5-.6-.6l-4.9-1.1c-.5-.1-.9-.6-.9-1.1s.4-1 .9-1.1l4.9-1.1c.3-.1.5-.3.6-.6l1.1-4.9c.1-.5.6-.9 1.1-.9z" fill="#fff"/></svg>
      </div>
      <div class="ai-head-text">
        <div class="ai-head-title">AIMS Assistant <span class="ai-head-status">● Live</span></div>
        <div class="ai-head-sub">Asking about ${escapeHtml(i.name)}</div>
      </div>
      <button class="ai-close" onclick="closeAIDrawer()" aria-label="Close">×</button>
    </div>

    <div class="ai-conv" id="aiConv">
      <div class="ai-msg ai">
        <div class="ai-msg-av ai">AI</div>
        <div class="ai-msg-bubble">${aiRender(greeting)}</div>
      </div>
      ${aiState.history.map(m => `
        <div class="ai-msg ${m.role}">
          <div class="ai-msg-av ${m.role}">${m.role==='ai'?'AI':'TH'}</div>
          <div class="ai-msg-bubble">${m.role==='ai' ? (m.streaming ? '<span class="ai-typing"><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span></span>' : aiRender(m.text)) : escapeHtml(m.text)}</div>
        </div>
      `).join('')}
    </div>

    ${showSuggestions ? `
      <div class="ai-suggested">
        ${suggestions.map(s => `<button class="ai-chip" onclick="aiAsk('${escapeHtml(s.text).replace(/'/g, "\\'")}')"><span>${s.icon}</span>${escapeHtml(s.text)}</button>`).join('')}
      </div>
    ` : ''}

    <div class="ai-input-wrap">
      <form class="ai-input-form" onsubmit="aiSubmitForm(event)">
        <input class="ai-input" type="text" placeholder="Ask about ${escapeHtml(i.name)}…" id="aiInput" ${aiState.typing?'disabled':''}/>
        <button class="ai-send" type="submit" ${aiState.typing?'disabled':''} aria-label="Send">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="ai-footer-hint">AIMS-OS Assistant · Responses are simulated for demo</div>
    </div>
  `;

  const conv = $('aiConv');
  if (conv) conv.scrollTop = conv.scrollHeight;
}

function aiSubmitForm(e) {
  e.preventDefault();
  const inp = $('aiInput');
  const text = inp.value.trim();
  if (text) aiAsk(text);
  return false;
}

function aiAsk(text) {
  if (aiState.typing) return;
  aiState.history.push({ role:'user', text });
  aiState.typing = true;
  aiState.history.push({ role:'ai', text:'', streaming:true });
  paintAIDrawer();

  // Generate response then stream it
  const i = findIntegration(aiState.slug);
  const fullText = aiAnswer(text, i);

  setTimeout(() => {
    aiState.history[aiState.history.length-1].text = fullText;
    aiStreamLast();
  }, 700 + Math.random()*400);
}

function aiStreamLast() {
  const last = aiState.history[aiState.history.length-1];
  if (!last || last.role !== 'ai') return;
  const fullText = last.text;
  const bubbles = document.querySelectorAll('#aiConv .ai-msg.ai .ai-msg-bubble');
  const bubble = bubbles[bubbles.length-1];
  if (!bubble) return;

  let idx = 0;
  bubble.innerHTML = '';
  const interval = setInterval(() => {
    idx += 3 + Math.floor(Math.random()*4); // 3-6 chars per tick for speed
    if (idx >= fullText.length) {
      clearInterval(interval);
      bubble.innerHTML = aiRender(fullText);
      last.streaming = false;
      aiState.typing = false;
      paintAIDrawer();
      return;
    }
    bubble.textContent = fullText.slice(0, idx);
    const conv = $('aiConv');
    if (conv) conv.scrollTop = conv.scrollHeight;
  }, 18);
}

function aiRender(text) {
  // Minimal markdown: **bold**, `code`, line breaks
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  return html;
}

/* ====================== MOBILE SSB TOGGLE ====================== */

function toggleSsb(){
  const ssb = document.querySelector('.ssb');
  const bd = $('ssbBackdrop');
  if(!ssb) return;
  const willOpen = !ssb.classList.contains('open');
  ssb.classList.toggle('open', willOpen);
  bd.classList.toggle('open', willOpen);
}
function closeSsb(){
  document.querySelector('.ssb')?.classList.remove('open');
  $('ssbBackdrop')?.classList.remove('open');
}

// Auto-close ssb on navigation in mobile
window.addEventListener('hashchange', () => {
  if (window.innerWidth <= 1024) closeSsb();
});

/* ====================== BOOT ====================== */

window.addEventListener('hashchange', route);
document.querySelectorAll('.ssb-item:not(.disabled)').forEach(b => {
  b.addEventListener('click', () => {
    const r = b.dataset.route;
    if (r==='integrations') navigate('#/integrations');
    else if (r==='audit') navigate('#/audit');
    else if (r==='personal') navigate('#/personal');
  });
});
document.querySelectorAll('.ssb-item.disabled').forEach(b => {
  b.addEventListener('click', () => toast(`${b.querySelector('.ssb-label').textContent} — Coming soon`, 'success'));
});

route();
</script>
