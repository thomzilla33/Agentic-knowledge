<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AIMS-OS · Data Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0d1a; --bg2:#0f172e; --bg3:#0d1323;
  --t1:#F1F5F9; --t2:#94A3B8; --t3:#64748B;
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.14);
  --hover:rgba(255,255,255,0.04);
  --hover-strong:rgba(255,255,255,0.08);
  --emerald:#10B981; --cyan:#06B6D4; --amber:#FDC700; --red:#EF4444; --green:#05DF72; --purple:#A78BFA; --pink:#EC4899; --accent:#2B7FFF;
  --shell-topbar-bg:rgba(10,13,26,0.72);
  --r4:4px; --r8:8px; --r10:10px;
  --grad-app:linear-gradient(135deg,#10B981 0%,#06B6D4 100%);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%; overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--t1); font-size:14px}

/* ── TOPBAR ── */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  height:52px; padding:0 16px;
  display:flex; align-items:center; gap:14px;
  background:var(--shell-topbar-bg);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--line);
}
.tb-left{display:flex; align-items:center; gap:10px; min-width:0}
.tb-menu-btn{
  background:transparent; border:none; width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  color:var(--t2); cursor:pointer; border-radius:8px;
}
.tb-menu-btn:hover{background:var(--hover); color:var(--t1)}
.tb-context{display:flex; align-items:center; gap:8px; background:transparent; border:none; cursor:pointer; color:var(--t1); font-family:inherit; height:34px; padding:0 9px 0 6px; border-radius:8px}
.tb-context:hover{background:var(--hover)}
.tb-context-logo{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; background:var(--grad-app)}
.tb-context-name{font-size:13px; font-weight:700; color:var(--t1); white-space:nowrap}
.tb-context-chev{color:var(--t2); flex-shrink:0}

.tb-search-btn{
  flex:1; max-width:340px; height:32px;
  background:var(--hover); border:1px solid var(--line);
  border-radius:8px; padding:0 6px 0 10px;
  color:var(--t3); font-family:inherit; font-size:13px;
  cursor:pointer; display:flex; align-items:center; gap:8px;
  text-align:left;
}
.tb-search-btn:hover{background:var(--hover-strong); border-color:var(--line-strong)}
.tb-search-placeholder{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-search-kbd{font-family:inherit; font-size:10px; font-weight:600; padding:2px 5px; border-radius:4px; background:rgba(255,255,255,0.06); color:var(--t3); border:1px solid var(--line)}

.tb-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.icon-btn{width:32px; height:32px; border-radius:8px; background:transparent; border:none; color:var(--t2); cursor:pointer; display:flex; align-items:center; justify-content:center}
.icon-btn:hover{background:var(--hover); color:var(--t1)}
.tb-divider-v{width:1px; height:22px; background:var(--line); margin:0 4px}
.tb-ws-badge{display:inline-flex; align-items:center; gap:8px; padding:0 10px 0 6px; height:30px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--t1); font-family:inherit}
.tb-ws-badge-logo{width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,#06B6D4,#A78BFA); color:#fff; font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center}
.tb-ws-badge-name{font-size:12px; font-weight:600}
.avatar-sm{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#10B981,#06B6D4); color:#fff; font-size:11px; font-weight:800; border:none; cursor:pointer}

.tb-cross-link{
  display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px;
  background:rgba(6,182,212,0.08); color:var(--cyan);
  border:1px solid rgba(6,182,212,0.28); border-radius:8px;
  text-decoration:none; font-size:11.5px; font-weight:700; letter-spacing:.01em;
  transition:background .15s, border-color .15s;
}
.tb-cross-link:hover{background:rgba(6,182,212,0.14); border-color:rgba(6,182,212,0.45)}

/* ── APP LAYOUT ── */
.app{display:flex; height:100vh; padding-top:52px}
.sidebar{
  width:54px; flex-shrink:0;
  background:var(--bg2); border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center;
  padding:12px 0; gap:6px;
}
.sb-item{
  width:36px; height:36px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; cursor:pointer;
  color:var(--t2); transition:background .15s, color .15s;
}
.sb-item:hover{background:var(--hover); color:var(--t1)}
.sb-item.active{background:rgba(16,185,129,0.10); color:var(--emerald); box-shadow:inset 0 0 0 1px rgba(16,185,129,0.30)}
.sb-divider{width:24px; height:1px; background:var(--line); margin:6px 0}

.ssb{
  width:240px; flex-shrink:0;
  background:var(--bg); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.ssb-h{
  padding:16px 16px 12px; border-bottom:1px solid var(--line);
}
.ssb-h-eyebrow{font-size:10px; font-weight:800; color:var(--emerald); letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px}
.ssb-h-title{font-size:16px; font-weight:800; color:var(--t1); letter-spacing:-.01em}
.ssb-h-sub{font-size:11px; color:var(--t3); margin-top:3px; line-height:1.5}

.ssb-scroll{flex:1; overflow-y:auto; padding:8px 0}
.ssb-group{padding:6px 0}
.ssb-group + .ssb-group{margin-top:4px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.04)}
.ssb-grp-label{
  display:block; padding:4px 16px 6px;
  font-size:10.5px; font-weight:700; color:var(--t3);
  text-transform:uppercase; letter-spacing:.06em;
}
.ssb-item{
  display:flex; align-items:center; gap:10px;
  padding:7px 12px; margin:1px 8px;
  background:transparent; border:none; cursor:pointer;
  color:var(--t1); font-family:inherit; font-size:13px;
  text-align:left; border-radius:7px;
  width:calc(100% - 16px);
  transition:background .12s, color .12s;
}
.ssb-item:hover{background:var(--hover)}
.ssb-item.active{background:rgba(16,185,129,0.10); color:var(--emerald); font-weight:600}
.ssb-item-ico{width:16px; height:16px; flex-shrink:0; color:currentColor}
.ssb-item-label{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ssb-item-badge{
  font-size:8.5px; font-weight:700; padding:2px 6px; border-radius:8px;
  letter-spacing:.05em; line-height:1; text-transform:uppercase;
  background:rgba(167,139,250,0.10); color:var(--purple);
  border:1px solid rgba(167,139,250,0.22);
}
.ssb-item.disabled{opacity:.55; cursor:not-allowed}
.ssb-item-alert{
  width:7px; height:7px; border-radius:50%;
  background:var(--amber); box-shadow:0 0 0 3px rgba(253,199,0,0.15);
}

/* ── CONTENT ── */
.content{flex:1; overflow-y:auto; padding-bottom:60px}

/* Breadcrumb */
.breadcrumb{display:flex; align-items:center; gap:7px; padding:16px 32px 0; font-size:12px; color:var(--t2)}
.breadcrumb a{color:var(--t2); text-decoration:none}
.breadcrumb a:hover{color:var(--t1)}
.crumb-sep{color:var(--t3)}
.crumb-current{color:var(--t1); font-weight:500}

/* ── Hero (Connections list page) ── */
.ds-hero{
  display:flex; gap:32px; align-items:flex-start; justify-content:space-between;
  padding:28px 32px 24px;
  border-bottom:1px solid var(--line);
}
.ds-hero-left{flex:1; min-width:0}
.ds-hero-eyebrow{display:inline-flex; align-items:center; gap:8px; margin-bottom:10px}
.ds-mode-tag{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px;
  background:rgba(16,185,129,0.12); color:var(--emerald);
  border:1px solid rgba(16,185,129,0.30); border-radius:11px;
  font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
}
.ds-hero-sub{font-size:12px; color:var(--t3); font-weight:500}
.ds-hero-title{font-size:28px; font-weight:800; color:var(--t1); margin-bottom:6px; letter-spacing:-.02em; line-height:1.15}
.ds-hero-desc{font-size:14px; color:var(--t2); line-height:1.55; max-width:560px}
.ds-hero-right{display:flex; gap:22px; flex-shrink:0; padding-left:22px; border-left:1px solid var(--line)}
.ds-kpi{text-align:right}
.ds-kpi-n{font-size:26px; font-weight:800; line-height:1; letter-spacing:-.02em}
.ds-kpi-l{font-size:10.5px; color:var(--t3); margin-top:4px; text-transform:uppercase; letter-spacing:.05em; font-weight:600}

/* Connections grid (list view) */
.ds-section{padding:24px 32px 36px}
.ds-section-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
.ds-section-title{font-size:16px; font-weight:700; color:var(--t1); letter-spacing:-.01em}
.ds-section-sub{font-size:12px; color:var(--t3); margin-top:2px}
.ds-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.ds-card{
  position:relative;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  padding:18px 18px 14px;
  cursor:pointer; transition:border-color .15s, background .15s;
  display:flex; flex-direction:column; gap:10px;
}
.ds-card:hover{border-color:var(--line-strong); background:var(--hover)}
.ds-card.is-pending{border-color:rgba(253,199,0,0.30); background:color-mix(in srgb, var(--amber) 4%, var(--bg2))}
.ds-card-row{display:flex; align-items:center; gap:12px}
.ds-card-logo{
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-size:13px; font-weight:800; color:#fff;
}
.ds-card-name{font-size:14px; font-weight:700; color:var(--t1)}
.ds-card-vendor{font-size:11.5px; color:var(--t3); margin-top:1px}
.ds-card-status{
  position:absolute; top:14px; right:14px;
  display:inline-flex; align-items:center; gap:5px;
  font-size:10px; font-weight:700; padding:3px 8px 3px 7px;
  border-radius:20px; line-height:1; letter-spacing:.01em;
}
.ds-card-status-dot{width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow:0 0 0 2px color-mix(in srgb, currentColor 18%, transparent)}
.ds-card-status.is-mapped{background:rgba(5,223,114,0.10); color:var(--green); border:1px solid rgba(5,223,114,0.25)}
.ds-card-status.is-pending{background:rgba(253,199,0,0.10); color:var(--amber); border:1px solid rgba(253,199,0,0.28)}
.ds-card-meta{display:flex; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--t3); margin-top:2px}
.ds-card-meta .dot{color:var(--line-strong)}
.ds-card-cta{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700; color:var(--emerald);
  background:transparent; border:none; cursor:pointer; padding:0;
  margin-top:4px; align-self:flex-start;
}
.ds-card-cta:hover{text-decoration:underline}

/* Empty + request anchor */
.ds-empty-banner{
  display:flex; align-items:center; gap:16px;
  padding:18px 22px; margin-bottom:18px;
  background:linear-gradient(135deg, rgba(6,182,212,0.05) 0%, rgba(16,185,129,0.05) 100%);
  border:1px dashed rgba(6,182,212,0.32); border-radius:12px;
}
.ds-empty-ic{width:42px; height:42px; border-radius:10px; background:rgba(6,182,212,0.12); color:var(--cyan); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.ds-empty-text{flex:1; min-width:0}
.ds-empty-t{font-size:14px; font-weight:700; color:var(--t1); margin-bottom:2px}
.ds-empty-d{font-size:12px; color:var(--t2); line-height:1.5}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px;
  font-family:inherit; font-size:13px; font-weight:700;
  border-radius:8px; cursor:pointer; border:1px solid transparent;
  transition:transform .12s, background .15s;
  text-decoration:none;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--emerald); color:#001f15; border-color:var(--emerald)}
.btn-primary:hover{background:#0ea676}
.btn-ghost{background:transparent; color:var(--t1); border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--hover)}
.btn-sm{height:30px; padding:0 12px; font-size:12px}

/* Soon banner inside placeholder sections */
.ds-placeholder{
  margin:24px 32px;
  padding:48px 32px; text-align:center;
  background:var(--bg2); border:1px dashed var(--line); border-radius:14px;
}
.ds-placeholder-ic{width:56px; height:56px; border-radius:14px; background:rgba(167,139,250,0.12); color:var(--purple); display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px}
.ds-placeholder-t{font-size:18px; font-weight:800; color:var(--t1); margin-bottom:6px; letter-spacing:-.01em}
.ds-placeholder-d{font-size:13px; color:var(--t2); line-height:1.55; max-width:520px; margin:0 auto 18px}
.ds-placeholder-meta{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; background:rgba(167,139,250,0.10); color:var(--purple); border:1px solid rgba(167,139,250,0.22); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}

/* ──────────────────────────────────────────────────────────
   CONNECTION DETAIL VIEW
   ────────────────────────────────────────────────────────── */
.cn-head{
  display:flex; align-items:center; gap:18px;
  padding:28px 32px 22px; border-bottom:1px solid var(--line);
}
.cn-head-logo{
  width:64px; height:64px; border-radius:14px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:#fff; padding:10px;
}
.cn-head-logo img{width:100%; height:100%; object-fit:contain}
.cn-head-text{flex:1; min-width:0}
.cn-head-name{font-size:22px; font-weight:800; color:var(--t1); letter-spacing:-.01em; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cn-head-vendor{font-size:13px; color:var(--t3); margin-top:3px}
.cn-head-meta{display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:10px; font-size:12px; color:var(--t2)}
.cn-head-meta strong{color:var(--t1); font-weight:600}
.cn-head-sep{color:var(--t3)}
.cn-head-actions{display:flex; gap:8px; flex-shrink:0}

.cn-tabs{
  display:flex; gap:2px; padding:0 32px;
  border-bottom:1px solid var(--line);
  background:var(--bg); position:sticky; top:0; z-index:5;
}
.cn-tab{
  padding:14px 16px; background:transparent; border:none; cursor:pointer;
  color:var(--t2); font-family:inherit; font-size:13px; font-weight:600;
  border-bottom:2px solid transparent; transition:color .12s, border-color .12s;
}
.cn-tab:hover{color:var(--t1)}
.cn-tab.active{color:var(--t1); border-bottom-color:var(--emerald)}

/* ──────────────────────────────────────────────────────────
   WIDGETS (matches settings.html .ov-widget chrome)
   ────────────────────────────────────────────────────────── */
.cn-body{padding:24px 32px 40px}
.ov-widget{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:14px;
  overflow:hidden;
}
.ov-widget:last-child{margin-bottom:0}
.ov-widget-h{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 18px 10px;
}
.ov-widget-title{
  font-size:14px; font-weight:700; color:var(--t1);
  letter-spacing:-0.005em; margin:0;
  display:inline-flex; align-items:center; gap:10px;
}
.ov-widget-eyebrow{
  font-size:10px; font-weight:700; color:var(--t3);
  text-transform:uppercase; letter-spacing:.08em;
}
.ov-widget-meta{
  font-size:11px; color:var(--t3); font-weight:500;
}
.ov-widget-actions{display:inline-flex; gap:6px; align-items:center}
.ov-widget-body{
  padding:0 18px 18px;
  font-size:13px; color:var(--t2); line-height:1.6;
}
.ov-widget-body p{margin:0; line-height:1.6}
.ov-widget-body p + p{margin-top:10px}

/* Drift / pending action banner inside a widget */
.cn-alert{
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; margin-bottom:14px;
  background:color-mix(in srgb, var(--amber) 8%, var(--bg2));
  border:1px solid color-mix(in srgb, var(--amber) 30%, transparent);
  border-radius:12px;
}
.cn-alert-ic{
  width:38px; height:38px; border-radius:10px;
  background:rgba(253,199,0,0.18); color:var(--amber);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.cn-alert-body{flex:1; min-width:0}
.cn-alert-t{font-size:14px; font-weight:700; color:var(--t1); margin-bottom:3px}
.cn-alert-d{font-size:12.5px; color:var(--t2); line-height:1.5}

/* Mapping editor (the centerpiece of Field Mapping tab) */
.map-event{
  background:var(--bg3); border-radius:10px; margin-bottom:12px; overflow:hidden;
  border:1px solid rgba(255,255,255,0.05);
}
.map-event-h{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
  background:rgba(255,255,255,0.02);
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.map-event-ic{
  width:30px; height:30px; border-radius:8px;
  background:rgba(16,185,129,0.10); color:var(--emerald);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.map-event-text{flex:1; min-width:0}
.map-event-name{
  font-family:'SF Mono',Menlo,monospace; font-size:12.5px; font-weight:600; color:var(--t1);
}
.map-event-sub{font-size:11px; color:var(--t3); margin-top:2px}
.map-event-stat{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; color:var(--t2); font-weight:500;
}
.map-event-stat strong{color:var(--t1); font-weight:700}
.map-event-chev{color:var(--t3); transition:transform .15s; flex-shrink:0}
.map-event-chev.open{transform:rotate(180deg)}
.map-event-body{padding:14px 16px}

/* Auto-mapped collapsed bar */
.map-auto-bar{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; margin-bottom:12px;
  background:rgba(5,223,114,0.06);
  border:1px solid rgba(5,223,114,0.22); border-radius:8px;
  cursor:pointer;
}
.map-auto-bar-ic{
  width:22px; height:22px; border-radius:50%;
  background:rgba(5,223,114,0.18); color:var(--green);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.map-auto-bar-text{flex:1; font-size:12.5px; color:var(--t1); font-weight:600}
.map-auto-bar-sub{font-size:11px; color:var(--t3); margin-top:1px; font-weight:500}
.map-auto-list{
  padding:10px 14px; margin-top:-6px; margin-bottom:12px;
  background:rgba(5,223,114,0.03); border:1px solid rgba(5,223,114,0.15); border-radius:8px;
  display:grid; grid-template-columns:1fr 1fr; gap:6px 16px;
  font-size:11.5px; color:var(--t2);
}
.map-auto-row{display:flex; gap:8px; align-items:center}
.map-auto-row code{font-family:'SF Mono',Menlo,monospace; font-size:10.5px; background:rgba(255,255,255,0.05); padding:1px 5px; border-radius:4px; color:var(--t1)}
.map-auto-row .arr{color:var(--t3)}

/* Custom field row in the mapping editor */
.map-custom-h{
  display:flex; align-items:center; gap:8px;
  margin-bottom:10px;
  font-size:12.5px; font-weight:700; color:var(--amber);
}
.map-custom-h-count{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 6px;
  background:rgba(253,199,0,0.16); color:var(--amber);
  border:1px solid rgba(253,199,0,0.30); border-radius:9px;
  font-size:10px; font-weight:800;
}
.map-row{
  display:grid; grid-template-columns:200px 22px 1fr; gap:10px;
  padding:12px 0; align-items:start;
}

.toast-container{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:8px}

@keyframes slidein{from{transform:translateX(10px);opacity:0}to{transform:translateX(0);opacity:1}}

function dsLogo(c, big) {
  if (c.logo) {
    return `<div class="${big?'cn-head-logo':'ds-card-logo'}"${big?'':' style="background:#fff; padding:6px"'}><img src="https://api.iconify.design/logos:${c.logo}.svg" alt="${escapeHtml(c.name)}" style="width:100%; height:100%; object-fit:contain" loading="lazy"/></div>`;
  }
  const initials = c.name.split(/[\s-]/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  if (big) return `<div class="cn-head-logo" style="background:${c.color}">${initials}</div>`;
  return `<div class="ds-card-logo" style="background:${c.color}">${initials}</div>`;

/* ====================== ROUTING (hash-based) ====================== */

let cnTab = 'mapping'; // default tab on connection detail

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h ? h.split('/') : [];
  return parts;
}

function navigate(routeOrFull) {
  // Accept either a top-level keyword ('connections', 'tables', ...) or a full hash
  if (routeOrFull && routeOrFull.startsWith('#')) {
    location.hash = routeOrFull.replace(/^#/, '');
    return;
  }
  location.hash = '/' + routeOrFull;
}

function paintSsbActive() {
  const parts = parseRoute();
  const route = parts[0] || 'connections';
  document.querySelectorAll('.ssb-item').forEach(b => b.classList.remove('active'));
  const ssbMap = { connections:'connections', tables:'tables', mappings:'mappings', schema:'schema', templates:'templates', onboarding:'onboarding' };
  const key = ssbMap[route] || 'connections';
  const el = document.querySelector(`.ssb-item[data-route="${key}"]`);
  if (el) el.classList.add('active');
}

function render() {
  const parts = parseRoute();
  paintSsbActive();
  $('content').scrollTop = 0;

  if (!parts[0] || parts[0] === 'connections') {
    if (parts[1]) return renderConnectionDetail(parts[1]);
    return renderConnections();
  }
  if (parts[0] === 'tables')      return renderPlaceholder('Tables', 'Define your data tables. Composite structures, schemas, calculated fields and template builders. Sebastian is finalizing this surface.');
  if (parts[0] === 'mappings')    return renderPlaceholder('Field mappings', 'Cross-connection mapping overview. For now, edit mappings inside each connection.');
  if (parts[0] === 'schema')      return renderPlaceholder('Schema versions', 'History of every table definition change, who made it and when.');
  if (parts[0] === 'templates')   return renderPlaceholder('Templates', 'Pre-built table definitions for common verticals (automotive, finance, healthcare).');
  if (parts[0] === 'onboarding')  return renderPlaceholder('Onboarding flow', 'Sebastian designed a setup flow for first-time Data Studio users.');

  renderConnections();
}

/* ====================== CONNECTIONS LIST ====================== */

function renderConnections() {
  const list = Object.values(DS_CONNECTIONS);

/* ====================== EVENT / MAPPING STATE ====================== */

const eventOpenState = {}; // key: slug:eIdx -> bool
const autoOpenState = {};  // key: slug:eIdx -> bool

function eventKey(slug, eIdx) { return slug + ':' + eIdx; }
function getEventOpen(slug, eIdx) {
  const k = eventKey(slug, eIdx);
  if (k in eventOpenState) return eventOpenState[k];
  // Default open: first event of each connection
  return eIdx === 0;
}
function getAutoOpen(slug, eIdx) {
  return !!autoOpenState[eventKey(slug, eIdx)];
}
function toggleEvent(slug, eIdx) {
  const k = eventKey(slug, eIdx);
  eventOpenState[k] = !getEventOpen(slug, eIdx);
  renderConnectionDetail(slug);
}
function toggleAutoSamples(slug, eIdx) {
  const k = eventKey(slug, eIdx);
  autoOpenState[k] = !autoOpenState[k];
  renderConnectionDetail(slug);
}
function setDecision(slug, eIdx, fIdx, decision) {
  DS_CONNECTIONS[slug].events[eIdx].custom[fIdx].decision = decision;
  renderConnectionDetail(slug);
}
function acceptAllSuggestions(slug) {
  const c = DS_CONNECTIONS[slug];
  c.events.forEach(e => e.custom.forEach(f => {
    if (!f.decision) f.decision = f.suggested ? 'accept' : 'create';
  }));
  toast('Accepted AI suggestions for all custom fields');
  renderConnectionDetail(slug);
}
function activateMapping(slug) {
  DS_CONNECTIONS[slug].mapped = true;
  DS_CONNECTIONS[slug].drift = false;
  // Auto-resolve any remaining undecided fields
  DS_CONNECTIONS[slug].events.forEach(e => e.custom.forEach(f => {
    if (!f.decision) f.decision = 'create';
  }));
  toast(escapeHtml(DS_CONNECTIONS[slug].name) + ' mapping activated — data is now flowing');
  renderConnectionDetail(slug);
}
